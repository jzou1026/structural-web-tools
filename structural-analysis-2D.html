<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useCallback, useEffect, useRef, useMemo } = React;

    // ── COLORS (extracted from suite master template, reused exactly) ─────────

      btn: (v="primary") => ({ background: v==="primary"?CLR.accent : v==="danger"?"#3d1f1f": v==="ghost"?"#21262d":"#21262d", color: v==="danger"?CLR.red : v==="primary"?"#000":CLR.text, border:`1px solid ${v==="danger"?CLR.red : v==="primary"?CLR.accent:CLR.border}`, borderRadius:6, padding:"8px 18px", cursor:"pointer", fontFamily:"inherit", fontSize:12, fontWeight:700 }),

      select: { background:"#0d1117", border:`1px solid ${CLR.border}`, borderRadius:4, color:CLR.text, fontFamily:"inherit", fontSize:12, padding:"6px 9px", outline:"none" },
    };

    const fmt0 = v => typeof v === "number" && isFinite(v) ? v.toFixed(0) : (isFinite(v)?v:"—");
    const fmt1 = v => typeof v === "number" && isFinite(v) ? v.toFixed(1) : (isFinite(v)?v:"—");
    const fmt2 = v => typeof v === "number" && isFinite(v) ? v.toFixed(2) : (isFinite(v)?v:"—");
    const fmt3 = v => typeof v === "number" && isFinite(v) ? v.toFixed(3) : (isFinite(v)?v:"—");
    const fmt4 = v => typeof v === "number" && isFinite(v) ? v.toFixed(4) : (isFinite(v)?v:"—");
    const fmt6 = v => typeof v === "number" && isFinite(v) ? v.toFixed(6) : (isFinite(v)?v:"—");

    // ── UNIT SYSTEM ───────────────────────────────────────────────────────────
    // Internal storage is always canonical N / mm (force / length). Every input and
    // result is converted to/from the user's chosen display units at the UI boundary,
    // using dimensional exponents (force^f * length^l) — this covers any force/length
    // combination (SI, US customary, or mixed) without touching the solver itself.
    const FORCE_UNITS = { N: 1, kN: 1000, lbf: 4.4482216153, kip: 4448.2216153, kgf: 9.80665, tonf: 9806.65 };
    const LENGTH_UNITS = { mm: 1, cm: 10, m: 1000, in: 25.4, ft: 304.8 };
    const FORCE_UNIT_LIST = ["N","kN","lbf","kip","kgf","tonf"];
    const LENGTH_UNIT_LIST = ["mm","cm","m","in","ft"];
    const DIM = {
      length: { f:0, l:1 }, area: { f:0, l:2 }, inertia: { f:0, l:4 },
      pressure: { f:1, l:-2 }, force: { f:1, l:0 }, moment: { f:1, l:1 },
      distLoad: { f:1, l:-1 }, none: { f:0, l:0 },
    };
    function unitFactor(force, length, dim){ return Math.pow(FORCE_UNITS[force], dim.f) * Math.pow(LENGTH_UNITS[length], dim.l); }
    function toDisplay(baseValue, units, dim){ return baseValue / unitFactor(units.force, units.length, dim); }
    function toBaseVal(dispValue, units, dim){ return dispValue * unitFactor(units.force, units.length, dim); }
    function unitLabel(units, dim){
      const parts = [];
      if(dim.f===1) parts.push(units.force);
      if(dim.l===1) parts.push(units.length);
      if(dim.l===-1) parts.push("/"+units.length);
      if(dim.l===-2) parts.push("/"+units.length+"²");
      if(dim.l===2) parts.push(units.length+"²");
      if(dim.l===4) parts.push(units.length+"⁴");
      if(dim.f===0 && dim.l===0) return "—";
      return parts.join("·").replace("·/","/");
    }

    // ── DEFAULT DATA — Kassimali Fig. P17.9 portal frame (validated against the
    // published Q1/Q2/Q3 member end-action answer key — see solver validation notes) ─
    const DEFAULT_UNITS = { force: "kip", length: "in" };
    const B = (v, dim) => toBaseVal(v, DEFAULT_UNITS, dim); // author default data directly in the textbook's units

    const DEFAULT_NODES = [
      { id:1, label:"1", x:B(0,DIM.length),   y:B(0,DIM.length),   ux:1, uy:1, rz:1 },
      { id:2, label:"2", x:B(0,DIM.length),   y:B(360,DIM.length), ux:0, uy:0, rz:0 },
      { id:3, label:"3", x:B(480,DIM.length), y:B(360,DIM.length), ux:0, uy:0, rz:0 },
      { id:4, label:"4", x:B(480,DIM.length), y:B(0,DIM.length),   ux:1, uy:1, rz:1 },
    ];
    const DEFAULT_MEMBERS = [
      { id:1, label:"1", near:"1", far:"2", E:B(29000,DIM.pressure), A:B(15,DIM.area), I:B(900,DIM.inertia),  fixity:"Fix-Fix" },
      { id:2, label:"2", near:"2", far:"3", E:B(29000,DIM.pressure), A:B(30,DIM.area), I:B(1800,DIM.inertia), fixity:"Fix-Fix" },
      { id:3, label:"3", near:"4", far:"3", E:B(29000,DIM.pressure), A:B(15,DIM.area), I:B(900,DIM.inertia),  fixity:"Fix-Fix" },
    ];
    const LOAD_CASE_TYPES = ["Dead","Live","Roof Live","Snow","Wind","Seismic","Temperature","Construction","Other"];
    const COMBINATION_TYPES = ["Strength","Service","Envelope","Other"];
    const DEFAULT_LOAD_CASES = [
      { id:1, name:"Applied Loads", type:"Other", description:"Default applied loading", enabled:true },
    ];
    const DEFAULT_NODAL_LOADS = [
      { id:1, loadCase:"Applied Loads", node:"2", FX:B(20,DIM.force), FY:0, MZ:0 },
    ];
    const DEFAULT_MEMBER_LOADS = [
      { id:1, loadCase:"Applied Loads", member:"2", type:"udl",
        w1: -toBaseVal(1.5, { force:"kip", length:"ft" }, DIM.distLoad),
        w2: -toBaseVal(1.5, { force:"kip", length:"ft" }, DIM.distLoad),
        s1:0, s2:1, P:0, a:0 },
    ];
    const DEFAULT_COMBOS = [
      { id:1, name:"Applied Loads (×1.0)", type:"Service", description:"Unfactored default combination", enabled:true, terms:[{loadCase:"Applied Loads", factor:1.0}] },
    ];
    const FIXITY_OPTIONS = ["Fix-Fix","Pin-Fix","Fix-Pin","Pin-Pin"];
    const INITIAL_DISPLAY_UNITS = { force:"kip", length:"in" };
    const DEFAULT_ADVANCED = false;
    const DEFAULT_SPECTRUM = [
      {id:1,T:0.0,Sa:0.456},{id:2,T:0.2,Sa:1.05},{id:3,T:0.5,Sa:0.838},{id:4,T:1.0,Sa:0.487},
      {id:5,T:2.0,Sa:0.295},{id:6,T:4.0,Sa:0.1142},{id:7,T:5.0,Sa:0.0841},{id:8,T:10.0,Sa:0.0348}
    ];
    const DEFAULT_SPECTRUM_SETTINGS = { direction:"X", damping:0.05, modes:12, gravity:9810, scale:1.0, massSource:"Applied Loads" };
    const DEFAULT_SEISMIC_WEIGHTS = DEFAULT_NODES.map(n=>({node:n.label,Wx:0,Wy:0}));

    // ── SMALL MATRIX HELPERS ─────────────────────────────────────────────────
    function zeros(n,m){ return Array.from({length:n},()=>new Array(m).fill(0)); }
    function matMul(A,B){
      const n=A.length, k=A[0].length, m=B[0].length;
      const C=zeros(n,m);
      for(let i=0;i<n;i++)for(let j=0;j<m;j++){ let s=0; for(let p=0;p<k;p++) s+=A[i][p]*B[p][j]; C[i][j]=s; }
      return C;
    }
    function transpose(A){ const n=A.length,m=A[0].length; const T=zeros(m,n); for(let i=0;i<n;i++)for(let j=0;j<m;j++)T[j][i]=A[i][j]; return T; }
    function invertSmall(M){
      const n = M.length;
      const A = M.map((r,i)=>[...r, ...Array.from({length:n},(_,j)=>i===j?1:0)]);
      for(let col=0; col<n; col++){
        let piv=col;
        for(let r=col+1;r<n;r++) if(Math.abs(A[r][col])>Math.abs(A[piv][col])) piv=r;
        [A[col],A[piv]]=[A[piv],A[col]];
        const d=A[col][col];
        if (Math.abs(d) < 1e-13) throw new Error("Singular matrix during end-release condensation.");
        for(let j=0;j<2*n;j++) A[col][j]/=d;
        for(let r=0;r<n;r++){
          if(r===col) continue;
          const f=A[r][col];
          for(let j=0;j<2*n;j++) A[r][j]-=f*A[col][j];
        }
      }
      return A.map(r=>r.slice(n));
    }
    function gaussianSolve(Ain,bin){
      const n=bin.length;
      const M=Ain.map((r,i)=>[...r,bin[i]]);
      for(let col=0;col<n;col++){
        let piv=col;
        for(let r=col+1;r<n;r++) if(Math.abs(M[r][col])>Math.abs(M[piv][col])) piv=r;
        [M[col],M[piv]]=[M[piv],M[col]];
        if(Math.abs(M[col][col])<1e-10) throw new Error("Structure is unstable (singular stiffness matrix) — check supports/connectivity.");
        for(let r=col+1;r<n;r++){
          const f=M[r][col]/M[col][col];
          for(let k2=col;k2<=n;k2++) M[r][k2]-=f*M[col][k2];
        }
      }
      const x=new Array(n).fill(0);
      for(let i=n-1;i>=0;i--){
        x[i]=M[i][n];
        for(let j=i+1;j<n;j++) x[i]-=M[i][j]*x[j];
        x[i]/=M[i][i];
      }
      return x;
    }

    // ── DIRECT STIFFNESS METHOD — MEMBER-LEVEL FUNCTIONS ────────────────────
    // Local DOF order: [u1, v1, θ1, u2, v2, θ2] (axial, transverse, rotation @ near; same @ far)
    function localStiffnessFull(E,A,I,L){
      const k = zeros(6,6);
      const EAL = E*A/L;
      k[0][0]=EAL; k[0][3]=-EAL; k[3][0]=-EAL; k[3][3]=EAL;
      const EI=E*I;
      const k22=12*EI/(L*L*L), k23=6*EI/(L*L), k33=4*EI/L, k33b=2*EI/L;
      k[1][1]=k22;  k[1][2]=k23;   k[1][4]=-k22;  k[1][5]=k23;
      k[2][1]=k23;  k[2][2]=k33;   k[2][4]=-k23;  k[2][5]=k33b;
      k[4][1]=-k22; k[4][2]=-k23;  k[4][4]=k22;   k[4][5]=-k23;
      k[5][1]=k23;  k[5][2]=k33b;  k[5][4]=-k23;  k[5][5]=k33;
      return k;
    }
    // Consistent (energy-equivalent) nodal load vector via Hermitian/linear shape functions.
    // Exactly reproduces classical fixed-end force magnitudes for UDL and point loads (verified).
    function fefDistributed(L, wFn, nseg=200){
      const F = new Array(6).fill(0);
      const dx = L/nseg;
      for(let i=0;i<=nseg;i++){
        const x = i*dx;
        const wgt = (i===0||i===nseg) ? 0.5 : 1;
        const xi = x/L;
        const H1 = 1-3*xi*xi+2*xi*xi*xi;
        const H2 = L*(xi - 2*xi*xi + xi*xi*xi);
        const H3 = 3*xi*xi-2*xi*xi*xi;
        const H4 = L*(-xi*xi+xi*xi*xi);
        const wt = wFn(x);
        F[1]+= wgt*dx*wt*H1;
        F[2]+= wgt*dx*wt*H2;
        F[4]+= wgt*dx*wt*H3;
        F[5]+= wgt*dx*wt*H4;
      }
      return F;
    }
    function fefPoint(L, x, Ptrans){
      const xi=Math.min(1,Math.max(0,x/L));
      const H1=1-3*xi*xi+2*xi*xi*xi;
      const H2=L*(xi-2*xi*xi+xi*xi*xi);
      const H3=3*xi*xi-2*xi*xi*xi;
      const H4=L*(-xi*xi+xi*xi*xi);
      return [0, Ptrans*H1, Ptrans*H2, 0, Ptrans*H3, Ptrans*H4];
    }
    function addVec(a,b){ return a.map((v,i)=>v+b[i]); }

    // Static condensation of released rotational DOFs (member end-fixity: pin releases moment).
    // Local index 2 = θ1 (near), index 5 = θ2 (far).
    function condenseMember(kFull, fFull, fixNear, fixFar){
      const remove = [];
      if(!fixNear) remove.push(2);
      if(!fixFar) remove.push(5);
      if(remove.length===0) return { k: kFull, f: fFull };
      const keep = [0,1,2,3,4,5].filter(i=>!remove.includes(i));
      const Kcc = keep.map(i=>keep.map(j=>kFull[i][j]));
      const Kcr = keep.map(i=>remove.map(j=>kFull[i][j]));
      const Krc = remove.map(i=>keep.map(j=>kFull[i][j]));
      const Krr = remove.map(i=>remove.map(j=>kFull[i][j]));
      const KrrInv = invertSmall(Krr);
      const KcrKrrInv = matMul(Kcr, KrrInv);
      const correction = matMul(KcrKrrInv, Krc);
      const Kmod = kFull.map(r=>[...r]);
      for(let a=0;a<keep.length;a++)for(let b=0;b<keep.length;b++) Kmod[keep[a]][keep[b]] = Kcc[a][b]-correction[a][b];
      for(const r of remove){ for(let c=0;c<6;c++){ Kmod[r][c]=0; Kmod[c][r]=0; } }
      const Fr = remove.map(i=>[fFull[i]]);
      const corrF = matMul(KcrKrrInv, Fr);
      const Fmod = [...fFull];
      for(let a=0;a<keep.length;a++) Fmod[keep[a]] = fFull[keep[a]] - corrF[a][0];
      for(const r of remove) Fmod[r]=0;

    function fixityFlags(fixity){
      return { fixNear: fixity==="Fix-Fix"||fixity==="Fix-Pin", fixFar: fixity==="Fix-Fix"||fixity==="Pin-Fix" };

    // Builds the local distributed-load function and point-load list for one member under one load case.
    function memberLocalLoads(memberLabel, L, memberLoadsForCase){
      const entries = memberLoadsForCase.filter(ml=>ml.member===memberLabel);
      const udls = entries.filter(e=>e.type==="udl");
      const points = entries.filter(e=>e.type==="point");
      const wFn = x => {
        let w=0;
        udls.forEach(u=>{
          const xa=(+u.s1||0)*L, xb=(+u.s2||1)*L;
          if(x>=xa-1e-6 && x<=xb+1e-6){
            const frac = (xb>xa) ? (x-xa)/(xb-xa) : 0;
            w += (+u.w1||0) + ((+u.w2||0)-(+u.w1||0))*frac;

      const pointLoads = points.map(p=>({ x: Math.min(L,Math.max(0,+p.a||0)), P: +p.P||0 }));

    // ── FULL FRAME SOLVE (assembles K once, solves once per load case) ──────

    //   Assembly:      F_global += +(T' · f_local_consistent)   [consistent/equivalent nodal loads]
    //   Reactions:     R = K·D − F   (at restrained DOF)
    //   Member forces: Q_local = k_condensed·u_local − f_condensed   (released DOF ⇒ exactly zero)
    //   Internal sweep (from near end, x=0..L):
    //     V(x) = −V1 − ∫₀ˣ w(s)ds − Σ Pᵢ [aᵢ≤x]

    function solveFrame(nodes, members, memberLoadsAllCases, nodalLoadsAllCases, loadCaseNames){

        const L = Math.sqrt(dx*dx+dy*dy);

      });

      if(memberGeom.some(g=>g===null)) return { error: "One or more members reference a missing node, or have zero length." };

      const restrained = new Array(ndof).fill(false);
      nodes.forEach(n=>{
        const gi = dofIndex[n.label];

        if(n.uy) restrained[gi+1]=true;

      memberGeom.forEach(g=>{

        const nodalLoads = nodalLoadsAllCases.filter(nl=>nl.loadCase===caseName);
        const memberLoadsForCase = memberLoadsAllCases.filter(ml=>ml.loadCase===caseName);

        memberGeom.forEach(g=>{

          const uLocalNodal = matMul(g.T, uGlobalNodal.map(v=>[v])).map(r=>r[0]);
          const qNodal = matMul(g.condK, uLocalNodal.map(v=>[v])).map(r=>r[0]);
          nodalMemberEndForces[g.m.label] = { N1:qNodal[0], V1:qNodal[1], M1:qNodal[2], N2:qNodal[3], V2:qNodal[4], M2:qNodal[5] };
        });

        caseResults[caseName] = { D, R, memberEndForces, nodalMemberEndForces, memberLocalLoads: memberFEF };
      });

      return { nodeList, dofIndex, ndof, memberGeom, restrained, freeIdx, K, caseResults };
    }

        });

        // nodal-load contribution by -1. Since total = member + nodal, adjusted = total - 2*nodal.
        const end = {};
        ["N1","V1","M1","N2","V2","M2"].forEach(k=>{ end[k]=totalEnd[k]-2*nodalEnd[k]; });

        // station-dependent trapezoidal-integration error that previously distorted
        // SFD/BMD ordinates, especially at partial-load boundaries and member ends.
        function exactLoadIntegrals(x){

        }

        // These definitions satisfy dM/dx=V and dV/dx=-w, and recover the exact far-end
        // actions V(L)=V2 and M(L)=-M2 (within solver tolerance).
        const Nx = x => -end.N1;

        stations.sort((a,b)=>a-b);

        // by 4th-order Runge–Kutta, using the FE-solved end displacements as exact initial
        // conditions (v(0), θ(0)). Validated: reproduces v(L), θ(L) at the far end (known
        // from the global solution) to within numerical tolerance, and matches the
        // closed-form 5wL⁴/384EI benchmark for a simply supported beam under UDL.
        const uGlobal = g.map.map(i=>D[i]);

            const k3 = deriv(x+h/2, vv+h/2*k2[0], th+h/2*k2[1]);
            const k4 = deriv(x+h,   vv+h*k3[0],   th+h*k3[1]);

            th = th + h/6*(k1[1]+2*k2[1]+2*k3[1]+k4[1]);
            const xi1 = (i+1)/nRK;

          }

          for(let i=1;i<=nRK;i++){ const xi1=i/nRK; defl.push({ x:L*xi1, u:u1+(u2-u1)*xi1, v:v1+(v2-v1)*xi1, th:th1 }); }
        }
        const Dx = x => {
          const xc = Math.min(L, Math.max(0, x));
          const idx = Math.min(nRK-1, Math.floor(xc/L*nRK));
          const a = defl[idx], b = defl[idx+1] || a;
          const frac = b.x>a.x ? (xc-a.x)/(b.x-a.x) : 0;
          return { u: a.u+(b.u-a.u)*frac, v: a.v+(b.v-a.v)*frac };
        };
        const deflBoundaryCheck = { vFar_RK4: defl[defl.length-1].v, vFar_FE: v2, thFar_RK4: defl[defl.length-1].th, thFar_FE: th2 };

        memberSample[g.m.label] = { L, Nx, Vx, Mx, Dx, c:g.c, s:g.s, stations, deflBoundaryCheck };
      });

      return { D, R, memberEndForces, memberSample, dofIndex, nodeList };
    }

        if(!out[l.node])return;

    }
