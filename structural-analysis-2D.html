    massPerLength: c(m.massPerLength, f.massPerLength),
  }));

  newModel.loadPatterns = (newModel.loadPatterns || []).map(p => ({
    ...p,
    nodalLoads: (p.nodalLoads || []).map(nl => ({
      ...nl, Fx: c(nl.Fx, f.force), Fy: c(nl.Fy, f.force), Mz: c(nl.Mz, f.moment),
    })),
    memberLoads: (p.memberLoads || []).map(ml => {
      const out = { ...ml };
      if (ml.type === "uniform" || ml.type === "axial") out.w = c(ml.w, f.distributedLoad);
      if (ml.type === "point") { out.P = c(ml.P, f.force); out.a = c(ml.a, f.length); }
      if (ml.type === "trapezoidal") {
        out.w1 = c(ml.w1, f.distributedLoad); out.w2 = c(ml.w2, f.distributedLoad);
        out.x0 = c(ml.x0, f.length); out.x1 = c(ml.x1, f.length);
      }
      return out;
    }),
  }));

  // dynamicsConfig.spectrum.Sa (constant-shape mode) is in actual
  // acceleration units and must convert; Sds/Sd1 (code-shape mode) are
  // unitless multiples of g and never need conversion.
  if (newModel.dynamicsConfig && newModel.dynamicsConfig.spectrum && newModel.dynamicsConfig.spectrum.Sa != null) {
    newModel.dynamicsConfig = {
      ...newModel.dynamicsConfig,
      spectrum: { ...newModel.dynamicsConfig.spectrum, Sa: c(newModel.dynamicsConfig.spectrum.Sa, f.acceleration) },
    };
  }

  return newModel;
}

// ── ID / GEOMETRY HELPERS ────────────────────────────────────────────────
let _idCounter = 1000;
const newId = prefix => `${prefix}${_idCounter++}`;

function fmt(v, dp) {
  if (v == null || Number.isNaN(v)) return "—";
  const d = dp == null ? 4 : dp;
  const abs = Math.abs(v);
  if (abs !== 0 && (abs < 1e-4 || abs >= 1e7)) return v.toExponential(3);
  return v.toFixed(d);
}
function fmtShort(v, dp) {
  if (v == null || Number.isNaN(v)) return "—";
  return fmt(v, dp == null ? 3 : dp);
}

function nodeById(model, id) { return model.nodes.find(n => n.id === id); }
function memberById(model, id) { return model.members.find(m => m.id === id); }
function memberLength(model, m) {
  const ni = nodeById(model, m.nearNodeId), nj = nodeById(model, m.farNodeId);
  if (!ni || !nj) return 0;
  return Math.hypot(nj.x - ni.x, nj.y - ni.y);
}
function memberAngleDeg(model, m) {
  const ni = nodeById(model, m.nearNodeId), nj = nodeById(model, m.farNodeId);
  if (!ni || !nj) return 0;
  return Math.atan2(nj.y - ni.y, nj.x - ni.x) * 180 / Math.PI;
}

// ── MATERIALS & SECTIONS RESOLUTION ─────────────────────────────────────
// Members reference a materialId (-> E) and sectionId (-> A, I) instead of
// carrying raw property values directly. This resolves the actual E/A/I
// for a member (with a safe fallback to legacy direct member.E/A/I values,
// or engineering-reasonable defaults, so older saved working files or
// malformed references never crash the solver). FrameCore itself is left
// completely untouched — it always receives a plain {E,A,I,...} member
// object regardless of whether the app is using the materials/sections
// library, keeping the verified core's contract unchanged.
function materialById(model, id) { return (model.materials || []).find(x => x.id === id); }
function sectionById(model, id) { return (model.sections || []).find(x => x.id === id); }

// ── RIGID LINKS ──────────────────────────────────────────────────────────
// A rigid link is modeled as a normal frame element with a very high
// stiffness relative to the rest of the structure — the standard, widely
// used "stiff member" approximation to a true kinematic rigid-body
// constraint (avoids adding a separate multi-point-constraint elimination
// path to the verified FrameCore solver). Only the PRODUCTS E*A and E*I
// affect the element stiffness matrix (see core/element.js:
// localStiffness only ever uses E*A/L and E*I/L, E*I/L^2, E*I/L^3 terms;
// core/element.js:localGeometricStiffness depends only on N and L, not
// E/A/I at all), so E, A, I individually are unconstrained as long as
// their PRODUCTS hit the target — we set E=1 and fold the entire target
// stiffness into A and I directly. The target is computed as a large
// multiple of the stiffest REAL (non-rigid) member currently in the
// model, so it automatically scales correctly with whatever unit system
// is active without needing any separate unit-conversion handling (there
// is no stored absolute number that unit conversion would need to know
// about — it's derived fresh at solve/resolve time from the current
// model state, in the current unit system).
const RIGID_LINK_STIFFNESS_FACTOR = 1e4;
function computeRigidLinkTargetStiffness(model) {
  let maxEA = 0, maxEI = 0;
  for (const m of model.members) {
    if (m.rigid) continue;
    const mat = materialById(model, m.materialId), sec = sectionById(model, m.sectionId);
    const E = mat ? mat.E : (m.E != null ? m.E : 29000);
    const A = sec ? sec.A : (m.A != null ? m.A : 10);
    const I = sec ? sec.I : (m.I != null ? m.I : 100);
    maxEA = Math.max(maxEA, E * A);
    maxEI = Math.max(maxEI, E * I);
  }
  if (maxEA <= 0) maxEA = 1e6;
  if (maxEI <= 0) maxEI = 1e6;
  return { EA: maxEA * RIGID_LINK_STIFFNESS_FACTOR, EI: maxEI * RIGID_LINK_STIFFNESS_FACTOR };
}

function resolveMemberProps(model, member) {
  if (member.rigid) {
    const { EA, EI } = computeRigidLinkTargetStiffness(model);
    return { E: 1, A: EA, I: EI };
  }
  const mat = materialById(model, member.materialId);
  const sec = sectionById(model, member.sectionId);
  return {
    E: mat ? mat.E : (member.E != null ? member.E : 29000),
    A: sec ? sec.A : (member.A != null ? member.A : 10),
    I: sec ? sec.I : (member.I != null ? member.I : 100),
  };
}

// Returns a new members array with E/A/I resolved and injected onto each
// member object — this is what should be passed to any FC.* solver call
// or to any diagram/property calculation, instead of model.members directly.
function resolveMembersForSolve(model) {
  return model.members.map(m => ({ ...m, ...resolveMemberProps(model, m) }));
}

// ── LOAD → FrameCore BRIDGE ──────────────────────────────────────────────
// Converts a combination of load patterns (with factors) into the exact
// (memberFeaLocalMap, nodalLoadVector) inputs that core/staticSolver.js
// expects. This is the ONLY place app-level load objects are translated
// into the verified core's local fixed-end-action vectors, so all the
// sign/convention guarantees established in test/*.js carry through
// unchanged into the UI.
function buildLoadInputsForCombo(model, combo) {
  const nodes = model.nodes;
  const members = model.members;
  const nDof = nodes.length * 3;
  const nodalLoadVector = new Array(nDof).fill(0);
  const memberFeaLocalMap = new Map(members.map(m => [m.id, [0, 0, 0, 0, 0, 0]]));
  // Interior transverse load descriptors per member (LOCAL transverse
  // convention, same sign as fed to core/loads.js), used for *exact*
  // section-cut moment/shear diagrams rather than a linear approximation
  // between end forces. {kind:'uniform', w, x0, x1} or {kind:'point', a, P}.
  const memberTransverseLoads = new Map(members.map(m => [m.id, []]));

  const nodeIndex = new Map(nodes.map((n, i) => [n.id, i]));
  const memberMap = new Map(members.map(m => [m.id, m]));

  for (const [patId, factor] of Object.entries(combo.factors || {})) {
    if (!factor) continue;
    const pattern = model.loadPatterns.find(p => p.id === patId);
    if (!pattern) continue;

    for (const nl of (pattern.nodalLoads || [])) {
      const i = nodeIndex.get(nl.nodeId);
      if (i == null) continue;
      nodalLoadVector[3 * i + 0] += factor * (nl.Fx || 0);
      nodalLoadVector[3 * i + 1] += factor * (nl.Fy || 0);
      nodalLoadVector[3 * i + 2] += factor * (nl.Mz || 0);
    }

    for (const ml of (pattern.memberLoads || [])) {
      const m = memberMap.get(ml.memberId);
      if (!m) continue;
      const L = memberLength(model, m);
      const ang = memberAngleDeg(model, m) * Math.PI / 180;
      const c = Math.cos(ang), s = Math.sin(ang);

      // "gravity" direction means a physical force per length of (0,-mag)
      // in GLOBAL coordinates, projected onto the member's local axes.
      // Sign conventions below are empirically calibrated and verified
      // (see test/*.js and the app's own browser tests) against:
      //   - the horizontal-member case (c=1,s=0), where positive input to
      //     feaUniformTransverse/feaPointTransverse reproduces the
      //     Frames v0.1.xlsx benchmark to machine precision;
      //   - the vertical-member case (c=0,s=1), where positive input to
      //     feaUniformAxial was verified to reproduce a physically
      //     downward tip displacement under self-weight.
      // General projection of a physical downward force (0,-mag):
      //   local-y (transverse) component: (0,-mag)·(-s,c) = -mag*c  -> input = -that = mag*c
      //   local-x (axial) component:      (0,-mag)·(c,s)  = -mag*s -> input = -that = mag*s
      // Both reduce exactly to the calibrated single-axis cases above.
      let wPerLen = 0, pMag = 0, axialPerLen = 0, axialPMag = 0;
      const magnitude = factor * (ml.w != null ? ml.w : ml.P || 0);
      if (ml.direction === "gravity") {
        wPerLen = magnitude * c;
        pMag = wPerLen;
        axialPerLen = magnitude * s;
        axialPMag = axialPerLen;
      } else { // "local" direction: magnitude already in local -y sense per user input convention (positive = downward-in-local-frame)
        wPerLen = magnitude;
        pMag = magnitude;
      }

      let feaVec = null;
      if (ml.type === "uniform") {
        feaVec = FC.loads.feaUniformTransverse(wPerLen, L);
        if (Math.abs(wPerLen) > 1e-14) memberTransverseLoads.get(ml.memberId).push({ kind: "uniform", w: wPerLen, x0: 0, x1: L });
        if (ml.direction === "gravity" && Math.abs(axialPerLen) > 1e-14) {
          feaVec = FC.loads.sumFea([feaVec, FC.loads.feaUniformAxial(axialPerLen, L)]);
        }
      } else if (ml.type === "point") {
        const a = Math.min(Math.max((ml.a != null ? ml.a : 0.5 * L), 0), L);
        feaVec = FC.loads.feaPointTransverse(pMag, a, L);
        if (Math.abs(pMag) > 1e-14) memberTransverseLoads.get(ml.memberId).push({ kind: "point", a, P: pMag });
        if (ml.direction === "gravity" && Math.abs(axialPMag) > 1e-14) {
          feaVec = FC.loads.sumFea([feaVec, FC.loads.feaPointAxial(axialPMag, a, L)]);
        }
      } else if (ml.type === "trapezoidal") {
        const x0 = ml.x0 != null ? ml.x0 : 0, x1 = ml.x1 != null ? ml.x1 : L;
        const a = Math.min(x0, x1), len = Math.max(x0, x1) - a;
        const w1 = ml.direction === "gravity" ? ml.w1 * c : ml.w1;
        const w2 = ml.direction === "gravity" ? ml.w2 * c : ml.w2;
        feaVec = FC.loads.feaTrapezoidalPartialSpan(factor * w1, factor * w2, a, len, L);
        memberTransverseLoads.get(ml.memberId).push({ kind: "trapezoidal", w1: factor * w1, w2: factor * w2, x0: a, x1: a + len });
        // Note: axial component of a trapezoidal gravity load on an
        // inclined member is not auto-added (uncommon case); use a
        // separate "axial" load entry for that contribution if needed.
      } else if (ml.type === "axial") {
        feaVec = FC.loads.feaUniformAxial(magnitude, L);
      }
      if (feaVec) {
        const existing = memberFeaLocalMap.get(ml.memberId);
        memberFeaLocalMap.set(ml.memberId, FC.loads.sumFea([existing, feaVec]));
      }
    }
  }

  return { memberFeaLocalMap, nodalLoadVector, memberTransverseLoads };
}

// ── SVG MODEL CANVAS ─────────────────────────────────────────────────────
function computeViewBox(model, padFrac) {
  const xs = model.nodes.map(n => n.x), ys = model.nodes.map(n => n.y);
  if (xs.length === 0) return { minX: 0, minY: 0, w: 100, h: 100 };
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const spanX = Math.max(maxX - minX, 1), spanY = Math.max(maxY - minY, 1);
  const pad = Math.max(spanX, spanY) * (padFrac == null ? 0.25 : padFrac);
  return { minX: minX - pad, minY: minY - pad, w: spanX + 2 * pad, h: spanY + 2 * pad, dataMinX: minX, dataMaxX: maxX, dataMinY: minY, dataMaxY: maxY };
}

// Restraint glyph (pin / fixed / roller) drawn in SVG-local (Y-down) coords,
// at screen point (sx, sy), given the restraint booleans.
function RestraintGlyph({ sx, sy, restraints, size }) {
  const s = size || 14;
  if (!restraints) return null;
  const { ux, uy, thz } = restraints;
  if (!ux && !uy && !thz) return null;
  if (ux && uy && thz) {
    // Fixed support: hatched ground line
    return (
      <g>
        <line x1={sx - s} y1={sy + s} x2={sx + s} y2={sy + s} stroke={CLR.orange} strokeWidth={2} />
        {[-1, -0.5, 0, 0.5, 1].map((f, i) => (
          <line key={i} x1={sx + f * s} y1={sy + s} x2={sx + f * s - 5} y2={sy + s + 8} stroke={CLR.orange} strokeWidth={1.5} />
        ))}
        <rect x={sx - s} y={sy - 2} width={2 * s} height={4} fill={CLR.orange} />
      </g>
    );
  }
  if (ux && uy && !thz) {
    // Pin support: triangle
    return (
      <g>
        <polygon points={`${sx},${sy} ${sx - s},${sy + s * 1.4} ${sx + s},${sy + s * 1.4}`} fill="none" stroke={CLR.orange} strokeWidth={2} />
        <line x1={sx - s * 1.3} y1={sy + s * 1.4} x2={sx + s * 1.3} y2={sy + s * 1.4} stroke={CLR.orange} strokeWidth={2} />
      </g>
    );
  }
  // Roller or partial restraint: circle + small ground marks, with direction indicators
  return (
    <g>
      <circle cx={sx} cy={sy + s * 0.6} r={s * 0.55} fill="none" stroke={CLR.orange} strokeWidth={2} />
      <line x1={sx - s} y1={sy + s * 1.15} x2={sx + s} y2={sy + s * 1.15} stroke={CLR.orange} strokeWidth={2} />
      <text x={sx} y={sy - 10} fill={CLR.orange} fontSize={8} textAnchor="middle" fontWeight="700">
        {[ux && "X", uy && "Y", thz && "R"].filter(Boolean).join("")}
      </text>
    </g>
  );
}

function ModelCanvas({ model, selection, onSelectNode, onSelectMember, height, overlayMode, resultData }) {
  const vb = computeViewBox(model);
  const H = height || 420;
  // Screen transform: data (x,y) -> svg (sx, sy), Y flipped (screen down = +sy)
  const scale = Math.min(700 / vb.w, H / vb.h);
  const toScreen = (x, y) => ({
    sx: (x - vb.minX) * scale,
    sy: H - (y - vb.minY) * scale,
  });

  return (
    <svg viewBox={`0 0 ${vb.w * scale} ${H}`} width="100%" height={H} style={{ background: "#0d1117", border: `1px solid ${CLR.border}`, borderRadius: 6 }}>
      <defs>
        <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 Z" fill={CLR.red} />
        </marker>
      </defs>
      {/* Members */}
      {model.members.map(m => {
        const ni = nodeById(model, m.nearNodeId), nj = nodeById(model, m.farNodeId);
        if (!ni || !nj) return null;
        const p1 = toScreen(ni.x, ni.y), p2 = toScreen(nj.x, nj.y);
        const isSel = selection && selection.type === "member" && selection.id === m.id;
        return (
          <g key={m.id} onClick={() => onSelectMember && onSelectMember(m.id)} style={{ cursor: "pointer" }}>
            <line x1={p1.sx} y1={p1.sy} x2={p2.sx} y2={p2.sy}
              stroke={isSel ? CLR.accent : CLR.text} strokeWidth={isSel ? 4 : 2.5} />
            <text x={(p1.sx + p2.sx) / 2} y={(p1.sy + p2.sy) / 2 - 8} fill={CLR.muted} fontSize={10} textAnchor="middle">{m.id}</text>
          </g>
        );
      })}
      {/* Nodes + restraints */}
      {model.nodes.map(n => {
        const p = toScreen(n.x, n.y);
        const isSel = selection && selection.type === "node" && selection.id === n.id;
        return (
          <g key={n.id}>
            <RestraintGlyph sx={p.sx} sy={p.sy} restraints={n.restraints} />
            <circle cx={p.sx} cy={p.sy} r={isSel ? 7 : 5} fill={isSel ? CLR.accent : CLR.violet}
              stroke="#000" strokeWidth={1} style={{ cursor: "pointer" }}
              onClick={() => onSelectNode && onSelectNode(n.id)} />
            <text x={p.sx + 10} y={p.sy - 8} fill={CLR.text} fontSize={11} fontWeight="700">{n.id}</text>
          </g>
        );
      })}
      {/* Nodal load arrows */}
      {model.loadPatterns && overlayMode === "loads" && model.loadPatterns.flatMap(pat =>
        (pat.nodalLoads || []).map((nl, idx) => {
          const n = nodeById(model, nl.nodeId);
          if (!n) return null;
          const p = toScreen(n.x, n.y);
          const arrows = [];
          if (nl.Fx) {
            const dir = Math.sign(nl.Fx);
            arrows.push(<line key={pat.id + "fx" + idx} x1={p.sx - dir * 35} y1={p.sy} x2={p.sx - 6 * dir} y2={p.sy} stroke={CLR.red} strokeWidth={2} markerEnd="url(#arrowhead)" />);
          }
          if (nl.Fy) {
            const dir = Math.sign(nl.Fy);
            arrows.push(<line key={pat.id + "fy" + idx} x1={p.sx} y1={p.sy + dir * 35} x2={p.sx} y2={p.sy + 6 * dir} stroke={CLR.red} strokeWidth={2} markerEnd="url(#arrowhead)" />);
          }
          return arrows;
        })
      )}
    </svg>
  );
}

// ── MODEL TAB ────────────────────────────────────────────────────────────
function NodeTable({ model, setModel, selection, setSelection }) {
  const units = UNIT_SYSTEMS[model.unitSystem];
  const updateNode = (id, patch) => {
    setModel(m => ({ ...m, nodes: m.nodes.map(n => n.id === id ? { ...n, ...patch } : n) }));
  };
  const updateRestraint = (id, key, val) => {
    setModel(m => ({ ...m, nodes: m.nodes.map(n => n.id === id ? { ...n, restraints: { ...n.restraints, [key]: val } } : n) }));
  };
  const updateSpring = (id, key, val) => {
    setModel(m => ({ ...m, nodes: m.nodes.map(n => n.id === id ? { ...n, springs: { kx: 0, ky: 0, kr: 0, ...(n.springs || {}), [key]: val } } : n) }));
  };
  const addNode = () => {
    const id = newId("N");
    setModel(m => ({ ...m, nodes: [...m.nodes, { id, x: 0, y: 0, restraints: { ux: false, uy: false, thz: false }, springs: { kx: 0, ky: 0, kr: 0 }, mass: null, loads: {} }] }));
  };
  const removeNode = (id) => {
    setModel(m => ({
      ...m,
      nodes: m.nodes.filter(n => n.id !== id),
      members: m.members.filter(mem => mem.nearNodeId !== id && mem.farNodeId !== id),
    }));
  };
  return (
    <div style={S.card}>
      <div style={S.h2}>
        <span>Nodes</span>
        <button style={S.btn("secondary")} onClick={addNode}>+ Add Node</button>
      </div>
      <div style={{ overflowX: "auto" }}>
        <table style={S.table}>
          <thead><tr>
            <th style={S.th}>ID</th><th style={S.th}>X ({units.length})</th><th style={S.th}>Y ({units.length})</th>
            <th style={S.th}>Restrain UX</th><th style={S.th}>Restrain UY</th><th style={S.th}>Restrain θZ</th>
            <th style={S.th}>Spring Kx ({units.force}/{units.length})</th>
            <th style={S.th}>Spring Ky ({units.force}/{units.length})</th>
            <th style={S.th}>Spring Kr ({units.moment}/rad)</th>
            <th style={S.th}></th>
          </tr></thead>
          <tbody>
            {model.nodes.map(n => {
              const springs = n.springs || { kx: 0, ky: 0, kr: 0 };
              return (
                <tr key={n.id} style={{ background: selection && selection.type === "node" && selection.id === n.id ? "#21262d" : "transparent" }}
                  onClick={() => setSelection({ type: "node", id: n.id })}>

function MemberTable({ model, setModel, selection, setSelection }) {
  const units = UNIT_SYSTEMS[model.unitSystem];
  const updateMember = (id, patch) => {
    setModel(m => ({ ...m, members: m.members.map(mem => mem.id === id ? { ...mem, ...patch } : mem) }));
  };
  const updateRelease = (id, key, val) => {
    setModel(m => ({ ...m, members: m.members.map(mem => mem.id === id ? { ...mem, releases: { ...(mem.releases || {}), [key]: val } } : mem) }));
  };
  const addMember = () => {
    if (model.nodes.length < 2) return;
    const id = newId("M");
    const defaultMat = model.materials && model.materials[0] ? model.materials[0].id : null;
    const defaultSec = model.sections && model.sections[0] ? model.sections[0].id : null;
    setModel(m => ({ ...m, members: [...m.members, { id, nearNodeId: m.nodes[0].id, farNodeId: m.nodes[1].id, materialId: defaultMat, sectionId: defaultSec, massPerLength: 0, kFactor: 1, releases: null }] }));
  };
  const removeMember = (id) => setModel(m => ({ ...m, members: m.members.filter(mem => mem.id !== id) }));

  return (
    <div style={S.card}>
      <div style={S.h2}>
        <span>Members</span>
        <button style={S.btn("secondary")} onClick={addMember}>+ Add Member</button>
      </div>
      <div style={{ overflowX: "auto" }}>
        <table style={S.table}>
          <thead><tr>
            <th style={S.th}>ID</th><th style={S.th}>Near</th><th style={S.th}>Far</th>
            <th style={S.th}>Material</th><th style={S.th}>Section</th>
            <th style={S.th}>Rigid Link</th>
            <th style={S.th}>E ({units.stress})</th><th style={S.th}>A ({units.length}²)</th><th style={S.th}>I ({units.length}⁴)</th>
            <th style={S.th}>Length</th>
            <th style={S.th}>K Factor</th>
            <th style={S.th}>Rel. Near M</th><th style={S.th}>Rel. Far M</th>
            <th style={S.th}></th>
          </tr></thead>
          <tbody>
            {model.members.map(mem => {
              const L = memberLength(model, mem);
              const resolved = resolveMemberProps(model, mem);
              return (
                <tr key={mem.id} style={{ background: selection && selection.type === "member" && selection.id === mem.id ? "#21262d" : "transparent" }}
                  onClick={() => setSelection({ type: "member", id: mem.id })}>
                  <td style={S.td}><b>{mem.id}</b></td>
                  <td style={S.td}>
                    <select style={S.select} value={mem.nearNodeId} onChange={e => updateMember(mem.id, { nearNodeId: e.target.value })}>

                      <select style={S.select} value={mem.materialId || ""} onChange={e => updateMember(mem.id, { materialId: e.target.value })}>

                      </select>
                    )}
                  </td>
                  <td style={S.td}>
                    {mem.rigid ? <span style={S.smallMuted}>—</span> : (
                      <select style={S.select} value={mem.sectionId || ""} onChange={e => updateMember(mem.id, { sectionId: e.target.value })}>
                        {(model.sections || []).map(sec => <option key={sec.id} value={sec.id}>{sec.name}</option>)}
                      </select>
                    )}
                  </td>
                  <td style={S.td}><input type="checkbox" checked={!!mem.rigid} onChange={e => updateMember(mem.id, { rigid: e.target.checked })} /></td>
                  <td style={{ ...S.td, color: CLR.muted }}>{mem.rigid ? "RIGID" : fmt(resolved.E, 0)}</td>
                  <td style={{ ...S.td, color: CLR.muted }}>{mem.rigid ? "RIGID" : fmt(resolved.A, 2)}</td>
                  <td style={{ ...S.td, color: CLR.muted }}>{mem.rigid ? "RIGID" : fmt(resolved.I, 2)}</td>

      </div>

  );
}

// ── SIMPLE SVG LINE CHART (no external charting library needed) ─────────
function SimpleLineChart({ points, xLabel, yLabel, height, color }) {
  const H = height || 220, W = 600, padL = 46, padB = 30, padT = 14, padR = 14;
  if (!points || points.length === 0) return null;
  const xs = points.map(p => p.x), ys = points.map(p => p.y);
  const xMin = 0, xMax = Math.max(...xs, 1e-6);
  const yMin = 0, yMax = Math.max(...ys, 1e-6) * 1.1;
  const toX = x => padL + (x - xMin) / (xMax - xMin) * (W - padL - padR);
  const toY = y => H - padB - (y - yMin) / (yMax - yMin) * (H - padB - padT);
  const pathD = points.map((p, i) => `${i === 0 ? "M" : "L"}${toX(p.x)},${toY(p.y)}`).join(" ");
  const nXTicks = 5, nYTicks = 4;
  const xTicks = Array.from({ length: nXTicks + 1 }, (_, i) => xMin + (i / nXTicks) * (xMax - xMin));
  const yTicks = Array.from({ length: nYTicks + 1 }, (_, i) => yMin + (i / nYTicks) * (yMax - yMin));
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} style={{ background: "#0d1117", border: `1px solid ${CLR.border}`, borderRadius: 6 }}>
      {yTicks.map((t, i) => (
        <g key={"y" + i}>
          <line x1={padL} y1={toY(t)} x2={W - padR} y2={toY(t)} stroke={CLR.border} strokeWidth={0.5} />
          <text x={padL - 6} y={toY(t) + 3} fill={CLR.muted} fontSize={9} textAnchor="end">{fmt(t, 2)}</text>
        </g>
      ))}
      {xTicks.map((t, i) => (
        <g key={"x" + i}>
          <text x={toX(t)} y={H - padB + 14} fill={CLR.muted} fontSize={9} textAnchor="middle">{fmt(t, 2)}</text>
        </g>
      ))}
      <line x1={padL} y1={padT} x2={padL} y2={H - padB} stroke={CLR.border} strokeWidth={1} />

}

  const cfg = model.dynamicsConfig || { enabled: false, spectrum: { shape: "code", Sds: 1, Sd1: 0.4 }, massSource: { mode: "manual", patternId: null, includeManualMass: true } };

// ── ANALYSIS TAB ─────────────────────────────────────────────────────────
const ANALYSIS_TYPES = [
  { id: "static", label: "Linear Static" },
  { id: "buckling", label: "Linear Buckling" },
  { id: "modal", label: "Modal (Free Vibration)" },
  { id: "pdelta", label: "P-Delta (2nd Order)" },
  { id: "responseSpectrum", label: "Response Spectrum" },
  { id: "movingLoad", label: "Moving Load / Envelope" },
];

function runAnalysis(model, settings) {
  const combo = model.loadCombinations.find(c => c.id === settings.comboId) || model.loadCombinations[0];
  if (!combo) return { status: "Failed", error: "No load combination defined." };
  const { memberFeaLocalMap, nodalLoadVector } = buildLoadInputsForCombo(model, combo);
  // Resolve materialId/sectionId -> concrete E/A/I before handing off to
  // FrameCore, which expects plain {E,A,I,...} member objects and is left
  // completely untouched by the materials/sections feature.
  const resolvedMembers = resolveMembersForSolve(model);

  try {
    if (settings.type === "static") {
      const res = FC.staticSolver.solveLinearStatic(model.nodes, resolvedMembers, memberFeaLocalMap, nodalLoadVector);
      return { ...res, comboUsed: combo.name };
    }
    if (settings.type === "buckling") {
      const res = FC.buckling.solveBuckling(model.nodes, resolvedMembers, memberFeaLocalMap, nodalLoadVector, settings.nModes || 6);
      return { ...res, comboUsed: combo.name };
    }
    if (settings.type === "modal") {
      const { nodes: massNodes, members: massMembers } = applyMassSource(model, resolvedMembers);
      const res = FC.modal.solveModal(massNodes, massMembers, { nModes: settings.nModes || 6, massType: settings.massType || "lumped" });
      return { ...res, comboUsed: null };
    }
    if (settings.type === "pdelta") {
      const res = FC.pdelta.solvePDelta(model.nodes, resolvedMembers, memberFeaLocalMap, nodalLoadVector, { maxIter: settings.maxIter || 30, tol: settings.tol || 1e-6 });
      return { ...res, comboUsed: combo.name };
    }
    if (settings.type === "responseSpectrum") {
      const { nodes: massNodes, members: massMembers } = applyMassSource(model, resolvedMembers);
      const modal = FC.modal.solveModal(massNodes, massMembers, { nModes: settings.nModes || 6, massType: settings.massType || "lumped" });
      if (modal.status !== "Successful") return { status: "Failed", error: "Modal analysis (prerequisite) failed: " + modal.error };
      const spectrumSource = (model.dynamicsConfig && model.dynamicsConfig.enabled) ? model.dynamicsConfig.spectrum : settings.spectrum;
      const spectrumFn = buildSpectrumFn(spectrumSource, UNIT_SYSTEMS[model.unitSystem].g);
      const res = FC.responseSpectrum.solveResponseSpectrum(modal, spectrumFn, settings.direction || "X", settings.combination || "SRSS", settings.dampingRatio != null ? settings.dampingRatio : 0.05, model.nodes, resolvedMembers);
      return { ...res, modal, comboUsed: null };
    }
    if (settings.type === "movingLoad") {
      const responses = (resolvedMembers || []).map(m => ({ id: "M_" + m.id, type: "memberMoment", memberId: m.id, stationRatio: 0.5 }))
        .concat(model.nodes.filter(n => n.restraints.ux || n.restraints.uy).map(n => ({ id: "R_" + n.id, type: "reaction", nodeId: n.id, component: "Fy" })));
      const res = FC.movingLoad.solveMovingLoad(model.nodes, resolvedMembers, memberFeaLocalMap, nodalLoadVector, settings.pathMemberIds || resolvedMembers.map(m => m.id), settings.loadTrain || [{ offset: 0, magnitude: 10 }], settings.stepSize || Math.max(1, memberLength(model, resolvedMembers[0]) / 20 || 1), responses);
      return { ...res, comboUsed: combo.name };
    }
  } catch (e) {
    return { status: "Failed", error: "Unexpected error: " + e.message };
  }
  return { status: "Failed", error: "Unknown analysis type." };
}

// Simple response-spectrum shape builders (design-spectrum style, generic —
// not tied to a specific building code so the tool remains code-agnostic;
// users can substitute Sa values from their governing code if needed).
// For the "code" shape, Sds/Sd1 are entered as multiples of g (standard
// seismic-design convention), so the returned Sa(T) is converted to actual
// acceleration units of the model's current unit system via g.
function buildSpectrumFn(spectrum, g) {
  const gUse = g || 386.4;
  if (!spectrum || spectrum.shape === "constant") {
    const Sa = (spectrum && spectrum.Sa) || 1;
    return () => Sa;
  }
  const Sds = spectrum.Sds || 1, Sd1 = spectrum.Sd1 || 0.4, T0 = spectrum.T0 != null ? spectrum.T0 : 0.2 * (Sd1 / Sds);
  const Ts = Sd1 / Sds;
  return (T) => {
    let SaOverG;
    if (T <= 0) SaOverG = Sds * 0.4;
    else if (T < T0) SaOverG = Sds * (0.4 + 0.6 * T / T0);
    else if (T <= Ts) SaOverG = Sds;
    else SaOverG = Sd1 / T;
    return SaOverG * gUse;
  };
}

// ── MASS SOURCE (dynamic analysis mass derived from a load pattern) ─────
// Converts a load pattern's gravity loads into equivalent mass (mass =
// weight / g) for use in modal / response-spectrum analysis, the standard
// "mass source" concept in structural analysis software. Nodal loads
// contribute directly as nodal mass; uniform member loads contribute as
// member mass-per-length (consistent with how core/modal.js already
// expects member mass to be specified); point and trapezoidal member
// loads are approximated by lumping their total load evenly to the two
// end nodes as additional nodal mass (a standard, defensible
// simplification — total mass is exact, only its distribution along the
// member is approximated).
function computeMassFromLoadPattern(model, patternId) {
  const g = UNIT_SYSTEMS[model.unitSystem].g;
  const pattern = (model.loadPatterns || []).find(p => p.id === patternId);
  const nodeMassAdd = new Map();
  const memberMassPerLenAdd = new Map();
  if (!pattern) return { nodeMassAdd, memberMassPerLenAdd };

  for (const nl of pattern.nodalLoads || []) {
    const w = Math.abs(nl.Fy || 0);
    if (w > 0) {
      const m = w / g;
      const cur = nodeMassAdd.get(nl.nodeId) || { mx: 0, my: 0 };
      nodeMassAdd.set(nl.nodeId, { mx: cur.mx + m, my: cur.my + m });
    }
  }
  for (const ml of pattern.memberLoads || []) {
    const member = model.members.find(mm => mm.id === ml.memberId);
    if (!member) continue;
    if (ml.type === "uniform") {
      const w = Math.abs(ml.w || 0);
      memberMassPerLenAdd.set(ml.memberId, (memberMassPerLenAdd.get(ml.memberId) || 0) + w / g);
    } else if (ml.type === "point" || ml.type === "trapezoidal") {
      const L = memberLength(model, member);
      let totalW = 0;
      if (ml.type === "point") totalW = Math.abs(ml.P || 0);
      else {
        const x0 = ml.x0 != null ? ml.x0 : 0, x1 = ml.x1 != null ? ml.x1 : L;
        totalW = Math.abs(((ml.w1 || 0) + (ml.w2 || 0)) / 2) * Math.abs(x1 - x0);
      }
      const halfMass = (totalW / g) / 2;
      for (const nid of [member.nearNodeId, member.farNodeId]) {
        const cur = nodeMassAdd.get(nid) || { mx: 0, my: 0 };
        nodeMassAdd.set(nid, { mx: cur.mx + halfMass, my: cur.my + halfMass });
      }
    }
  }
  return { nodeMassAdd, memberMassPerLenAdd };
}

// Applies the model's configured mass source (if "Advanced" dynamics is
// enabled and set to "From Load Pattern") to a set of resolved nodes and
// members, returning new arrays ready to hand to FC.modal.solveModal.
// When disabled or set to "Manual", the original nodes/members are
// returned unchanged (their own manually-specified mass fields apply).
function applyMassSource(model, resolvedMembers) {
  const cfg = model.dynamicsConfig;
  if (!cfg || !cfg.enabled || !cfg.massSource || cfg.massSource.mode !== "fromPattern" || !cfg.massSource.patternId) {
    return { nodes: model.nodes, members: resolvedMembers };
  }
  const { nodeMassAdd, memberMassPerLenAdd } = computeMassFromLoadPattern(model, cfg.massSource.patternId);
  const includeManual = cfg.massSource.includeManualMass !== false;

  const newNodes = model.nodes.map(n => {
    const add = nodeMassAdd.get(n.id);
    const base = includeManual ? (n.mass || { mx: 0, my: 0, mr: 0 }) : { mx: 0, my: 0, mr: 0 };
    if (!add && !includeManual) return { ...n, mass: base.mx || base.my || base.mr ? base : null };
    if (!add) return n;
    return { ...n, mass: { mx: (base.mx || 0) + add.mx, my: (base.my || 0) + add.my, mr: base.mr || 0 } };
  });

  const newMembers = resolvedMembers.map(m => {
    const add = memberMassPerLenAdd.get(m.id) || 0;
    const base = includeManual ? (m.massPerLength || 0) : 0;
    return { ...m, massPerLength: base + add };
  });

  return { nodes: newNodes, members: newMembers };
}

// Returns the load combination ID for the sensible, purpose-built default
// case for a given analysis type — "Linear Static Default", "P-Delta
// Default", and "Buckling Default" are created in defaultModel() and
// picked up here by name; falls back to the first available combination
// if the model has been edited and no matching named combo exists, so
// this never leaves comboId unset for types that need one.
function getDefaultComboIdForType(model, type) {
  const combos = model.loadCombinations || [];
  const byName = name => combos.find(c => c.name === name);
  let match = null;
  if (type === "static" || type === "movingLoad") match = byName("Linear Static Default");
  else if (type === "pdelta") match = byName("P-Delta Default");
  else if (type === "buckling") match = byName("Buckling Default");
  const chosen = match || combos[0];
  return chosen ? chosen.id : null;
}

function AnalysisTab({ model, results, setResults, settings, setSettings }) {
  const [running, setRunning] = useState(false);

  // If no combo is selected yet (e.g. very first load), default to the
  // purpose-built default combo for the current type.
  useEffect(() => {
    if (!settings.comboId && model.loadCombinations[0]) {
      setSettings(s => ({ ...s, comboId: getDefaultComboIdForType(model, s.type) }));
    }
  }, [model.loadCombinations]);

  const changeType = (newType) => {
    // Switching analysis type auto-selects that type's purpose-built
    // default load case (Linear Static Default / P-Delta Default /
    // Buckling Default), matching the generic defaults documented on the
    // Theory tab, rather than leaving whatever combo happened to be
    // selected for the previous analysis type.
    setSettings(s => ({ ...s, type: newType, comboId: getDefaultComboIdForType(model, newType) || s.comboId }));
  };

  const run = () => {
    setRunning(true);
    setTimeout(() => {
      const res = runAnalysis(model, settings);
      setResults({ type: settings.type, data: res, settings });

    <div>

            <div style={S.smallMuted}>Analysis Type</div>

              {ANALYSIS_TYPES.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
            </select>
          </div>
          {(settings.type === "static" || settings.type === "buckling" || settings.type === "pdelta" || settings.type === "movingLoad") && (
            <div>
              <div style={S.smallMuted}>Load Combination</div>
              <select style={S.select} value={settings.comboId || ""} onChange={e => setSettings(s => ({ ...s, comboId: e.target.value }))}>
                {model.loadCombinations.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </div>
          )}
          {(settings.type === "modal" || settings.type === "buckling" || settings.type === "responseSpectrum") && (
            <div>
              <div style={S.smallMuted}>Number of Modes</div>
              <input style={S.input} type="number" value={settings.nModes} onChange={e => setSettings(s => ({ ...s, nModes: +e.target.value }))} />
            </div>
          )}
          {(settings.type === "modal" || settings.type === "responseSpectrum") && (
            <div>
              <div style={S.smallMuted}>Mass Idealization</div>
              <select style={S.select} value={settings.massType} onChange={e => setSettings(s => ({ ...s, massType: e.target.value }))}>
                <option value="lumped">Lumped</option>
                <option value="consistent">Consistent</option>
              </select>
            </div>
          )}
          {settings.type === "pdelta" && (
            <>
              <div><div style={S.smallMuted}>Max Iterations</div><input style={S.input} type="number" value={settings.maxIter} onChange={e => setSettings(s => ({ ...s, maxIter: +e.target.value }))} /></div>
              <div><div style={S.smallMuted}>Convergence Tol.</div><input style={S.input} type="number" value={settings.tol} onChange={e => setSettings(s => ({ ...s, tol: +e.target.value }))} /></div>
            </>
          )}
          {settings.type === "responseSpectrum" && (
            <>
              <div><div style={S.smallMuted}>Direction</div>
                <select style={S.select} value={settings.direction} onChange={e => setSettings(s => ({ ...s, direction: e.target.value }))}>
                  <option value="X">X</option><option value="Y">Y</option>
                </select>
              </div>
              <div><div style={S.smallMuted}>Combination Method</div>
                <select style={S.select} value={settings.combination} onChange={e => setSettings(s => ({ ...s, combination: e.target.value }))}>
                  <option value="SRSS">SRSS</option><option value="CQC">CQC</option>
                </select>
              </div>
              <div><div style={S.smallMuted}>Damping Ratio</div><input style={S.input} type="number" step="0.01" value={settings.dampingRatio} onChange={e => setSettings(s => ({ ...s, dampingRatio: +e.target.value }))} /></div>
              <div><div style={S.smallMuted}>Spectrum Sds</div><input style={S.input} type="number" value={settings.spectrum.Sds || 1} onChange={e => setSettings(s => ({ ...s, spectrum: { ...s.spectrum, shape: "code", Sds: +e.target.value } }))} /></div>
              <div><div style={S.smallMuted}>Spectrum Sd1</div><input style={S.input} type="number" value={settings.spectrum.Sd1 || 0.4} onChange={e => setSettings(s => ({ ...s, spectrum: { ...s.spectrum, shape: "code", Sd1: +e.target.value } }))} /></div>
            </>

          {settings.type === "movingLoad" && (

              <div><div style={S.smallMuted}>Step Size</div><input style={S.input} type="number" value={settings.stepSize} onChange={e => setSettings(s => ({ ...s, stepSize: +e.target.value }))} /></div>
              <div><div style={S.smallMuted}>Axle Load Magnitude</div><input style={S.input} type="number" value={settings.loadTrain[0].magnitude} onChange={e => setSettings(s => ({ ...s, loadTrain: [{ ...s.loadTrain[0], magnitude: +e.target.value }] }))} /></div>

        </div>
      )}
    </div>
  );
}

function DeformedShapeSVG({ model, displacements, scale, height }) {
  const vb = computeViewBox(model);
  const H = height || 420;
  const drawScale = Math.min(700 / vb.w, H / vb.h);
  const toScreen = (x, y) => ({ sx: (x - vb.minX) * drawScale, sy: H - (y - vb.minY) * drawScale });
  const nodeIndex = new Map(model.nodes.map((n, i) => [n.id, i]));
  const defPos = (n) => {
    const i = nodeIndex.get(n.id);
    const ux = displacements[3 * i] || 0, uy = displacements[3 * i + 1] || 0;
    return { x: n.x + ux * scale, y: n.y + uy * scale };
  };
  return (
    <svg viewBox={`0 0 ${vb.w * drawScale} ${H}`} width="100%" height={H} style={{ background: "#0d1117", border: `1px solid ${CLR.border}`, borderRadius: 6 }}>
      {model.members.map(m => {
        const ni = nodeById(model, m.nearNodeId), nj = nodeById(model, m.farNodeId);
        const p1 = toScreen(ni.x, ni.y), p2 = toScreen(nj.x, nj.y);
        const d1 = defPos(ni), d2 = defPos(nj);
        const dp1 = toScreen(d1.x, d1.y), dp2 = toScreen(d2.x, d2.y);
        return (
          <g key={m.id}>
            <line x1={p1.sx} y1={p1.sy} x2={p2.sx} y2={p2.sy} stroke={CLR.border} strokeWidth={1.5} strokeDasharray="4,3" />
            <line x1={dp1.sx} y1={dp1.sy} x2={dp2.sx} y2={dp2.sy} stroke={CLR.accent} strokeWidth={2.5} />
          </g>
        );
      })}
      {model.nodes.map(n => {
        const d = defPos(n);
        const p = toScreen(d.x, d.y);
        return <circle key={n.id} cx={p.sx} cy={p.sy} r={4} fill={CLR.accent} />;
      })}
    </svg>
  );
}

// ── EXACT SECTION-CUT DIAGRAM SAMPLER ───────────────────────────────────
// Evaluates M(x)/V(x) exactly (not linear-interpolated) given the verified
// end forces q=[N1,V1,M1,N2,V2,M2] (q=k*d+p convention) plus the member's
// actual interior transverse loads for the active combination. Formulas:
//   M_physical(x) = -M1 + V1*x - Σ P_i*(x-a_i) - ∫ w(s)*(x-s) ds
//   V_physical(x) = V1 - Σ P_i - ∫ w(s) ds
// (verified against closed-form beam solutions in test/movingLoadTests.js
// for the point-load case; uniform/trapezoidal integrated in closed form
// below, both reducing to the same section-cut equilibrium principle).
function sampleExactDiagram(L, forces, loads, mode, nPts) {
  const [N1, V1, M1] = forces.local;
  const n = nPts || 60;
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const x = (i / n) * L;
    if (mode === "axial") { pts.push({ x, val: -N1 }); continue; }
    let vSub = 0, mSub = 0;
    for (const ld of (loads || [])) {
      if (ld.kind === "point") {
        if (ld.a <= x + 1e-9) { vSub += ld.P; mSub += ld.P * (x - ld.a); }
      } else if (ld.kind === "uniform") {
        const upper = Math.min(x, ld.x1);
        if (upper > ld.x0) {
          const len = upper - ld.x0;
          vSub += ld.w * len;
          mSub += ld.w * len * (x - ld.x0 - len / 2);
        }
      } else if (ld.kind === "trapezoidal") {
        const upper = Math.min(x, ld.x1);
        if (upper > ld.x0) {
          const len = ld.x1 - ld.x0;
          const Lp = upper - ld.x0;
          const w1 = ld.w1, w2 = ld.w2;
          const vContrib = w1 * Lp + (w2 - w1) * (Lp * Lp) / (2 * len);
          const mContrib = (x - ld.x0) * vContrib - (w1 * Lp * Lp / 2 + (w2 - w1) / len * (Lp ** 3) / 3);
          vSub += vContrib; mSub += mContrib;
        }
      }
    }
    if (mode === "shear") pts.push({ x, val: V1 - vSub });
    else pts.push({ x, val: -M1 + V1 * x - mSub });
  }
  return pts;
}

// ── DIRECT (DOUBLE) INTEGRATION OF CURVATURE FOR THE DEFLECTED SHAPE ────
// Rather than connecting the two deformed end nodes with a straight line
// (which hides interior curvature — e.g. a member sagging under its own
// uniform load between two nearly-undeflected joints), the true transverse
// deflection is recovered by integrating the Euler-Bernoulli curvature
// relation EI*v''(x) = M(x) twice, starting from the EXACT nodal boundary
// values already produced by the verified stiffness solve:
//   v'(x) = th1 + ∫_0^x M(s)/EI ds        (rotation)
//   v(x)  = v1  + ∫_0^x v'(s) ds           (transverse deflection)
// M(x) is the same exact section-cut moment (sampleExactDiagram) used for
// the BMD, so interior member loads are correctly reflected in the shape.
// This is a genuine numerical (Simpson's-rule) integration, not a cubic
// Hermite shortcut — the sign convention EI*v''=+M(x) was verified by
// confirming the integration reproduces the FE solution's own v(L),
// theta(L) at the far end to ~5-6 significant figures (see
// test/deflectionIntegrationTests.js).
function integrateCurvatureShape(L, E, I, forces, loads, nPts) {
  const n = nPts || 60;
  const [N1, V1, M1] = forces.local;
  const dLocal = forces.dLocal;
  const v1_ = dLocal[1], th1 = dLocal[2];
  const h = L / n;

  function Mphys(x) {
    let mSub = 0;
    for (const ld of (loads || [])) {
      if (ld.kind === "point") { if (ld.a <= x + 1e-9) mSub += ld.P * (x - ld.a); }
      else if (ld.kind === "uniform") {
        const upper = Math.min(x, ld.x1);
        if (upper > ld.x0) { const len = upper - ld.x0; mSub += ld.w * len * (x - ld.x0 - len / 2); }
      } else if (ld.kind === "trapezoidal") {
        const upper = Math.min(x, ld.x1);
        if (upper > ld.x0) {
          const len = ld.x1 - ld.x0, Lp = upper - ld.x0, w1 = ld.w1, w2 = ld.w2;
          const vContrib = w1 * Lp + (w2 - w1) * (Lp * Lp) / (2 * len);
          mSub += (x - ld.x0) * vContrib - (w1 * Lp * Lp / 2 + (w2 - w1) / len * (Lp ** 3) / 3);
        }
      }
    }
    return -M1 + V1 * x - mSub;
  }

  const EI = E * I;
  const pts = [{ x: 0, v: v1_, u: dLocal[0] }];
  let theta = th1, v = v1_;
  let mPrev = Mphys(0);
  for (let i = 0; i < n; i++) {
    const x0 = i * h, x1 = (i + 1) * h;
    const mMid = Mphys(x0 + h / 2), mNext = Mphys(x1);
    // Simpson's rule for the rotation increment, trapezoidal for the
    // (smoother) deflection increment — both converge tightly at n=60.
    const thetaNext = theta + (h / 6) * (mPrev / EI + 4 * (mMid / EI) + mNext / EI);
    v += 0.5 * (theta + thetaNext) * h;
    theta = thetaNext; mPrev = mNext;
    const u = dLocal[0] + (dLocal[3] - dLocal[0]) * (x1 / L); // axial: exact linear interpolation (constant strain)
    pts.push({ x: x1, v, u });
  }
  return pts;
}

// ── UNIFIED FRAME DIAGRAM VIEWER ────────────────────────────────────────
// Draws the whole frame with the selected result type (Deflection / BMD /
// SFD / AFD) overlaid directly on the real member geometry — diagrams are
// offset perpendicular to each member's actual orientation, matching how
// conventional structural analysis software presents results, rather than
// as separate abstracted per-member plots.
const DIAGRAM_MODES = [
  { id: "deflection", label: "Deflection" },
  { id: "moment", label: "Bending Moment (BMD)" },
  { id: "shear", label: "Shear Force (SFD)" },
  { id: "axial", label: "Axial Force (AFD)" },
];

function FrameDiagramSVG({ model, data, mode, deflectionScale, height }) {
  const vb = computeViewBox(model, 0.3);
  const H = height || 460;
  const drawScale = Math.min(760 / vb.w, H / vb.h);
  const toScreen = (x, y) => ({ sx: (x - vb.minX) * drawScale, sy: H - (y - vb.minY) * drawScale });
  const nodeIndexOf = id => model.nodes.findIndex(n => n.id === id);

  if (mode === "deflection") {
    return (
      <svg viewBox={`0 0 ${vb.w * drawScale} ${H}`} width="100%" height={H} style={{ background: "#0d1117", border: `1px solid ${CLR.border}`, borderRadius: 6 }}>
        {model.members.map(m => {
          const ni = nodeById(model, m.nearNodeId), nj = nodeById(model, m.farNodeId);
          const p1 = toScreen(ni.x, ni.y), p2 = toScreen(nj.x, nj.y);
          const L = memberLength(model, m);
          const forces = data.memberForces.get(m.id);
          const loads = (data.memberTransverseLoads && data.memberTransverseLoads.get(m.id)) || [];
          const shapePts = integrateCurvatureShape(L, resolveMemberProps(model, m).E, resolveMemberProps(model, m).I, forces, loads, 150);
          const ang = memberAngleDeg(model, m) * Math.PI / 180;
          const c = Math.cos(ang), s = Math.sin(ang);
          const perpX = -s, perpY = c; // local-y unit vector in global coords
          const curvePts = shapePts.map(pt => {
            // local (u,v) -> global displacement, added to the base (undeformed) position along the member axis
            const baseX = ni.x + c * pt.x, baseY = ni.y + s * pt.x;
            const globalDx = (c * pt.u - s * pt.v) * deflectionScale;
            const globalDy = (s * pt.u + c * pt.v) * deflectionScale;
            return toScreen(baseX + globalDx, baseY + globalDy);
          });
          const pathD = curvePts.map((p, i) => `${i === 0 ? "M" : "L"}${p.sx},${p.sy}`).join(" ");
          return (
            <g key={m.id}>
              <line x1={p1.sx} y1={p1.sy} x2={p2.sx} y2={p2.sy} stroke={CLR.border} strokeWidth={1.5} strokeDasharray="4,3" />
              <path d={pathD} fill="none" stroke={CLR.accent} strokeWidth={2.5} />
            </g>
          );
        })}
        {model.nodes.map(n => {
          const i = nodeIndexOf(n.id);
          const ux = data.displacements[3 * i] || 0, uy = data.displacements[3 * i + 1] || 0;
          const p = toScreen(n.x + ux * deflectionScale, n.y + uy * deflectionScale);
          return <circle key={n.id} cx={p.sx} cy={p.sy} r={4} fill={CLR.accent} />;
        })}
      </svg>
    );
  }

  // BMD / SFD / AFD: compute exact diagrams for every member first, so a
  // single global scale factor keeps relative magnitudes comparable.
  const perMember = model.members.map(m => {
    const L = memberLength(model, m);
    const forces = data.memberForces.get(m.id);
    const loads = (data.memberTransverseLoads && data.memberTransverseLoads.get(m.id)) || [];
    const pts = sampleExactDiagram(L, forces, loads, mode, 60);
    return { m, L, pts };
  });
  const globalMax = Math.max(...perMember.flatMap(pm => pm.pts.map(p => Math.abs(p.val))), 1e-9);
  const diagramPxHeight = Math.min(60, vb.w * drawScale * 0.09); // visual offset scale, capped
  const color = mode === "moment" ? CLR.violet : mode === "shear" ? CLR.teal : CLR.orange;

  return (
    <svg viewBox={`0 0 ${vb.w * drawScale} ${H}`} width="100%" height={H} style={{ background: "#0d1117", border: `1px solid ${CLR.border}`, borderRadius: 6 }}>
      {/* Undeformed frame reference lines */}
      {model.members.map(m => {
        const ni = nodeById(model, m.nearNodeId), nj = nodeById(model, m.farNodeId);
        const p1 = toScreen(ni.x, ni.y), p2 = toScreen(nj.x, nj.y);
        return <line key={"ref" + m.id} x1={p1.sx} y1={p1.sy} x2={p2.sx} y2={p2.sy} stroke={CLR.muted} strokeWidth={2} />;
      })}
      {perMember.map(({ m, L, pts }) => {
        const ni = nodeById(model, m.nearNodeId), nj = nodeById(model, m.farNodeId);
        const ang = Math.atan2(nj.y - ni.y, nj.x - ni.x);
        const c = Math.cos(ang), s = Math.sin(ang);
        // Local-y (perpendicular) unit vector in GLOBAL coords.
        const perpX = -s, perpY = c;
        // Bending moment diagrams are drawn on the TENSION side of the
        // member, per standard structural engineering convention. Our
        // verified sign convention has M>0 (sagging) causing tension on
        // the local -y fiber (confirmed against the closed-form wL^2/8
        // midspan moment for a simply-supported beam — see
        // test/momentDiagramTensionSideTests.js), so the diagram offset is
        // negated relative to the raw perpendicular direction for moment
        // mode only; shear/axial retain their original (arbitrary but
        // internally consistent) plotting convention.
        const diagramSign = mode === "moment" ? -1 : 1;
        const pathPts = pts.map(p => {
          const baseX = ni.x + c * p.x, baseY = ni.y + s * p.x;
          const offsetFrac = diagramSign * (p.val / globalMax) * diagramPxHeight;
          // offset in data units so it survives the same toScreen transform
          const offX = baseX + (perpX * offsetFrac) / drawScale;
          const offY = baseY + (perpY * offsetFrac) / drawScale;
          return toScreen(offX, offY);
        });
        const baseStart = toScreen(ni.x, ni.y), baseEnd = toScreen(nj.x, nj.y);
        const pathD = pathPts.map((p, i) => `${i === 0 ? "M" : "L"}${p.sx},${p.sy}`).join(" ");
        const maxPt = pts.reduce((best, p) => Math.abs(p.val) > Math.abs(best.val) ? p : best, pts[0]);
        const maxScreenBase = toScreen(ni.x + c * maxPt.x, ni.y + s * maxPt.x);
        const maxOffsetFrac = diagramSign * (maxPt.val / globalMax) * diagramPxHeight;
        const labelX = maxScreenBase.sx + perpX * maxOffsetFrac * 1.15;
        const labelY = maxScreenBase.sy - perpY * maxOffsetFrac * 1.15;
        return (
          <g key={m.id}>
            <path d={`${pathD} L${baseEnd.sx},${baseEnd.sy} L${baseStart.sx},${baseStart.sy} Z`} fill={color + "38"} stroke={color} strokeWidth={1.5} />
            {Math.abs(maxPt.val) > globalMax * 0.02 && (
              <text x={labelX} y={labelY} fill={color} fontSize={9.5} fontWeight="700" textAnchor="middle">{fmt(maxPt.val, 2)}</text>
            )}
          </g>
        );
      })}
      {model.nodes.map(n => {
        const p = toScreen(n.x, n.y);
        return <circle key={n.id} cx={p.sx} cy={p.sy} r={3.5} fill={CLR.violet} />;
      })}
    </svg>
  );
}

// Self-sufficient results explorer: owns its own load-combination and
// diagram-type selection state and re-solves live (linear static solves
// are cheap), so the user can explore any combination/diagram without
// returning to the Analysis tab. `analysisMode` selects solveLinearStatic
// vs solvePDelta (P-Delta results reuse the same viewer/diagrams).
function LinearResultsExplorer({ model, analysisMode, pdeltaSettings }) {
  const [comboId, setComboId] = useState(model.loadCombinations[0] ? model.loadCombinations[0].id : null);
  const [diagramMode, setDiagramMode] = useState("moment");
  const [scale, setScale] = useState(10);

  const combo = model.loadCombinations.find(c => c.id === comboId) || model.loadCombinations[0];
  const data = useMemo(() => {
    if (!combo) return { status: "Failed", error: "No load combination defined." };
    const { memberFeaLocalMap, nodalLoadVector, memberTransverseLoads } = buildLoadInputsForCombo(model, combo);
    const resolvedMembers = resolveMembersForSolve(model);
    let res;
    if (analysisMode === "pdelta") {
      res = FC.pdelta.solvePDelta(model.nodes, resolvedMembers, memberFeaLocalMap, nodalLoadVector,
        { maxIter: (pdeltaSettings && pdeltaSettings.maxIter) || 30, tol: (pdeltaSettings && pdeltaSettings.tol) || 1e-6 });
    } else {
      res = FC.staticSolver.solveLinearStatic(model.nodes, resolvedMembers, memberFeaLocalMap, nodalLoadVector);
    }
    return { ...res, memberTransverseLoads };
  }, [model, comboId, analysisMode]);

  const dofOf = id => model.nodes.findIndex(n => n.id === id);

  return (
    <div>
      <div style={S.card}>
        <div style={S.h2}>
          <span>Structural Diagrams{analysisMode === "pdelta" ? " (P-Delta / 2nd-Order)" : ""}</span>
          <span style={S.badge(data.status === "Failed" ? CLR.red : data.status === "Successful" ? CLR.green : CLR.yellow)}>{data.status}</span>
        </div>
        {analysisMode === "pdelta" && data.status !== "Failed" && (
          <div style={{ ...S.smallMuted, marginBottom: 10 }}>
            All diagrams below (Deflection, BMD, SFD, AFD) are computed from the P-Delta-converged (second-order) displacements and member end forces — the amplification from destabilizing axial loads is fully reflected, not just in the tabulated values but in the deformed shape curvature and moment diagrams themselves.
          </div>
        )}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 12, marginBottom: 14 }}>
          <div>
            <div style={S.smallMuted}>Load Combination</div>
            <select style={S.select} value={comboId || ""} onChange={e => setComboId(e.target.value)}>
              {model.loadCombinations.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </div>
          <div>
            <div style={S.smallMuted}>Diagram</div>
            <select style={S.select} value={diagramMode} onChange={e => setDiagramMode(e.target.value)}>
              {DIAGRAM_MODES.map(d => <option key={d.id} value={d.id}>{d.label}</option>)}
            </select>
          </div>
          {diagramMode === "deflection" && (
            <div>
              <div style={S.smallMuted}>Deflection Scale ×</div>
              <input style={S.input} type="number" value={scale} onChange={e => setScale(+e.target.value)} />
            </div>
          )}
        </div>
        {data.status === "Failed" ? (
          <div style={{ color: CLR.red, fontSize: 12.5 }}>{data.error}</div>
        ) : (
          <FrameDiagramSVG model={model} data={data} mode={diagramMode} deflectionScale={scale} />
        )}
      </div>

      {data.status !== "Failed" && (
        <React.Fragment>
          {analysisMode === "pdelta" && (
            <div style={S.card}>
              <div style={S.h2}>P-Delta Convergence History</div>
              <table style={S.table}>
                <thead><tr><th style={S.th}>Iteration</th><th style={S.th}>Max Rel. Displacement Change</th></tr></thead>
                <tbody>
                  {data.history.map((h, i) => (
                    <tr key={i}><td style={S.td}>{h.iteration}</td><td style={S.td}>{h.maxDispChange == null ? "—" : h.maxDispChange.toExponential(3)}</td></tr>
                  ))}
                </tbody>
              </table>
              <div style={{ marginTop: 8 }}><span style={S.badge(data.converged ? CLR.green : CLR.yellow)}>{data.converged ? "Converged" : "Not Converged"}</span> after {data.iterations} iteration(s)</div>
            </div>
          )}

          <div style={S.card}>
            <div style={S.h2}>Nodal Displacements</div>
            <table style={S.table}>
              <thead><tr><th style={S.th}>Node</th><th style={S.th}>UX</th><th style={S.th}>UY</th><th style={S.th}>θZ</th></tr></thead>
              <tbody>
                {model.nodes.map(n => {
                  const i = dofOf(n.id);
                  return (
                    <tr key={n.id}>
                      <td style={S.td}><b>{n.id}</b></td>
                      <td style={S.td}>{fmt(data.displacements[3 * i])}</td>
                      <td style={S.td}>{fmt(data.displacements[3 * i + 1])}</td>
                      <td style={S.td}>{fmt(data.displacements[3 * i + 2])}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          <div style={S.card}>
            <div style={S.h2}>Reactions</div>
            <table style={S.table}>
              <thead><tr><th style={S.th}>Node</th><th style={S.th}>Fx</th><th style={S.th}>Fy</th><th style={S.th}>Mz</th></tr></thead>
              <tbody>
                {model.nodes.filter(n => n.restraints.ux || n.restraints.uy || n.restraints.thz).map(n => {
                  const i = dofOf(n.id);
                  return (
                    <tr key={n.id}>
                      <td style={S.td}><b>{n.id}</b></td>
                      <td style={S.td}>{fmt(data.reactions[3 * i])}</td>
                      <td style={S.td}>{fmt(data.reactions[3 * i + 1])}</td>
                      <td style={S.td}>{fmt(data.reactions[3 * i + 2])}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          <div style={S.card}>
            <div style={S.h2}>Member End Forces</div>
            <table style={S.table}>
              <thead><tr><th style={S.th}>Member</th><th style={S.th}>N1</th><th style={S.th}>V1</th><th style={S.th}>M1</th><th style={S.th}>N2</th><th style={S.th}>V2</th><th style={S.th}>M2</th></tr></thead>
              <tbody>
                {model.members.map(m => {
                  const f = data.memberForces.get(m.id);
                  return (
                    <tr key={m.id}>
                      <td style={S.td}><b>{m.id}</b></td>
                      {f.local.map((v, i) => <td key={i} style={S.td}>{fmt(v, 3)}</td>)}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

        <div style={S.h2}>Modal Periods & Frequencies</div>

          <tbody>

              <tr key={i} style={{ background: selMode === i ? "#21262d" : "transparent", cursor: "pointer" }} onClick={() => setSelMode(i)}>

                <td style={S.td}>{fmt(mo.pctMassY * 100, 1)}%</td>

            ))}

        <DeformedShapeSVG model={model} displacements={data.modes[selMode].eigenvector} scale={Math.max(...model.nodes.map(n => Math.hypot(n.x, n.y))) * 0.15 || 20} />
      </div>

}

function BucklingResultsView({ model, data }) {
  const [selMode, setSelMode] = useState(0);

  // Per-member elastic (Euler) buckling strength check: Pcr = pi^2*E*I/(K*L)^2
  // for each member's own properties and user-specified effective-length
  // factor K, compared against that member's actual axial force under the
  // reference load case used for the global buckling analysis (tension
  // positive convention, per core/buckling.js). This is independent of
  // (and complements) the global structure-level buckling eigenanalysis:
  // it flags any individual member that is close to its own standalone
  // Euler capacity, which is a standard design check even when the global
  // buckling load factor is comfortably high.
  const memberChecks = model.members.map(m => {
    const L = memberLength(model, m);
    const { E, I } = resolveMemberProps(model, m);
    const K = m.kFactor != null ? m.kFactor : 1;
    const Pcr = (Math.PI * Math.PI * E * I) / ((K * L) ** 2);
    const N = data.axialForces ? (data.axialForces.get(m.id) || 0) : 0; // tension positive
    const compression = N < 0 ? -N : 0;
    const ratio = compression > 0 ? compression / Pcr : 0;
    return { id: m.id, L, K, Pcr, N, compression, ratio };
  });

  return (
    <div>
      <div style={S.card}>
        <div style={S.h2}>Member Elastic Buckling Strength</div>
        <table style={S.table}>
          <thead><tr>
            <th style={S.th}>Member</th><th style={S.th}>L</th><th style={S.th}>K</th><th style={S.th}>KL</th>
            <th style={S.th}>Pcr = π²EI/(KL)²</th><th style={S.th}>Axial Force (ref. case)</th>
            <th style={S.th}>Compression/Pcr</th><th style={S.th}></th>
          </tr></thead>
          <tbody>
            {memberChecks.map(mc => (
              <tr key={mc.id}>
                <td style={S.td}><b>{mc.id}</b></td>

        <div style={S.smallMuted}>Each member's own standalone Euler elastic buckling capacity, using its resolved E and I, its actual length L, and its assigned effective-length factor K (set per-member in the Model tab). This is a per-member design check, separate from the global (structure-level) buckling load factor λ reported below, which governs overall frame instability modes.</div>
      </div>

      {(!data.modes || data.modes.length === 0) ? (

          </div>

          <div style={S.card}>

    </div>
  );
}

function ResultsTab({ model, results }) {
  if (!results || !results.data) return <div style={S.card}>Run an analysis from the Analysis tab to see results here.</div>;
  const { type, data } = results;
  // Static and P-Delta results are explored live (combo + diagram type
  // dropdowns re-solve on the fly), so a stale failure from whatever combo
  // was active when "Run Analysis" was last clicked should not block the
  // explorer — it reports failures per-combo internally instead.
  if (type === "static") return <LinearResultsExplorer model={model} analysisMode="static" />;
  if (type === "pdelta") return <LinearResultsExplorer model={model} analysisMode="pdelta" pdeltaSettings={results.settings} />;
  if (data.status === "Failed") return <div style={S.card}><span style={S.badge(CLR.red)}>Failed</span><div style={{ marginTop: 10 }}>{data.error}</div></div>;
  if (type === "modal") return <ModalResultsView model={model} data={data} />;
  if (type === "buckling") return <BucklingResultsView model={model} data={data} />;
  if (type === "movingLoad") return <MovingLoadResultsView model={model} data={data} />;
  if (type === "responseSpectrum") return <ResponseSpectrumResultsView model={model} data={data} />;
  return null;
}

// ── EXPORT: CSV ──────────────────────────────────────────────────────────
function resultsToCSV(model, results) {
  if (!results || !results.data || results.data.status === "Failed") return "No successful results to export.";
  const { type, data } = results;
  let lines = [];
  if (type === "static" || type === "pdelta") {
    lines.push("Node,UX,UY,ThetaZ");
    model.nodes.forEach((n, i) => lines.push(`${n.id},${data.displacements[3 * i]},${data.displacements[3 * i + 1]},${data.displacements[3 * i + 2]}`));
    lines.push("");
    lines.push("Node,Rx,Ry,Mz (reactions)");
    model.nodes.forEach((n, i) => lines.push(`${n.id},${data.reactions[3 * i]},${data.reactions[3 * i + 1]},${data.reactions[3 * i + 2]}`));
    lines.push("");
    lines.push("Member,N1,V1,M1,N2,V2,M2");
    model.members.forEach(m => { const f = data.memberForces.get(m.id).local; lines.push(`${m.id},${f.join(",")}`); });
  } else if (type === "modal") {
    lines.push("Mode,Period(s),Freq(Hz),Omega(rad/s),%MassX,%MassY");
    data.modes.forEach(mo => lines.push(`${mo.index},${mo.period},${mo.frequencyHz},${mo.omega},${mo.pctMassX * 100},${mo.pctMassY * 100}`));
  } else if (type === "buckling") {
    lines.push("Mode,LoadFactor,Residual");
    data.modes.forEach((mo, i) => lines.push(`${i + 1},${mo.loadFactor},${mo.residual}`));
  } else if (type === "movingLoad") {
    lines.push("Response,Max,MaxPos,Min,MinPos");
    data.results.forEach(r => lines.push(`${r.id},${r.max},${r.maxPos},${r.min},${r.minPos}`));
  } else if (type === "responseSpectrum") {
    lines.push("Node,|UX|,|UY|,|ThetaZ|");
    model.nodes.forEach((n, i) => lines.push(`${n.id},${data.combinedDisplacements[3 * i]},${data.combinedDisplacements[3 * i + 1]},${data.combinedDisplacements[3 * i + 2]}`));
  }
  return lines.join("\n");
}

function downloadText(filename, text, mime) {
  const blob = new Blob([text], { type: mime || "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
