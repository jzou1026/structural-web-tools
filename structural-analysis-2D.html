                              </select>
                            </td>
                            <td style={S.td}><input style={S.input} type="number" value={fmt2(toDisp(m.E,D_.pressure))} onChange={e=>updateRow(setMembers,m.id,"E",toBse(+e.target.value,D_.pressure))} /></td>
                            <td style={S.td}><input style={S.input} type="number" value={fmt4(toDisp(m.A,D_.area))} onChange={e=>updateRow(setMembers,m.id,"A",toBse(+e.target.value,D_.area))} /></td>
                            <td style={S.td}><input style={S.input} type="number" value={fmt4(toDisp(m.I,D_.inertia))} onChange={e=>updateRow(setMembers,m.id,"I",toBse(+e.target.value,D_.inertia))} /></td>
                            <td style={S.td}>
                              <select style={S.input} value={m.fixity} onChange={e=>updateRow(setMembers,m.id,"fixity",e.target.value)}>
                                {FIXITY_OPTIONS.map(o=><option key={o} value={o}>{o}</option>)}
                              </select>
                            </td>
                            <td style={S.td}><button style={{ ...S.btn("danger"), padding:"3px 8px", fontSize:10 }} onClick={()=>delRow(setMembers,m.id)}>✕</button></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                {advanced && <div style={{...S.card,padding:0,overflow:"hidden",border:`1px solid ${CLR.orange}66`}}>
                  <div style={{padding:"1rem 1.25rem",borderBottom:`1px solid ${CLR.border}`}}><div style={S.h2}>Advanced: Response Spectrum Analysis</div><div style={{fontSize:11,color:CLR.muted}}>Default 5%-damped Site C hazard ordinates are from the supplied Burnaby Lake Overpass hazard-tool report. The modal algorithm follows Frames v0.6.6 and combines modal responses by SRSS.</div></div>
                  <div style={{padding:"1rem 1.25rem",display:"grid",gridTemplateColumns:"repeat(6,minmax(120px,1fr))",gap:10}}><label style={{fontSize:11,color:CLR.muted}}>Mass source<select style={S.input} value={spectrumSettings.massSource||loadCases.find(c=>!c.generated)?.name||""} onChange={e=>setSpectrumSettings(x=>({...x,massSource:e.target.value}))}>{loadCases.filter(c=>!c.generated).map(c=><option key={c.id} value={c.name}>{c.name}</option>)}</select></label><label style={{fontSize:11,color:CLR.muted}}>Direction<select style={S.input} value={spectrumSettings.direction} onChange={e=>setSpectrumSettings(x=>({...x,direction:e.target.value}))}><option>X</option><option>Y</option></select></label><label style={{fontSize:11,color:CLR.muted}}>Damping ratio<input style={S.input} type="number" step=".01" value={spectrumSettings.damping} onChange={e=>setSpectrumSettings(x=>({...x,damping:+e.target.value}))}/></label><label style={{fontSize:11,color:CLR.muted}}>Modes<input style={S.input} type="number" min="1" value={spectrumSettings.modes} onChange={e=>setSpectrumSettings(x=>({...x,modes:+e.target.value}))}/></label><label style={{fontSize:11,color:CLR.muted}}>Gravity (mm/s²)<input style={S.input} type="number" value={spectrumSettings.gravity} onChange={e=>setSpectrumSettings(x=>({...x,gravity:+e.target.value}))}/></label><label style={{fontSize:11,color:CLR.muted}}>Scale factor<input style={S.input} type="number" step="any" value={spectrumSettings.scale} onChange={e=>setSpectrumSettings(x=>({...x,scale:+e.target.value}))}/></label></div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1.2fr",gap:16,padding:"0 1.25rem 1.25rem"}}><div><div style={{display:"flex",alignItems:"center",marginBottom:8}}><strong style={{fontSize:12}}>Spectrum ordinates</strong><button style={{...S.btn("ghost"),marginLeft:"auto",padding:"3px 9px",fontSize:10}} onClick={()=>setSpectrum(p=>[...p,{id:nextId.current.spectrum++,T:0,Sa:0}])}>+ Point</button></div><table style={S.table}><thead><tr><th style={S.th}>T (s)</th><th style={S.th}>Sa (g)</th><th style={S.th}>—</th></tr></thead><tbody>{spectrum.map((r,i)=><tr key={r.id}><td style={S.td}><input style={S.input} type="number" step="any" value={r.T} onChange={e=>updateRow(setSpectrum,r.id,"T",+e.target.value)}/></td><td style={S.td}><input style={S.input} type="number" step="any" value={r.Sa} onChange={e=>updateRow(setSpectrum,r.id,"Sa",+e.target.value)}/></td><td style={S.td}><button style={{...S.btn("danger"),padding:"2px 7px"}} onClick={()=>delRow(setSpectrum,r.id)}>✕</button></td></tr>)}</tbody></table></div><SpectrumChart points={spectrum}/></div>
                  <div style={{padding:"0 1.25rem 1.25rem",fontSize:11,color:CLR.muted}}>Mass is derived exclusively from the selected mass-source load case. Rotational and other massless free DOFs are statically condensed. Modal responses are combined by square-root-sum-of-squares (SRSS).</div>
                </div>}

                <div style={{ ...S.card, padding:0, overflow:"hidden" }}>
                  <div style={{ display:"flex", alignItems:"center", padding:"1rem 1.25rem", borderBottom:`1px solid ${CLR.border}`, gap:8 }}>
                    <div><div style={S.h2}>Load Case Manager</div><div style={{fontSize:11,color:CLR.muted}}>Select the active case for load entry. Rename, duplicate, enable, or delete cases safely; references update automatically.</div></div>
                    <button style={{...S.btn("ghost"),marginLeft:"auto",padding:"4px 12px",fontSize:11}} onClick={addLoadCase}>+ Add Case</button>
                    <button style={{...S.btn("ghost"),padding:"4px 12px",fontSize:11}} disabled={!activeLoadCase} onClick={()=>activeLoadCase&&duplicateLoadCase(activeLoadCase.id)}>⧉ Duplicate Active</button>
                  </div>
                  <div style={{overflowX:"auto"}}><table style={S.table}><thead><tr><th style={S.th}>Active</th><th style={S.th}>Enabled</th><th style={S.th}>Name</th><th style={S.th}>Type</th><th style={S.th}>Description</th><th style={S.th}>Loads</th><th style={S.th}>—</th></tr></thead><tbody>
                    {loadCases.map((c,i)=>{const count=nodalLoads.filter(l=>l.loadCase===c.name).length+memberLoads.filter(l=>l.loadCase===c.name).length;return <tr key={c.id} style={{background:c.id===activeLoadCase?.id?CLR.accent+"16":i%2?"#ffffff05":"transparent"}}>
                      <td style={S.td}><input type="radio" checked={c.id===activeLoadCase?.id} onChange={()=>setActiveLoadCaseId(c.id)}/></td>
                      <td style={S.td}><input type="checkbox" checked={c.enabled!==false} disabled={c.generated} onChange={e=>updateRow(setLoadCases,c.id,"enabled",e.target.checked)}/></td>
                      <td style={S.td}><input style={S.input} disabled={c.generated} value={c.name} onChange={e=>renameLoadCase(c.id,e.target.value)}/></td>
                      <td style={S.td}><select style={S.input} disabled={c.generated} value={c.type||"Other"} onChange={e=>updateRow(setLoadCases,c.id,"type",e.target.value)}>{LOAD_CASE_TYPES.map(t=><option key={t}>{t}</option>)}</select></td>
                      <td style={S.td}><input style={{...S.input,textAlign:"left"}} value={c.description||""} onChange={e=>updateRow(setLoadCases,c.id,"description",e.target.value)}/></td>
                      <td style={S.td}><span style={S.badge(CLR.violet)}>{count}</span></td>
                      <td style={S.td}><button style={{...S.btn("danger"),padding:"3px 8px",fontSize:10,opacity:loadCases.length<=1?.4:1}} disabled={loadCases.length<=1||c.generated} onClick={()=>deleteLoadCase(c.id)}>✕</button></td>
                    </tr>})}
                  </tbody></table></div>
                </div>

                <div style={{ ...S.card, padding:0, overflow:"hidden" }}>
                  <div style={{ display:"flex", alignItems:"center", padding:"1rem 1.25rem", borderBottom:`1px solid ${CLR.border}` }}>
                    <div>
                      <div style={S.h2}>Nodal Loads</div>
                      <div style={{ fontSize:11, color:CLR.muted }}>Global directions. FX, FY in {units.force}; MZ in {units.force}·{units.length}.</div>
                    </div>
                    <button style={{ ...S.btn("ghost"), marginLeft:"auto", padding:"4px 12px", fontSize:11 }} onClick={addNodalLoad}>+ Add</button>
                  </div>
                  <div style={{ overflowX:"auto" }}>
                    <table style={S.table}>
                      <thead><tr>
                        <th style={S.th}>Load Case</th><th style={S.th}>Node</th><th style={S.th}>FX ({units.force})</th><th style={S.th}>FY ({units.force})</th><th style={S.th}>MZ ({units.force}·{units.length})</th><th style={S.th}>—</th>
                      </tr></thead>
                      <tbody>
                        {nodalLoads.filter(l=>l.loadCase===activeLoadCase?.name).map((l,i)=>(
                          <tr key={l.id} style={{ background: i%2===0?"transparent":"#ffffff05" }}>
                            <td style={S.td}>
                              <select style={S.input} value={l.loadCase} onChange={e=>updateRow(setNodalLoads,l.id,"loadCase",e.target.value)}>
                                {loadCaseOptions.map(o=><option key={o} value={o}>{o}</option>)}
                              </select>
                            </td>
                            <td style={S.td}>
                              <select style={S.input} value={l.node} onChange={e=>updateRow(setNodalLoads,l.id,"node",e.target.value)}>
                                {nodeOptions.map(o=><option key={o} value={o}>{o}</option>)}
                              </select>
                            </td>
                            <td style={S.td}><input style={S.input} type="number" value={fmt3(toDisp(l.FX,D_.force))} onChange={e=>updateRow(setNodalLoads,l.id,"FX",toBse(+e.target.value,D_.force))} /></td>
                            <td style={S.td}><input style={S.input} type="number" value={fmt3(toDisp(l.FY,D_.force))} onChange={e=>updateRow(setNodalLoads,l.id,"FY",toBse(+e.target.value,D_.force))} /></td>
                            <td style={S.td}><input style={S.input} type="number" value={fmt3(toDisp(l.MZ,D_.moment))} onChange={e=>updateRow(setNodalLoads,l.id,"MZ",toBse(+e.target.value,D_.moment))} /></td>
                            <td style={S.td}><button style={{ ...S.btn("danger"), padding:"3px 8px", fontSize:10 }} onClick={()=>delRow(setNodalLoads,l.id)}>✕</button></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                <div style={{ ...S.card, padding:0, overflow:"hidden" }}>
                  <div style={{ display:"flex", alignItems:"center", padding:"1rem 1.25rem", borderBottom:`1px solid ${CLR.border}` }}>
                    <div>
                      <div style={S.h2}>Member Loads</div>
                      <div style={{ fontSize:11, color:CLR.muted }}>UDL/trapezoidal (w1→w2, {units.force}/{units.length}, local-y direction) over start/end fraction of span, or a point load P ({units.force}) at distance a ({units.length}) from the near node.</div>
                    </div>
                    <button style={{ ...S.btn("ghost"), marginLeft:"auto", padding:"4px 12px", fontSize:11 }} onClick={addMemberLoad}>+ Add</button>
                  </div>
                  <div style={{ overflowX:"auto" }}>
                    <table style={S.table}>
                      <thead><tr>
                        <th style={S.th}>Load Case</th><th style={S.th}>Member</th><th style={S.th}>Type</th>
                        <th style={S.th}>w1 ({units.force}/{units.length})</th><th style={S.th}>w2 ({units.force}/{units.length})</th><th style={S.th}>Start s1 (0–1)</th><th style={S.th}>End s2 (0–1)</th>
                        <th style={S.th}>P ({units.force})</th><th style={S.th}>a ({units.length})</th><th style={S.th}>—</th>
                      </tr></thead>
                      <tbody>
                        {memberLoads.filter(l=>l.loadCase===activeLoadCase?.name).map((l,i)=>(
                          <tr key={l.id} style={{ background: i%2===0?"transparent":"#ffffff05" }}>
                            <td style={S.td}>
                              <select style={S.input} value={l.loadCase} onChange={e=>updateRow(setMemberLoads,l.id,"loadCase",e.target.value)}>
                                {loadCaseOptions.map(o=><option key={o} value={o}>{o}</option>)}
                              </select>
                            </td>
                            <td style={S.td}>
                              <select style={S.input} value={l.member} onChange={e=>updateRow(setMemberLoads,l.id,"member",e.target.value)}>
                                {memberOptions.map(o=><option key={o} value={o}>{o}</option>)}
                              </select>
                            </td>
                            <td style={S.td}>
                              <select style={S.input} value={l.type} onChange={e=>updateRow(setMemberLoads,l.id,"type",e.target.value)}>
                                <option value="udl">UDL / Trapezoidal</option>
                                <option value="point">Point Load</option>
                              </select>
                            </td>
                            <td style={S.td}><input style={S.input} type="number" step="any" disabled={l.type!=="udl"} value={fmt4(toDisp(l.w1,D_.distLoad))} onChange={e=>updateRow(setMemberLoads,l.id,"w1",toBse(+e.target.value,D_.distLoad))} /></td>
                            <td style={S.td}><input style={S.input} type="number" step="any" disabled={l.type!=="udl"} value={fmt4(toDisp(l.w2,D_.distLoad))} onChange={e=>updateRow(setMemberLoads,l.id,"w2",toBse(+e.target.value,D_.distLoad))} /></td>
                            <td style={S.td}><input style={S.input} type="number" step="any" min="0" max="1" disabled={l.type!=="udl"} value={l.s1} onChange={e=>updateRow(setMemberLoads,l.id,"s1",+e.target.value)} /></td>
                            <td style={S.td}><input style={S.input} type="number" step="any" min="0" max="1" disabled={l.type!=="udl"} value={l.s2} onChange={e=>updateRow(setMemberLoads,l.id,"s2",+e.target.value)} /></td>
                            <td style={S.td}><input style={S.input} type="number" step="any" disabled={l.type!=="point"} value={fmt3(toDisp(l.P,D_.force))} onChange={e=>updateRow(setMemberLoads,l.id,"P",toBse(+e.target.value,D_.force))} /></td>
                            <td style={S.td}><input style={S.input} type="number" step="any" disabled={l.type!=="point"} value={fmt3(toDisp(l.a,D_.length))} onChange={e=>updateRow(setMemberLoads,l.id,"a",toBse(+e.target.value,D_.length))} /></td>
                            <td style={S.td}><button style={{ ...S.btn("danger"), padding:"3px 8px", fontSize:10 }} onClick={()=>delRow(setMemberLoads,l.id)}>✕</button></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                <div style={{ ...S.card, padding:0, overflow:"hidden" }}>
                  <div style={{display:"flex",alignItems:"center",padding:"1rem 1.25rem",borderBottom:`1px solid ${CLR.border}`,gap:8}}><div><div style={S.h2}>Load Combination Manager</div><div style={{fontSize:11,color:CLR.muted}}>Define factored linear combinations. Disabled cases are omitted from analysis and combination results.</div></div><button style={{...S.btn("ghost"),marginLeft:"auto",padding:"4px 12px",fontSize:11}} onClick={addCombo}>+ Add Combination</button></div>
                  <div style={{overflowX:"auto"}}><table style={{...S.table,minWidth:700+loadCaseOptions.length*110}}><thead><tr><th style={S.th}>Enabled</th><th style={S.th}>Combination</th><th style={S.th}>Type</th><th style={S.th}>Description</th>{loadCaseOptions.map(o=><th key={o} style={S.th}>{o}<br/>Factor</th>)}<th style={S.th}>Actions</th></tr></thead><tbody>
                    {combos.map((c,i)=><tr key={c.id} style={{background:i%2?"#ffffff05":"transparent"}}><td style={S.td}><input type="checkbox" checked={c.enabled!==false} onChange={e=>updateRow(setCombos,c.id,"enabled",e.target.checked)}/></td><td style={S.td}><input style={S.input} value={c.name} onChange={e=>updateRow(setCombos,c.id,"name",e.target.value)}/></td><td style={S.td}><select style={S.input} value={c.type||"Strength"} onChange={e=>updateRow(setCombos,c.id,"type",e.target.value)}>{COMBINATION_TYPES.map(t=><option key={t}>{t}</option>)}</select></td><td style={S.td}><input style={{...S.input,textAlign:"left"}} value={c.description||""} onChange={e=>updateRow(setCombos,c.id,"description",e.target.value)}/></td>{loadCaseOptions.map(o=><td key={o} style={S.td}><input style={S.input} type="number" step="any" value={comboFactorFor(c,o)} onChange={e=>updateComboTerm(c.id,o,+e.target.value)}/></td>)}<td style={S.td}><div style={{display:"flex",gap:5,justifyContent:"center"}}><button style={{...S.btn("ghost"),padding:"3px 7px",fontSize:10}} onClick={()=>duplicateCombo(c.id)}>⧉</button><button style={{...S.btn("danger"),padding:"3px 7px",fontSize:10}} onClick={()=>deleteCombo(c.id)}>✕</button></div></td></tr>)}
                  </tbody></table></div>
                </div>
              </div>
            )}

            {tab==="results" && (
              solved===null ? (
                <div style={S.card}>
                  <div style={{ color:CLR.muted, fontSize:13 }}>No results yet — go to the Inputs tab and click <strong>Analyze</strong>.</div>
                </div>
              ) : (!activeResult || activeResult.error) ? (
                <div style={{ ...S.card, border:`1px solid ${CLR.red}` }}>
                  <div style={{ color:CLR.red, fontWeight:700 }}>Error: {activeResult ? activeResult.error : "No result case selected."}</div>
                </div>
              ) : (
                <div className="report-results-block">
                  <div className="screen-only" style={{ display:"flex", alignItems:"center", gap:12, marginBottom:"1.25rem", flexWrap:"wrap" }}>
                    <div>
                      <div style={{ fontSize:20, fontWeight:800 }}>Analysis Results</div>
                      <div style={{ fontSize:11, color:CLR.muted }}>Use the report button to print or save this results package as a PDF.</div>
                    </div>
                    <div style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:10, flexWrap:"wrap" }}>
                      <label style={{ fontSize:11, color:CLR.muted, textTransform:"uppercase", fontWeight:700 }}>Result Case</label>
                      <select style={{ ...S.input, width:220, textAlign:"left" }} value={resultCaseKey} onChange={e=>setResultCaseKey(e.target.value)}>
                        {advanced && spectrumResult && !spectrumResult.error && <><option value="spectrum">Response Spectrum (SRSS)</option><option value="modal">Modal</option></>}
                        <optgroup label="Combinations">
                          {combos.filter(c=>c.enabled!==false).map(c=><option key={"combo:"+c.id} value={"combo:"+c.id}>{c.name}</option>)}
                        </optgroup>
                        <optgroup label="Load Cases">
                          {loadCases.filter(c=>c.enabled!==false).map(c=><option key={"case:"+c.id} value={"case:"+c.id}>{c.name}</option>)}
                        </optgroup>
                      </select>
                      {resultCaseKey==="modal" && spectrumResult && !spectrumResult.error && <><label style={{fontSize:11,color:CLR.muted,textTransform:"uppercase",fontWeight:700}}>Mode</label><select style={{...S.input,width:150,textAlign:"left"}} value={selectedMode} onChange={e=>setSelectedMode(+e.target.value)}>{spectrumResult.modes.map(m=><option key={m.mode} value={m.mode}>Mode {m.mode} — {fmt4(m.T)} s</option>)}</select></>}
                      <label style={{ fontSize:11, color:CLR.muted, textTransform:"uppercase", fontWeight:700 }}>Diagram</label>
                      <select style={{ ...S.input, width:230, textAlign:"left" }} value={diagramType} onChange={e=>setDiagramType(e.target.value)}>
                        <option value="N">Axial Force Diagram (AFD)</option>
                        <option value="V">Shear Force Diagram (SFD)</option>
                        <option value="M">Bending Moment Diagram (BMD, tension face)</option>
                        <option value="D">Deflection Diagram (DD)</option>
                        {resultCaseKey==="spectrum" && <option value="LOAD">Equivalent Seismic Load Diagram</option>}
                      </select>
                      <button style={{ ...S.btn("primary"), padding:"8px 20px", fontSize:13 }} onClick={printReport}>🖨 Print / Save PDF Report</button>
                    </div>
                  </div>

                  <div className="print-report-header">
                    <h1>Plane Frames v1.6 — Frame Analysis Report</h1>
                    <div className="meta">
                      2D Direct Stiffness Method | Result Case: {activeResult.label} | Units: {units.force}, {units.length}<br/>
                      Generated: {reportDate}<br/>
                      Nodes: {nodes.length} | Members: {members.length} | Load Cases: {loadCases.filter(c=>c.enabled!==false).length} enabled / {loadCases.length} total
                    </div>
                  </div>

                  <div className="print-avoid print-diagram-section" style={{ ...S.card, marginBottom:"1.5rem" }}>
                    <div style={S.h2}>
                      {diagramType==="LOAD"?"Equivalent Seismic Load Diagram":diagramType==="N"?(activeResult.isSpectrum?"Response Spectrum Axial Force Diagram (SRSS Envelope)":"Axial Force Diagram"):diagramType==="V"?(activeResult.isSpectrum?"Response Spectrum Shear Force Diagram (SRSS Envelope)":"Shear Force Diagram"):diagramType==="M"?(activeResult.isSpectrum?"Response Spectrum Bending Moment Diagram (SRSS Envelope)":"Bending Moment Diagram (Tension Face)"):"Deflection Diagram (exaggerated for visibility)"} — {activeResult.label}
                    </div>
                    {diagramType==="LOAD" && activeResult.isSpectrum
                      ? <ResponseSpectrumLoadDiagram nodes={nodes} members={members} loads={activeResult.equivalentLoads||[]} units={units} toDisp={toDisp}/>
                      : <FrameDiagram nodes={nodes} members={members} overlay={{
                          type: diagramType,
                          memberSample: activeResult.memberSample,
                          fmt: diagramType==="N" ? (v=>fmt2(toDisp(v,D_.force))+" "+units.force)
                             : diagramType==="V" ? (v=>fmt2(toDisp(v,D_.force))+" "+units.force)
                             : diagramType==="M" ? (v=>fmt2(toDisp(v,D_.moment))+" "+units.force+"·"+units.length)
                             : (v=>fmt4(toDisp(v,D_.length))+" "+units.length),
                        }} />}
                    <div style={{ fontSize:10.5, color:CLR.muted, marginTop:"0.75rem", lineHeight:1.6 }}>
                      {diagramType==="LOAD"
                        ? "SRSS-combined equivalent seismic load magnitudes are displayed at the nodes. Because SRSS eliminates algebraic sign, arrows indicate positive display directions and labels report magnitudes."
                        : diagramType==="D"
                        ? "Deflected shape from double integration of EIv″=−M(x), solved numerically by 4th-order Runge–Kutta with the FE-solved end rotation/deflection as initial conditions. Yellow label marks the largest displacement magnitude along each member; the dashed grey line is the undeformed member."
                        : activeResult.isSpectrum
                          ? "Response-spectrum AFD, SFD, and BMD values are calculated independently for every mode at 81 stations along each member, then combined point-by-point using SRSS. The plotted ordinates are non-negative response envelopes, not one simultaneous signed static force state."
                          : "Diagram values follow the standard internal-force sweep from the near end (start label) to the far end (end label): V(x)=−V₁−∫w dx, M(x)=M₁−V₁x−∫w(x−s)dx (Equation 6 in Theory). This can differ in sign from the raw Q-vector convention used in Table 3 below — see the note under that table."}
                    </div>
                  </div>

                  {activeResult.isSpectrum && <div className="print-avoid print-table-section" style={{...S.card,padding:0,overflow:"hidden",marginBottom:"1.5rem"}}><div style={{padding:"1rem 1.25rem",borderBottom:`1px solid ${CLR.border}`}}><div style={S.h2}>Response Spectrum Equivalent Seismic Loads — SRSS Magnitudes</div></div><table style={S.table}><thead><tr><th style={S.th}>Node</th><th style={S.th}>Fx ({units.force})</th><th style={S.th}>Fy ({units.force})</th><th style={S.th}>Mz ({units.force}·{units.length})</th></tr></thead><tbody>{(activeResult.equivalentLoads||[]).map(l=><tr key={l.node}><td style={S.td}>{l.node}</td><td style={S.td}>{fmt3(toDisp(l.FX,D_.force))}</td><td style={S.td}>{fmt3(toDisp(l.FY,D_.force))}</td><td style={S.td}>{fmt3(toDisp(l.MZ,D_.moment))}</td></tr>)}</tbody></table></div>}
                  {activeResult.isSpectrum && <div className="print-avoid print-table-section" style={{...S.card,padding:0,overflow:"hidden",marginBottom:"1.5rem"}}><div style={{padding:"1rem 1.25rem",borderBottom:`1px solid ${CLR.border}`}}><div style={S.h2}>Response Spectrum Member Diagram Envelopes — SRSS</div><div style={{fontSize:11,color:CLR.muted}}>Maximum plotted ordinate from the point-by-point SRSS AFD, SFD, and BMD for each member.</div></div><table style={S.table}><thead><tr><th style={S.th}>Member</th><th style={S.th}>Max AFD ({units.force})</th><th style={S.th}>Max SFD ({units.force})</th><th style={S.th}>Max BMD ({units.force}·{units.length})</th></tr></thead><tbody>{members.map(m=>{const d=activeResult.memberDiagramData?.[m.label],n=Math.max(0,...(d?.afd||[]).map(p=>p.N)),v=Math.max(0,...(d?.sfd||[]).map(p=>p.V)),mm=Math.max(0,...(d?.bmd||[]).map(p=>p.M));return <tr key={m.id}><td style={S.td}>{m.label}</td><td style={S.td}>{fmt3(toDisp(n,D_.force))}</td><td style={S.td}>{fmt3(toDisp(v,D_.force))}</td><td style={S.td}>{fmt3(toDisp(mm,D_.moment))}</td></tr>})}</tbody></table></div>}
                  {(activeResult.isSpectrum||activeResult.isModal) && <div className="print-avoid print-table-section" style={{...S.card,padding:0,overflow:"hidden",marginBottom:"1.5rem"}}><div style={{padding:"1rem 1.25rem",borderBottom:`1px solid ${CLR.border}`}}><div style={S.h2}>Modal Properties — SRSS Combination</div></div><div style={{overflowX:"auto"}}><table style={S.table}><thead><tr><th style={S.th}>Mode</th><th style={S.th}>Period (s)</th><th style={S.th}>Sa (g)</th><th style={S.th}>Participation Γ</th><th style={S.th}>Effective Mass</th><th style={S.th}>Mass %</th><th style={S.th}>Modal Base Shear</th></tr></thead><tbody>{activeResult.modes.map(m=><tr key={m.mode} style={{background:activeResult.selectedMode?.mode===m.mode?CLR.accent+"20":undefined}}><td style={S.td}>{m.mode}</td><td style={S.td}>{fmt4(m.T)}</td><td style={S.td}>{fmt4(m.Sa)}</td><td style={S.td}>{fmt4(m.Gamma)}</td><td style={S.td}>{fmt3(m.effectiveMass)}</td><td style={S.td}>{fmt2(m.participation)}%</td><td style={S.td}>{fmt3(m.baseShear)}</td></tr>)}</tbody></table></div></div>}
                  <div className="print-avoid print-table-section" style={{ ...S.card, padding:0, overflow:"hidden", marginBottom:"1.5rem" }}>
                    <div style={{ padding:"1rem 1.25rem", borderBottom:`1px solid ${CLR.border}` }}><div style={S.h2}>Table 1: Support Reactions</div></div>
                    <div style={{ overflowX:"auto" }}>
                      <table style={S.table}>
                        <thead><tr><th style={S.th}>Node</th><th style={S.th}>Rx ({units.force})</th><th style={S.th}>Ry ({units.force})</th><th style={S.th}>Mz ({units.force}·{units.length})</th></tr></thead>
                        <tbody>
                          {nodes.filter(n=>n.ux||n.uy||n.rz).map((n,i)=>{
                            const gi = activeResult.dofIndex[n.label];
                            return (
                              <tr key={n.id} style={{ background: i%2===0?"transparent":"#ffffff05" }}>
                                <td style={{...S.td, fontWeight:700, color:CLR.accent}}>{n.label}</td>
                                <td style={S.td}>{n.ux ? fmt3(toDisp(activeResult.R[gi],D_.force)) : "—"}</td>
                                <td style={S.td}>{n.uy ? fmt3(toDisp(activeResult.R[gi+1],D_.force)) : "—"}</td>
                                <td style={S.td}>{n.rz ? fmt3(toDisp(activeResult.R[gi+2],D_.moment)) : "—"}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  <div className="print-avoid print-table-section" style={{ ...S.card, padding:0, overflow:"hidden", marginBottom:"1.5rem" }}>
                    <div style={{ padding:"1rem 1.25rem", borderBottom:`1px solid ${CLR.border}` }}><div style={S.h2}>Table 2: Nodal Displacements</div></div>
                    <div style={{ overflowX:"auto" }}>
                      <table style={S.table}>
                        <thead><tr><th style={S.th}>Node</th><th style={S.th}>Ux ({units.length})</th><th style={S.th}>Uy ({units.length})</th><th style={S.th}>Rz (rad)</th></tr></thead>
                        <tbody>
                          {nodes.map((n,i)=>{
                            const gi = activeResult.dofIndex[n.label];
                            return (
                              <tr key={n.id} style={{ background: i%2===0?"transparent":"#ffffff05" }}>
                                <td style={{...S.td, fontWeight:700, color:CLR.accent}}>{n.label}</td>
                                <td style={S.td}>{fmt6(toDisp(activeResult.D[gi],D_.length))}</td>
                                <td style={S.td}>{fmt6(toDisp(activeResult.D[gi+1],D_.length))}</td>
                                <td style={S.td}>{fmt6(activeResult.D[gi+2])}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  <div className="print-avoid print-table-section" style={{ ...S.card, padding:0, overflow:"hidden" }}>
                    <div style={{ padding:"1rem 1.25rem", borderBottom:`1px solid ${CLR.border}` }}>
                      <div style={S.h2}>Table 3: Member End Actions — Q Vector (Stiffness-Method Convention)</div>
                      <div style={{ fontSize:11, color:CLR.muted, marginTop:4 }}></div>
                    </div>
                    <div style={{ overflowX:"auto" }}>
                      <table style={S.table}>
                        <thead><tr>
                          <th style={S.th}>Member</th><th style={S.th}>End</th>
                          <th style={S.th}>Axial N ({units.force})</th><th style={S.th}>Shear V ({units.force})</th><th style={S.th}>Moment M ({units.force}·{units.length})</th>
                        </tr></thead>
                        <tbody>
                          {members.map((m,i)=>{
                            const e = activeResult.memberEndForces[m.label];
                            if(!e) return null;
                            return (
                              <React.Fragment key={m.id}>
                                <tr style={{ background: i%2===0?"transparent":"#ffffff05" }}>
                                  <td style={{...S.td, fontWeight:700, color:CLR.accent}} rowSpan={2}>{m.label}</td>
                                  <td style={S.td}>Near (1)</td>
                                  <td style={S.td}>{fmt3(toDisp(e.N1,D_.force))}</td>
                                  <td style={S.td}>{fmt3(toDisp(e.V1,D_.force))}</td>
                                  <td style={S.td}>{fmt3(toDisp(e.M1,D_.moment))}</td>
                                </tr>
                                <tr style={{ background: i%2===0?"transparent":"#ffffff05" }}>
                                  <td style={S.td}>Far (2)</td>
                                  <td style={S.td}>{fmt3(toDisp(e.N2,D_.force))}</td>
                                  <td style={S.td}>{fmt3(toDisp(e.V2,D_.force))}</td>
                                  <td style={S.td}>{fmt3(toDisp(e.M2,D_.moment))}</td>
                                </tr>
                              </React.Fragment>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
