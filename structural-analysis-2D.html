function saveWorkingFile(model) {
  const data = JSON.stringify({ version: "1.0", savedAt: new Date().toISOString(), model }, null, 2);
  const stamp = new Date().toISOString().replace(/[:.]/g, "-");
  downloadText(`PlaneFrame_working_${stamp}.json`, data, "application/json");
}

// ── THEORY / DOCUMENTATION TAB ───────────────────────────────────────────
function TheoryTab() {
  const ref = useRef(null);
  useEffect(() => {
    if (window.MathJax && window.MathJax.typesetPromise) {
      window.MathJax.typesetPromise([ref.current]).catch(() => {});
    }
  }, []);
  return (
    <div ref={ref} style={{ ...S.card, lineHeight: 1.7, fontSize: 13 }}>
      <div style={S.h2}>Theoretical Basis & References</div>

      <h3 style={{ color: CLR.accent, marginTop: 16 }}>1. Element Formulation</h3>
      <p>This tool uses the standard 2-node, 6-DOF prismatic Euler-Bernoulli plane frame element (local DOFs: axial and transverse translation plus rotation at each end). The local elastic stiffness matrix is the classical direct-stiffness-method formulation:</p>
      <p>{"$$k' = \\begin{bmatrix} \\frac{EA}{L} & 0 & 0 & -\\frac{EA}{L} & 0 & 0 \\\\ 0 & \\frac{12EI}{L^3} & \\frac{6EI}{L^2} & 0 & -\\frac{12EI}{L^3} & \\frac{6EI}{L^2} \\\\ 0 & \\frac{6EI}{L^2} & \\frac{4EI}{L} & 0 & -\\frac{6EI}{L^2} & \\frac{2EI}{L} \\\\ -\\frac{EA}{L} & 0 & 0 & \\frac{EA}{L} & 0 & 0 \\\\ 0 & -\\frac{12EI}{L^3} & -\\frac{6EI}{L^2} & 0 & \\frac{12EI}{L^3} & -\\frac{6EI}{L^2} \\\\ 0 & \\frac{6EI}{L^2} & \\frac{2EI}{L} & 0 & -\\frac{6EI}{L^2} & \\frac{4EI}{L} \\end{bmatrix}$$"}</p>
      <p style={{ color: CLR.muted, fontSize: 11.5 }}>Reference: McGuire, Gallagher & Ziemian, <i>Matrix Structural Analysis</i>, 2nd ed., Wiley.</p>

      <h3 style={{ color: CLR.accent, marginTop: 16 }}>2. Solution Method</h3>
      <p>{"Global stiffness assembly follows the direct stiffness method: each member's local stiffness is transformed to global coordinates via $K = T^T k' T$ and superposed at shared degrees of freedom. The resulting system is partitioned into free and restrained DOFs and solved as $K_{ff} d_f = P_f$."}</p>
      <p>The linear system is solved using an <b>LDL<sup>T</sup> factorization</b> (never an explicit matrix inverse), which exploits symmetry and provides a built-in mechanism/singularity check: any near-zero pivot during factorization is reported as a structural mechanism rather than silently producing an inaccurate result.</p>

      <h3 style={{ color: CLR.accent, marginTop: 16 }}>3. Member End-Force Sign Convention</h3>
      <p>{"Member end forces are recovered as $q' = k' d' + p'$, where $p'$ is the member's local fixed-end action vector for the applied load pattern."} This convention was calibrated and verified to match a reference spreadsheet benchmark (a classic 480×360 in portal frame under combined lateral and gravity load) to machine precision on all six displacement components and all eighteen member end-force components.</p>
      <p>On the Results diagrams, the bending moment diagram is drawn on the tension side of the member (standard structural engineering convention) — a positive (sagging) moment, which places the member's local -y fiber in tension, is offset toward that fiber; a negative (hogging) moment is offset toward the local +y fiber. This was verified directly against the closed-form midspan moment for a simply-supported beam under uniform load.</p>

      <h3 style={{ color: CLR.accent, marginTop: 16 }}>4. End Releases</h3>
      <p>{"Member end releases (pins) are implemented via static condensation of the released local DOF prior to assembly, then recovered after the global solve via $k_{bb} d_b = -p_b - k_{ba} d_a$, consistent with the $q=k d+p$ convention."}</p>

      <h3 style={{ color: CLR.accent, marginTop: 16 }}>5. Buckling Analysis</h3>
      <p>{"Linear (Euler-type) buckling solves the generalized eigenproblem $(K_e + \\lambda K_g) \\phi = 0$, where $K_g$ is the geometric stiffness matrix assembled from member axial forces obtained from a user-specified reference load case."} {"Verified to match Euler's classical formula $P_{cr} = \\pi^2 EI/(KL)^2$ exactly for pinned-pinned ($K=1$), fixed-free ($K=2$), and fixed-fixed ($K=0.5$) columns."}</p>
      <p style={{ color: CLR.muted, fontSize: 11.5 }}>Reference: Przemieniecki, <i>Theory of Matrix Structural Analysis</i>, Ch. 10; Chen & Lui, <i>Structural Stability: Theory and Implementation</i>.</p>

      <h3 style={{ color: CLR.accent, marginTop: 16 }}>6. Modal Analysis</h3>
      <p>{"Free-vibration analysis solves $K\\phi = \\omega^2 M \\phi$ using a consistent or lumped mass matrix."} Massless DOFs (typical of lumped-mass rotational DOFs) are removed via Guyan (static) condensation prior to the eigensolve — a numerically robust alternative to mass regularization, verified against both an SDOF closed-form solution and Blevins' analytical cantilever-beam frequency formula.</p>
      <p style={{ color: CLR.muted, fontSize: 11.5 }}>Reference: Chopra, <i>Dynamics of Structures</i>, 4th/5th ed., Ch. 13; Guyan, "Reduction of Stiffness and Mass Matrices," <i>AIAA Journal</i>, 1965.</p>

      <h3 style={{ color: CLR.accent, marginTop: 16 }}>7. P-Delta Analysis</h3>
      <p>Second-order effects are captured via iterative secant updates of the geometric stiffness matrix based on current member axial forces, repeated to convergence. Verified against the exact closed-form beam-column solution for a cantilever with combined axial and lateral load.</p>
      <p style={{ color: CLR.muted, fontSize: 11.5 }}>Reference: Timoshenko & Gere, <i>Theory of Elastic Stability</i>; Chen & Lui, Ch. 6.</p>

      <h3 style={{ color: CLR.accent, marginTop: 16 }}>8. Response Spectrum Analysis</h3>
      <p>{"Peak modal responses are computed as $d_n = \\Gamma_n \\frac{S_a(T_n)}{\\omega_n^2}\\phi_n$ and combined via SRSS or CQC (Complete Quadratic Combination, accounting for closely-spaced modes)."}</p>
      <p style={{ color: CLR.muted, fontSize: 11.5 }}>Reference: Der Kiureghian, "A response spectrum method for random vibration analysis of MDF systems," <i>Earthquake Engineering & Structural Dynamics</i>, 1981.</p>

      <h3 style={{ color: CLR.accent, marginTop: 16 }}>9. Moving Loads</h3>
      <p>A load train is stepped across a defined path and a full linear-elastic re-analysis is performed at each position; internal forces at intermediate stations are recovered via exact section-cut equilibrium. Verified against the classical simply-supported-beam result of maximum midspan moment $= PL/4$ for a single moving point load.</p>
      <p style={{ color: CLR.muted, fontSize: 11.5 }}>Reference: Hibbeler, <i>Structural Analysis</i>, Ch. 6.</p>

      <h3 style={{ color: CLR.accent, marginTop: 16 }}>10. Fixed-End Actions via Cubic Hermitian Shape Functions</h3>
      <p>{"Every transverse fixed-end action in this tool — point loads, full uniform loads, and partial/trapezoidal loads — is derived from the SAME work-equivalent nodal load integral, $F_i = \\int w(x) N_i(x)\\,dx$, using the cubic Hermitian shape functions of the underlying Euler-Bernoulli element."} A concentrated point load collapses this integral to $F_i = P \\cdot N_i(a)$ exactly; a concentrated applied moment couples instead to the rotation field, $F_i = \\pm M_0 \\cdot N_i'(a)$; distributed loads are integrated numerically (exact for the polynomial loads this tool supports). All forms were verified to reproduce the classical closed-form FEA tables exactly.</p>

      <h3 style={{ color: CLR.accent, marginTop: 16 }}>11. Springs and Rigid Links</h3>
      <p>Translational (Kx, Ky) and rotational (Kr) nodal springs add directly to the corresponding diagonal terms of the global stiffness matrix. Rigid links are modeled as ordinary frame elements with a very high stiffness (a large multiple of the stiffest real member currently in the model) — the standard structural-analysis approximation to a true rigid-body kinematic constraint — verified to reproduce exact rigid-body rotation kinematics (offset displacement = rotation × arm length) to within the link's finite (but very high) stiffness.</p>

      <h3 style={{ color: CLR.accent, marginTop: 16 }}>12. Member Elastic Buckling Strength</h3>
      <p>{"In addition to the global (structure-level) buckling eigenanalysis, each member's own standalone Euler elastic buckling capacity is reported as $P_{cr} = \\pi^2 EI/(KL)^2$, using its resolved section properties, actual length, and a user-assigned effective-length factor K, compared against its actual axial force under the reference load case."}</p>

      <h3 style={{ color: CLR.accent, marginTop: 16 }}>13. Generic Default Load Cases</h3>
      <p>The tool ships with generic, purpose-built default load cases so every analysis type produces a meaningful result immediately, without requiring the user to first assemble a suitable load combination:</p>
      <ul style={{ paddingLeft: 20, marginTop: 6 }}>
        <li><b>Linear Static Default</b> — the reference lateral + gravity load combination (independently verified to machine precision against the Frames v0.1.xlsx benchmark).</li>
        <li><b>Response Spectrum Default</b> — a generic code-style 3-branch spectrum (Sds = 1.0g, Sd1 = 0.4g) with nodal mass already assigned, so Response Spectrum runs immediately with the default Manual mass source (switch to "From Load Pattern" under Advanced on the Loads tab to derive mass from a gravity load case instead).</li>
        <li><b>P-Delta Default</b> — combines the Linear Static Default lateral load with an additional gravity load case on the columns, giving genuine (if modest) second-order amplification to demonstrate the effect without approaching the structure's buckling capacity.</li>
        <li><b>Vibration Mode Shapes (Modal)</b> — uses the default nodal mass already assigned to the frame; no load case is needed since modal analysis depends only on mass and stiffness.</li>
        <li><b>Buckling Mode Shapes</b> — the Buckling Default load case (gravity load applied directly to the columns) puts them in clean axial compression, giving well-defined positive buckling load factors.</li>
      </ul>
      <p>Switching the Analysis Type on the Analysis tab automatically selects the matching default load case; the load combinations themselves remain fully editable like any other combination.</p>

      <h3 style={{ color: CLR.accent, marginTop: 16 }}>14. Verification Summary</h3>
      <p>The numerical core underlying this tool has passed over 125 automated tests spanning closed-form beam solutions, Euler buckling (3 boundary conditions), SDOF/continuous-beam modal frequencies, exact beam-column P-Delta solutions, classical moving-load influence-line results, Hermitian shape-function fixed-end-action tables, spring and rigid-link kinematics, and machine-precision agreement with an independent spreadsheet benchmark. Analysis results are only as reliable as the model and load inputs provided by the user; engineering judgment and independent checks remain the user's responsibility.</p>
    </div>
  );
}

// ── APP SHELL ────────────────────────────────────────────────────────────
const TABS = [
  { id: "model", label: "Model" },
  { id: "loads", label: "Loads" },
  { id: "analysis", label: "Analysis" },
  { id: "results", label: "Results" },
  { id: "theory", label: "Theory" },
];

function App() {
  const [model, setModel] = useState(defaultModel());
  const [tab, setTab] = useState("model");
  const [results, setResults] = useState(null);
  // Analysis settings are lifted to the App level (rather than living
  // inside AnalysisTab's local useState) so the selected analysis type
  // and all other settings persist when the user navigates away to
  // another tab and back — previously AnalysisTab was unmounted on every
  // tab switch, which reset its useState back to the "static" default.
  const [analysisSettings, setAnalysisSettings] = useState({
    type: "static", comboId: null,
    nModes: 6, massType: "lumped", maxIter: 30, tol: 1e-6,
    combination: "SRSS", dampingRatio: 0.05, direction: "X",
    spectrum: { shape: "constant", Sa: 1 },
    loadTrain: [{ offset: 0, magnitude: 10 }], stepSize: 10,
  });
  const fileInputRef = useRef(null);

  const handleLoadFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const parsed = JSON.parse(evt.target.result);
        if (parsed.model) { setModel(parsed.model); setResults(null); setTab("model"); }
      } catch (err) {
        alert("Could not parse working file: " + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const handlePrintReport = () => window.print();

  return (
    <div style={S.app}>
      <div style={S.header} className="screen-only">
        <div style={S.brand}><span style={S.brandBadge}>PF</span> PlaneFrame v1.0</div>
        <div style={{ display: "flex", gap: 8 }}>
          <button style={S.btn("secondary")} onClick={() => saveWorkingFile(model)}>💾 Save</button>
          <button style={S.btn("secondary")} onClick={() => fileInputRef.current.click()}>📂 Open</button>
          <input ref={fileInputRef} type="file" accept=".json" style={{ display: "none" }} onChange={handleLoadFile} />
          <button style={S.btn("secondary")} onClick={() => downloadText(`results_${Date.now()}.csv`, resultsToCSV(model, results), "text/csv")}>⬇ CSV</button>
          <button style={S.btn("secondary")} onClick={handlePrintReport}>🖨 Print / PDF</button>
        </div>
        <div style={S.nav}>
          {TABS.map(t => <button key={t.id} style={S.navBtn(tab === t.id)} onClick={() => setTab(t.id)}>{t.label}</button>)}
        </div>
      </div>

      <div style={S.main}>
        {tab === "model" && <ModelTab model={model} setModel={setModel} />}
        {tab === "loads" && <LoadsTab model={model} setModel={setModel} />}
        {tab === "analysis" && <AnalysisTab model={model} results={results} setResults={setResults} settings={analysisSettings} setSettings={setAnalysisSettings} />}
        {tab === "results" && <ResultsTab model={model} results={results} />}
        {tab === "theory" && <TheoryTab />}
      </div>

      <div className="print-report-header">
        <h1 style={{ fontSize: 18, marginBottom: 4 }}>PlaneFrame v1.0 — Structural Analysis Report</h1>
        <div style={{ fontSize: 10, color: "#555" }}>Generated {new Date().toLocaleString()}</div>
        <div style={{ marginTop: 16 }}>
          <h2 style={{ fontSize: 13 }}>Model Summary</h2>
          <p>{model.nodes.length} nodes, {model.members.length} members, {model.loadPatterns.length} load pattern(s).</p>
        </div>
        {results && results.data && results.data.status !== "Failed" && (
          <div style={{ marginTop: 16 }}>
            <h2 style={{ fontSize: 13 }}>Analysis Results ({results.type})</h2>
            <ResultsTab model={model} results={results} />
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
  </script>
</body>
</html>
