    // ── DEFAULT DATA ───────────────────────────────────────────────────────────
    const DEFAULT_SUPPORTS = [

    const LOAD_TYPES = ["Dead", "Live", "Snow", "Wind", "Seismic"];
    const LOAD_TYPE_KEYS = { Dead:"D", Live:"L", Snow:"S", Wind:"W", Seismic:"E" };
    const DEFAULT_LOAD_CASES = [
      {
        id: 1,
        name: "LC1",
        type: "Dead",

        }

    ];

    // ── UNIT SETS ─────────────────────────────────────────────────────────────
    const UNIT_SETS = {
      "kips/in": { load:"kips", dist:"in" },
      "kN/m":    { load:"kN",   dist:"m" },
      "kN/mm":   { load:"kN",   dist:"mm" },
      "lb/in":   { load:"lb",   dist:"in" },
      "N/m":     { load:"N",    dist:"m" },
      "kips/ft": { load:"kips", dist:"ft" },
    };

    const DEFAULT_UNITS = "kips/in";

    // ── SOLVER ────────────────────────────────────────────────────────────────
    function solveTruss(supports, joints, members) {
      // Gather all unique nodes (supports + joints)
      const allNodeNames = new Set();
      supports.forEach(s => { if (s.joint.trim()) allNodeNames.add(s.joint.trim()); });
      joints.forEach(j => { if (j.joint.trim()) allNodeNames.add(j.joint.trim()); });
      members.forEach(m => {
        if (m.near.trim()) allNodeNames.add(m.near.trim());
        if (m.far.trim())  allNodeNames.add(m.far.trim());
      });
      const nodeNames = Array.from(allNodeNames).sort();
      const n = nodeNames.length;
      const idx = {}; nodeNames.forEach((nm, i) => { idx[nm] = i; });

      // Coordinate lookup
      const coords = {};
      supports.forEach(s => { if (s.joint.trim()) coords[s.joint.trim()] = { x: +s.x||0, z: +s.z||0 }; });
      joints.forEach(j => { if (j.joint.trim()) coords[j.joint.trim()] = { x: +j.x||0, z: +j.z||0 }; });

      const dof = 2 * n; // x and z dof per node
      // Global stiffness matrix
      const K = Array.from({ length: dof }, () => new Array(dof).fill(0));
      // Force vector
      const F = new Array(dof).fill(0);

      // Member geometry info
      const memInfo = [];
      const activeMems = members.filter(m => m.near.trim() && m.far.trim() && m.near.trim() !== m.far.trim());

      activeMems.forEach(m => {
        const ni = idx[m.near.trim()], fi = idx[m.far.trim()];
        if (ni === undefined || fi === undefined) return;
        const ci = coords[m.near.trim()], cj = coords[m.far.trim()];
        if (!ci || !cj) return;
        const dx = cj.x - ci.x, dz = cj.z - ci.z;
        const L = Math.sqrt(dx*dx + dz*dz);
        if (L < 1e-12) return;
        const cx = dx/L, cz = dz/L;
        const E = +m.E||0, A = +m.A||0;
        const k = E * A / L;
        memInfo.push({ m, ni, fi, cx, cz, L, k, E, A });

        // Assemble stiffness
        const dofs = [2*ni, 2*ni+1, 2*fi, 2*fi+1];
        const kLocal = [cx*cx, cx*cz, -cx*cx, -cx*cz,
                         cx*cz, cz*cz, -cx*cz, -cz*cz,
                        -cx*cx,-cx*cz,  cx*cx,  cx*cz,
                        -cx*cz,-cz*cz,  cx*cz,  cz*cz];
        for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++)
          K[dofs[r]][dofs[c]] += k * kLocal[r*4+c];
      });

      // Applied loads from joints
      joints.forEach(j => {
        if (!j.joint.trim()) return;
        const i = idx[j.joint.trim()];
        if (i === undefined) return;
        const Px = j.Px===null||j.Px===""||j.Px===undefined ? 0 : +j.Px;
        const Pz = j.Pz===null||j.Pz===""||j.Pz===undefined ? 0 : +j.Pz;
        F[2*i]   += Px;
        F[2*i+1] += Pz;
      });

      // Translational spring supports are added directly to the global stiffness matrix.
      // kx and kz are entered as force per displacement unit (for example kips/in or kN/m).
      // A support row can therefore be used as a conventional restraint, an elastic spring,
      // or both. Set Type = Free with nonzero kx/kz for a pure elastic support.
      supports.forEach(s => {
        if (!s.joint.trim()) return;
        const i = idx[s.joint.trim()];
        if (i === undefined) return;
        const kx = Math.max(0, +s.kx || 0);
        const kz = Math.max(0, +s.kz || 0);
        K[2*i][2*i] += kx;
        K[2*i+1][2*i+1] += kz;
      });

      // Determine constrained DOFs from supports
      const constrained = new Set();
      supports.forEach(s => {
        if (!s.joint.trim()) return;
        const i = idx[s.joint.trim()];
        if (i === undefined) return;
        const t = s.type;
        if (t === "Pinned") { constrained.add(2*i); constrained.add(2*i+1); }
        else if (t === "Roller-X") { constrained.add(2*i+1); } // free in x, fixed in z
        else if (t === "Roller-Z") { constrained.add(2*i); }   // fixed in x, free in z
        else if (t === "Fixed") { constrained.add(2*i); constrained.add(2*i+1); }
      });

      // Determine stability: b + r >= 2j
      const b = activeMems.length;
      const r = constrained.size;
      const j2 = 2 * n;
      let stability = "";
      if (b + r < j2) stability = "Unstable";
      else if (b + r === j2) stability = "Stable and Determinate";
      else stability = "Stable and Indeterminate";

      // Check for duplicate members
      const memPairs = new Set();
      let hasDuplicate = false;
      activeMems.forEach(m => {
        const key = [m.near.trim(), m.far.trim()].sort().join("-");
        if (memPairs.has(key)) hasDuplicate = true;
        memPairs.add(key);
      });

      // Check for duplicate nodes
      const nodeSet = new Set(); let hasDupNode = false;
      [...supports, ...joints].forEach(n => {
        const k = `${+n.x||0},${+n.z||0}`;
        if (nodeSet.has(k)) hasDupNode = true;
        nodeSet.add(k);
      });

      // Solve: Apply BCs by penalty method (large K on constrained DOFs)
      const Km = K.map(r => [...r]);
      const Fm = [...F];
      const BIG = 1e20;
      constrained.forEach(d => { Km[d][d] += BIG; /* Fm[d] remains 0 */ });

      // Gaussian elimination
      const D = gaussianElim(Km, Fm);
      if (!D) return { error: "Singular stiffness matrix — check for mechanisms or disconnected nodes.", stability, b, r, j: n, hasDuplicate, hasDupNode };

      // Member forces
      const results = memInfo.map(({ m, ni, fi, cx, cz, L, k, E, A }) => {
        const u1 = D[2*ni], v1 = D[2*ni+1], u2 = D[2*fi], v2 = D[2*fi+1];
        const deltaL = cx*(u2-u1) + cz*(v2-v1);
        const force = E * A / L * deltaL;
        return { name: m.name||`${m.near}-${m.far}`, force, L, near: m.near.trim(), far: m.far.trim() };
      });

      // Reaction forces
      // Conventional support reactions come from restrained DOFs. Spring reactions are k·δ,
      // matching the sign convention used by Frames v0.6.6 for spring support recovery.
      const reactions = [];
      supports.forEach(s => {
        if (!s.joint.trim()) return;
        const i = idx[s.joint.trim()];
        if (i === undefined) return;
        const kx = Math.max(0, +s.kx || 0);
        const kz = Math.max(0, +s.kz || 0);
        const supportRx = constrained.has(2*i) ? (BIG * D[2*i]) : 0;
        const supportRz = constrained.has(2*i+1) ? (BIG * D[2*i+1]) : 0;
        const springRx = kx * (D[2*i] || 0);
        const springRz = kz * (D[2*i+1] || 0);
        const hasSpring = kx > 1e-12 || kz > 1e-12;
        const supportLabel = s.type !== "Free" && hasSpring ? `${s.type} + Spring` : (hasSpring ? "Spring" : s.type);
        reactions.push({ joint: s.joint.trim(), type:s.type, supportLabel, kx, kz, hasSpring,
          Rx: supportRx + springRx, Rz: supportRz + springRz, springRx, springRz });
      });

      // Node displacements (only free)
      const displacements = nodeNames.map((nm, i) => ({
        joint: nm,
        x: constrained.has(2*i) ? 0 : D[2*i],
        z: constrained.has(2*i+1) ? 0 : D[2*i+1],
        coords: coords[nm]||{x:0,z:0},
      }));

      return { results, reactions, displacements, stability, b, r, j: n, hasDuplicate, hasDupNode };
    }

    function gaussianElim(A, b) {
      const n = b.length;
      const M = A.map((r, i) => [...r, b[i]]);
      for (let col = 0; col < n; col++) {
        let maxRow = col;
        for (let row = col+1; row < n; row++)
          if (Math.abs(M[row][col]) > Math.abs(M[maxRow][col])) maxRow = row;
        [M[col], M[maxRow]] = [M[maxRow], M[col]];
        if (Math.abs(M[col][col]) < 1e-14) return null;
        for (let row = col+1; row < n; row++) {
          const f = M[row][col] / M[col][col];
          for (let k = col; k <= n; k++) M[row][k] -= f * M[col][k];
        }
      }
      const x = new Array(n).fill(0);
      for (let i = n-1; i >= 0; i--) {
        x[i] = M[i][n];
        for (let j = i+1; j < n; j++) x[i] -= M[i][j] * x[j];
        x[i] /= M[i][i];
      }
      return x;
    }
    function jointLoadsFor(loadCase, joint) {
      const loads = (loadCase && loadCase.jointLoads && loadCase.jointLoads[joint]) || {};
      return {
        Px: loads.Px === null || loads.Px === "" || loads.Px === undefined ? 0 : +loads.Px,
        Pz: loads.Pz === null || loads.Pz === "" || loads.Pz === undefined ? 0 : +loads.Pz,
      };
    }

    function applyJointLoads(joints, jointLoads) {
      return joints.map(j => {
        const key = (j.joint || "").trim();
        const L = (jointLoads && jointLoads[key]) || {};
        return {
          ...j,
          Px: L.Px === null || L.Px === "" || L.Px === undefined ? 0 : +L.Px,
          Pz: L.Pz === null || L.Pz === "" || L.Pz === undefined ? 0 : +L.Pz,
        };
      });
    }

    function buildComboJointLoads(joints, loadCases, combo) {
      const combined = {};
      joints.forEach(j => {
        const key = (j.joint || "").trim();
        if (key) combined[key] = { Px:0, Pz:0 };
      });
      loadCases.forEach(lc => {
        const typeKey = LOAD_TYPE_KEYS[lc.type] || lc.type;
        const factor = +(combo.factors && combo.factors[typeKey] || 0);
        if (Math.abs(factor) < 1e-12) return;
        Object.keys(combined).forEach(joint => {
          const L = jointLoadsFor(lc, joint);
          combined[joint].Px += factor * L.Px;
          combined[joint].Pz += factor * L.Pz;
        });
      });
      return combined;
    }

    function runLoadCaseAnalysis(supports, joints, members, loadCase) {
      return solveTruss(supports, applyJointLoads(joints, loadCase.jointLoads || {}), members);
    }

    function runCombinationAnalysis(supports, joints, members, loadCases, combo) {
      const comboLoads = buildComboJointLoads(joints, loadCases, combo);
      return solveTruss(supports, applyJointLoads(joints, comboLoads), members);
    }

    const fmtSci = v => typeof v === "number" ? v.toExponential(3) : v;

const VERSION = "v0.4.0";
const APP_NAME = "Trusses";

const num = v => (v === null || v === undefined || v === "" ? 0 : +v || 0);
const fnum = (v, dp = 3) => (typeof v !== "number" || Number.isNaN(v)) ? "—" : (Math.abs(v) < 5 * Math.pow(10, -dp - 1) ? (0).toFixed(dp) : v.toFixed(dp));
const clean = v => (Math.abs(v) < 1e-9 ? 0 : v); // hides -0 / round-off in the print of reactions

function downloadText(filename, text, mime) {
  const blob = new Blob([text], { type: mime || "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ── SAVE WORKING FILE (same JSON mechanism as the sample tool) ──────────
function saveWorkingFile(model) {
  const data = JSON.stringify({ version: "1.0", app: APP_NAME, savedAt: new Date().toISOString(), model }, null, 2);
  const stamp = new Date().toISOString().replace(/[:.]/g, "-");
  downloadText(`Trusses_working_${stamp}.json`, data, "application/json");
}

// ── Numbered display equation (MathJax) + variable definitions ──────────
function Eq({ n, tex, where }) {

// ── Legend row under every graphic (shared component) ───────────────────

// ── Support glyph: triangle (green 35%) + accent rim + hatching ─────────
function SupportGlyph({ s, x, y }) {
  const t = s.type, kx = Math.max(0, +s.kx || 0), kz = Math.max(0, +s.kz || 0);
  const hatch = (x0, x1, yy) => Array.from({ length: 6 }, (_, i) => {
    const hx = x0 + (x1 - x0) * i / 5;
    return <line key={i} x1={hx} y1={yy} x2={hx - 5} y2={yy + 6} stroke={CLR.accent} strokeWidth={1} />;
  });
  const g = [];
  if (t === "Pinned" || t === "Roller-X" || t === "Roller-Z") {
    g.push(<polygon key="tri" points={`${x},${y} ${x - 11},${y + 17} ${x + 11},${y + 17}`} fill={CLR.green} fillOpacity={0.35} stroke={CLR.accent} strokeWidth={1.5} />);
    if (t === "Pinned") { g.push(<line key="gl" x1={x - 15} y1={y + 17} x2={x + 15} y2={y + 17} stroke={CLR.accent} strokeWidth={1.5} />, ...hatch(x - 12, x + 15, y + 17)); }
    else { g.push(<circle key="r1" cx={x - 5} cy={y + 20} r={3} fill={CLR.green} stroke={CLR.accent} strokeWidth={1} />, <circle key="r2" cx={x + 5} cy={y + 20} r={3} fill={CLR.green} stroke={CLR.accent} strokeWidth={1} />, <line key="gl" x1={x - 15} y1={y + 23} x2={x + 15} y2={y + 23} stroke={CLR.accent} strokeWidth={1.5} />, ...hatch(x - 12, x + 15, y + 23)); }
  } else if (t === "Fixed") {
    g.push(<rect key="fx" x={x - 14} y={y + 5} width={28} height={7} fill={CLR.green} fillOpacity={0.35} stroke={CLR.accent} strokeWidth={1.5} />, ...hatch(x - 12, x + 15, y + 12));
  }
  const zig = pts => pts.map(p => p.join(",")).join(" ");
  if (kx > 1e-12) g.push(<g key="kx"><polyline points={zig([[x + 7, y], [x + 12, y], [x + 16, y - 4], [x + 20, y + 4], [x + 24, y - 4], [x + 28, y + 4], [x + 32, y]])} fill="none" stroke={CLR.yellow} strokeWidth={1.5} strokeLinejoin="round" /><line x1={x + 33} y1={y - 8} x2={x + 33} y2={y + 8} stroke={CLR.yellow} strokeWidth={1.5} /><text x={x + 22} y={y - 10} fill={CLR.yellow} fontSize={9} textAnchor="middle">kx</text><title>{`Horizontal spring kx = ${kx}`}</title></g>);
  if (kz > 1e-12) g.push(<g key="kz"><polyline points={zig([[x, y - 7], [x, y - 12], [x - 4, y - 16], [x + 4, y - 20], [x - 4, y - 24], [x + 4, y - 28], [x, y - 32]])} fill="none" stroke={CLR.yellow} strokeWidth={1.5} strokeLinejoin="round" /><line x1={x - 8} y1={y - 33} x2={x + 8} y2={y - 33} stroke={CLR.yellow} strokeWidth={1.5} /><text x={x + 11} y={y - 26} fill={CLR.yellow} fontSize={9}>kz</text><title>{`Vertical spring kz = ${kz}`}</title></g>);
  return <g><title>{`Support ${s.joint}: ${t}`}</title>{g}</g>;
}

// ── Truss graphic. mode: "model" | "axial" | "deformed" ─────────────────
// One component draws all three figures so every graphic shares one style (SVG_BOX).
function TrussFigure({ supports, joints, members, result, mode, defScale, u }) {
  const W = 680, H = 340, PAD = 64;
  const nodes = {};
  supports.forEach(s => { const k = s.joint.trim(); if (k) nodes[k] = { x: num(s.x), z: num(s.z) }; });
  joints.forEach(j => { const k = j.joint.trim(); if (k) nodes[k] = { x: num(j.x), z: num(j.z) }; });
  const names = Object.keys(nodes);
  if (!names.length) return <div style={{ color: CLR.muted, padding: "2rem", textAlign: "center" }}>No nodes to display.</div>;
  const xs = names.map(k => nodes[k].x), zs = names.map(k => nodes[k].z);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minZ = Math.min(...zs), maxZ = Math.max(...zs);
  const sc = Math.min((W - 2 * PAD) / (maxX - minX || 1), (H - 2 * PAD) / (maxZ - minZ || 1));
  const ox = (W - sc * (maxX - minX)) / 2, oy = (H + sc * (maxZ - minZ)) / 2;
  const P = (x, z) => ({ sx: ox + (x - minX) * sc, sy: oy - (z - minZ) * sc });
  const mem = members.filter(m => m.near.trim() && m.far.trim() && nodes[m.near.trim()] && nodes[m.far.trim()] && m.near.trim() !== m.far.trim());
  const forceOf = {}; if (result && result.results) result.results.forEach(r => { forceOf[r.name] = r.force; });
  const disp = {}; if (result && result.displacements) result.displacements.forEach(d => { disp[d.joint] = d; });
  const maxN = Math.max(1e-9, ...Object.values(forceOf).map(Math.abs));
  const uniq = a => [...new Set(a.map(v => +v.toFixed(6)))].sort((p, q) => p - q);
  const tx = uniq(xs), tz = uniq(zs);
  const arrow = (key, x, y, dx, dy, label, col, lcol) => {
    const L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, ex = x + dx, ey = y + dy;
    return <g key={key}>
      <line x1={x} y1={y} x2={ex - ux * 6} y2={ey - uy * 6} stroke={col} strokeWidth={2} />
      <polygon points={`${ex},${ey} ${ex - ux * 8 - uy * 4},${ey - uy * 8 + ux * 4} ${ex - ux * 8 + uy * 4},${ey - uy * 8 - ux * 4}`} fill={col} />
      <text x={x + dx * 1.35 + (dy !== 0 ? 10 : 0)} y={y + dy * 1.35 + (dy !== 0 ? 3 : -6)} fill={lcol} fontSize={10} textAnchor="middle">{label}</text>
    </g>;
  };

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} style={SVG_BOX}>
      {/* axis ticks + titles (coordinate labels) */}
      {tx.map(v => { const p = P(v, minZ); return <g key={"tx" + v}><line x1={p.sx} y1={H - 30} x2={p.sx} y2={H - 25} stroke={CLR.border2} /><text x={p.sx} y={H - 14} fill={CLR.muted} fontSize={10} textAnchor="middle">{v}</text></g>; })}
      {tz.map(v => { const p = P(minX, v); return <g key={"tz" + v}><line x1={30} y1={p.sy} x2={35} y2={p.sy} stroke={CLR.border2} /><text x={26} y={p.sy + 3} fill={CLR.muted} fontSize={10} textAnchor="end">{v}</text></g>; })}
      <text x={W / 2} y={H - 2} fill={CLR.muted} fontSize={10} textAnchor="middle">x [{u.dist}]</text>
      <text x={9} y={H / 2} fill={CLR.muted} fontSize={10} textAnchor="middle" transform={`rotate(-90 9 ${H / 2})`}>z [{u.dist}]</text>

      {/* members */}
      {mem.map((m, i) => {
        const a = nodes[m.near.trim()], b = nodes[m.far.trim()];
        const p1 = P(a.x, a.z), p2 = P(b.x, b.z), nm = m.name || `${m.near}-${m.far}`;
        const L = Math.hypot(b.x - a.x, b.z - a.z);
        if (mode === "deformed") {
          const d1 = disp[m.near.trim()] || { x: 0, z: 0 }, d2 = disp[m.far.trim()] || { x: 0, z: 0 };
          const q1 = P(a.x + (d1.x || 0) * defScale, a.z + (d1.z || 0) * defScale), q2 = P(b.x + (d2.x || 0) * defScale, b.z + (d2.z || 0) * defScale);
          return <g key={i}><title>{`Member ${nm}: L = ${fnum(L, 3)} ${u.dist}`}</title>
            <line x1={p1.sx} y1={p1.sy} x2={p2.sx} y2={p2.sy} stroke={CLR.border2} strokeWidth={2} strokeDasharray="6,4" />
            <line x1={q1.sx} y1={q1.sy} x2={q2.sx} y2={q2.sy} stroke={CLR.accent} strokeWidth={3.5} strokeLinecap="round" /></g>;
        }
        const dx = p2.sx - p1.sx, dy = p2.sy - p1.sy, pl = Math.hypot(dx, dy) || 1, nx = -dy / pl, ny = dx / pl;
        let band = null;
        if (mode === "axial" && forceOf[nm] !== undefined) {
          const N = forceOf[nm], d = (Math.abs(N) / maxN) * 30 * Math.sign(N || 1), mx = (p1.sx + p2.sx) / 2 + nx * (d + Math.sign(d || 1) * 12), my = (p1.sy + p2.sy) / 2 + ny * (d + Math.sign(d || 1) * 12);
          const fc = N > 0 ? CLR.red : CLR.yellow; // tension = rose, compression = amber
          band = <g>
            {Math.abs(N) > 1e-6 && <polygon points={`${p1.sx},${p1.sy} ${p2.sx},${p2.sy} ${p2.sx + nx * d},${p2.sy + ny * d} ${p1.sx + nx * d},${p1.sy + ny * d}`} fill={fc + "26"} stroke={fc} strokeWidth={1.7} />}
            {Math.abs(N) > 1e-6 && [0.25, 0.5, 0.75].map(t => <line key={t} x1={p1.sx + dx * t} y1={p1.sy + dy * t} x2={p1.sx + dx * t + nx * d} y2={p1.sy + dy * t + ny * d} stroke={fc} strokeWidth={1} strokeOpacity={0.72} />)}
            <text x={mx} y={my + 3} fill={Math.abs(N) > 1e-6 ? fc : CLR.muted} fontSize={9.5} fontWeight="700" textAnchor="middle">{Math.abs(N) > 1e-6 ? `${fnum(Math.abs(N), 2)} ${N > 0 ? "(T)" : "(C)"}` : "0"}</text>
          </g>;
        }
        return <g key={i}><title>{`Member ${nm}: ${m.near}–${m.far}, L = ${fnum(L, 3)} ${u.dist}, EA = ${num(m.E) * num(m.A)}`}</title>
          {band}
          <line x1={p1.sx} y1={p1.sy} x2={p2.sx} y2={p2.sy} stroke={CLR.accent} strokeWidth={mode === "axial" ? 3 : 3.5} strokeLinecap="round" />
          {mode === "model" && <text x={(p1.sx + p2.sx) / 2 + nx * 10} y={(p1.sy + p2.sy) / 2 + ny * 10 + 3} fill={CLR.muted} fontSize={10} textAnchor="middle">{nm}</text>}
        </g>;
      })}

      {/* supports */}
      {supports.map((s, i) => { const nd = nodes[s.joint.trim()]; if (!nd) return null; const p = P(nd.x, nd.z); return <SupportGlyph key={"s" + i} s={s} x={p.sx} y={p.sy} />; })}

      {/* nodes */}
      {names.map(k => { const p = P(nodes[k].x, nodes[k].z), isS = supports.some(s => s.joint.trim() === k); return (
        <g key={k}><title>{`Joint ${k}: x = ${nodes[k].x}, z = ${nodes[k].z}`}</title>
          <circle cx={p.sx} cy={p.sy} r={isS ? 5.5 : 5} fill={CLR.green} stroke={CLR.accent} strokeWidth={1.5} />
          <text x={p.sx + 9} y={p.sy - 8} fill={CLR.text} fontSize={11} fontWeight="700">{k}</text>
        </g>); })}

      {/* applied loads (model figure only) */}
      {mode === "model" && joints.map((j, i) => {
        const nd = nodes[j.joint.trim()]; if (!nd) return null; const p = P(nd.x, nd.z), Px = num(j.Px), Pz = num(j.Pz), out = [];
        if (Math.abs(Px) > 1e-10) out.push(arrow("x" + i, p.sx - Math.sign(Px) * 44, p.sy, Math.sign(Px) * 36, 0, `Px = ${Px}`, CLR.red, CLR.redSoft));
        if (Math.abs(Pz) > 1e-10) out.push(arrow("z" + i, p.sx, p.sy + Math.sign(Pz) * 44, 0, -Math.sign(Pz) * 36, `Pz = ${Pz}`, CLR.red, CLR.redSoft));
        return <g key={"L" + i}><title>{`Load at ${j.joint}: Px = ${Px}, Pz = ${Pz} ${u.load}`}</title>{out}</g>;
      })}
    </svg>
  );
}

// Quick model counts for the live caption (display only; the solver recomputes its own)
function modelStats(supports, joints, members, loadCase) {
  const names = new Set();
  supports.forEach(s => s.joint.trim() && names.add(s.joint.trim()));
  joints.forEach(j => j.joint.trim() && names.add(j.joint.trim()));
  members.forEach(m => { m.near.trim() && names.add(m.near.trim()); m.far.trim() && names.add(m.far.trim()); });
  const b = members.filter(m => m.near.trim() && m.far.trim() && m.near.trim() !== m.far.trim()).length;
  const r = supports.reduce((a, s) => a + (s.type === "Pinned" || s.type === "Fixed" ? 2 : s.type === "Roller-X" || s.type === "Roller-Z" ? 1 : 0), 0);
  const j = names.size;
  let sumP = 0; joints.forEach(jt => { const L = jointLoadsFor(loadCase, jt.joint.trim()); sumP += Math.hypot(L.Px, L.Pz); });
  return { b, r, j, sumP, status: b + r < 2 * j ? "Unstable" : b + r === 2 * j ? "Stable and Determinate" : "Stable and Indeterminate" };
}

// ── INPUTS TAB ───────────────────────────────────────────────────────────
const nextId = arr => Math.max(0, ...arr.map(r => r.id || 0)) + 1;
const CardHead = ({ title, onAdd, children }) => (
  <div style={S.h2}><span>{title}</span><span style={{ display: "flex", gap: 8, alignItems: "center", textTransform: "none", letterSpacing: 0 }}>{children}{onAdd && <button style={{ ...S.btn("secondary"), padding: "3px 12px", fontSize: 11 }} onClick={onAdd}>+ Add</button>}</span></div>
);
const DelBtn = ({ onClick }) => <button style={{ ...S.btn("danger"), padding: "3px 9px", fontSize: 10 }} onClick={onClick} title="Delete row">✕</button>;
const Cell = ({ children }) => <td style={S.td}>{children}</td>;

function InputsView({ M, setM, onCalculate, activeLC, u }) {
  const { supports, joints, members, loadCases, units } = M;
  const upd = (key, id, field, val) => setM(m => ({ ...m, [key]: m[key].map(r => r.id === id ? { ...r, [field]: val } : r) }));
  const del = (key, id) => setM(m => ({ ...m, [key]: m[key].filter(r => r.id !== id) }));
  const add = (key, row) => setM(m => ({ ...m, [key]: [...m[key], { id: nextId(m[key]), ...row }] }));
  const setActive = id => setM(m => ({ ...m, activeLoadCaseId: id }));
  const addLC = () => setM(m => { const id = nextId(m.loadCases); return { ...m, loadCases: [...m.loadCases, { id, name: `LC${id}`, type: "Dead", jointLoads: {} }], activeLoadCaseId: id }; });
  const delLC = id => setM(m => m.loadCases.length > 1 ? { ...m, loadCases: m.loadCases.filter(l => l.id !== id), activeLoadCaseId: m.activeLoadCaseId === id ? m.loadCases.find(l => l.id !== id).id : m.activeLoadCaseId } : m);
  const setJointLoad = (joint, field, val) => setM(m => ({ ...m, loadCases: m.loadCases.map(lc => lc.id !== m.activeLoadCaseId ? lc : { ...lc, jointLoads: { ...(lc.jointLoads || {}), [joint]: { ...jointLoadsFor(lc, joint), [field]: val === "" ? "" : +val } } }) }));
  const st = modelStats(supports, joints, members, activeLC);
  const loaded = applyJointLoads(joints, activeLC.jointLoads || {});
  const inp = (val, onChange, extra = {}) => <input style={S.input} value={val} onChange={e => onChange(e.target.value)} {...extra} />;
  const numIn = (val, onChange, extra = {}) => inp(val, onChange, { type: "number", step: "any", ...extra });

  return (
    <div>
      <div className="screen-only" style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: "1.25rem", flexWrap: "wrap" }}>
        <div>
          <div style={{ fontSize: 22, fontWeight: 700, letterSpacing: "-0.02em" }}>Truss Inputs</div>
          <div style={S.smallMuted}>Define supports, joints (loaded or not) and members. x = horizontal, z = vertical (up).</div>
        </div>
        <div style={{ marginLeft: "auto", display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          <span style={S.smallMuted}>Units</span>
          <select style={{ ...S.select, width: "auto" }} value={units} onChange={e => setM(m => ({ ...m, units: e.target.value }))}>{Object.keys(UNIT_SETS).map(k => <option key={k}>{k}</option>)}</select>
          <button style={S.btn("secondary")} onClick={() => setM(defaultModel())}>↺ Reset Example</button>
          <button style={S.btn("primary")} onClick={onCalculate}>▶ Analyze</button>
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1.3fr) minmax(0,1fr)", gap: "1.25rem", alignItems: "start" }}>
        <div>
          <div style={S.card}>
            <CardHead title="Load Cases" onAdd={addLC} />
            <table style={S.table}><thead><tr><th style={S.th}>Active</th><th style={S.th}>Case</th><th style={S.th}>Load Type</th><th style={S.th}>—</th></tr></thead>
              <tbody>{loadCases.map(lc => <tr key={lc.id}>
                <Cell><input type="radio" checked={M.activeLoadCaseId === lc.id} onChange={() => setActive(lc.id)} /></Cell>
                <Cell>{inp(lc.name, v => upd("loadCases", lc.id, "name", v))}</Cell>
                <Cell><select style={S.select} value={lc.type} onChange={e => upd("loadCases", lc.id, "type", e.target.value)}>{LOAD_TYPES.map(t => <option key={t}>{t}</option>)}</select></Cell>
                <Cell><DelBtn onClick={() => delLC(lc.id)} /></Cell></tr>)}</tbody></table>
            <div style={{ ...S.smallMuted, marginTop: 8 }}>Joint loads in the Joints card belong to the active case.</div>
          </div>

          <div style={S.card}>
            <CardHead title="Supports" onAdd={() => add("supports", { joint: "", x: "", z: "", type: "Pinned", kx: 0, kz: 0 })} />
            <div style={{ overflowX: "auto" }}><table style={S.table}><thead><tr><th style={S.th}>Joint</th><th style={S.th}>x [{u.dist}]</th><th style={S.th}>z [{u.dist}]</th><th style={S.th}>Type</th><th style={S.th}>kx [{u.load}/{u.dist}]</th><th style={S.th}>kz [{u.load}/{u.dist}]</th><th style={S.th}>—</th></tr></thead>
              <tbody>{supports.map(s => <tr key={s.id}>
                <Cell>{inp(s.joint, v => upd("supports", s.id, "joint", v))}</Cell>
                <Cell>{numIn(s.x, v => upd("supports", s.id, "x", v))}</Cell>
                <Cell>{numIn(s.z, v => upd("supports", s.id, "z", v))}</Cell>
                <Cell><select style={S.select} value={s.type} onChange={e => upd("supports", s.id, "type", e.target.value)}>{["Pinned", "Roller-X", "Roller-Z", "Fixed", "Free"].map(t => <option key={t}>{t}</option>)}</select></Cell>
                <Cell>{numIn(s.kx || 0, v => upd("supports", s.id, "kx", v), { min: 0 })}</Cell>
                <Cell>{numIn(s.kz || 0, v => upd("supports", s.id, "kz", v), { min: 0 })}</Cell>
                <Cell><DelBtn onClick={() => del("supports", s.id)} /></Cell></tr>)}</tbody></table></div>
          </div>

          <div style={S.card}>
            <CardHead title="Joints (Free Nodes)" onAdd={() => add("joints", { joint: "", x: "", z: "", Px: null, Pz: null })}>
              <span style={S.smallMuted}>Loads for <b style={{ color: CLR.yellow }}>{activeLC.name}</b> ({activeLC.type})</span></CardHead>
            <div style={{ overflowX: "auto" }}><table style={S.table}><thead><tr><th style={S.th}>Joint</th><th style={S.th}>x [{u.dist}]</th><th style={S.th}>z [{u.dist}]</th><th style={S.th}>Px [{u.load}]</th><th style={S.th}>Pz [{u.load}]</th><th style={S.th}>—</th></tr></thead>
              <tbody>{joints.map(j => { const L = jointLoadsFor(activeLC, j.joint.trim()); return <tr key={j.id}>
                <Cell>{inp(j.joint, v => upd("joints", j.id, "joint", v))}</Cell>
                <Cell>{numIn(j.x, v => upd("joints", j.id, "x", v))}</Cell>
                <Cell>{numIn(j.z, v => upd("joints", j.id, "z", v))}</Cell>
                <Cell>{numIn(L.Px || "", v => setJointLoad(j.joint.trim(), "Px", v), { placeholder: "0" })}</Cell>
                <Cell>{numIn(L.Pz || "", v => setJointLoad(j.joint.trim(), "Pz", v), { placeholder: "0" })}</Cell>
                <Cell><DelBtn onClick={() => del("joints", j.id)} /></Cell></tr>; })}</tbody></table></div>
          </div>

          <div style={S.card}>
            <CardHead title="Members" onAdd={() => add("members", { near: "", far: "", name: "", E: 4176000, A: 1 })} />

              <tbody>{members.map(m => <tr key={m.id}>

            <div style={{ ...S.smallMuted, marginTop: 8, textAlign: "center", fontFamily: MONO }}>
              b = {st.b} · r = {st.r} · j = {st.j} · b + r = {st.r + st.b} vs 2j = {2 * st.j} · {st.status} · Σ|P| = {fnum(st.sumP, 2)} {u.load}
            </div>

          <div style={S.card}>

              {[["Load (Px, Pz), axial force", u.load], ["Distance (x, z, L)", u.dist], ["Modulus E", `${u.load}/${u.dist}²`], ["Area A", `${u.dist}²`], ["Spring k", `${u.load}/${u.dist}`], ["Sign convention", "+x right · +z up · tension +"]].map(([a, b]) => <tr key={a}><td style={{ ...S.td, textAlign: "left" }}>{a}</td><td style={{ ...S.td, color: CLR.accentSoft }}>{b}</td></tr>)}

    </div>
  );
}

// Static-equilibrium residuals (ADDED CHECK, not in the v0.3.3 source — see Theory, Equation 8).
function equilibriumCheck(result, loadedJoints) {
  const at = {}; result.displacements.forEach(d => { at[d.joint] = d.coords; });
  let Px = 0, Pz = 0, Mp = 0, Rx = 0, Rz = 0, Mr = 0, mag = 0;
  loadedJoints.forEach(j => { const c = at[j.joint.trim()] || { x: 0, z: 0 }, fx = num(j.Px), fz = num(j.Pz); Px += fx; Pz += fz; Mp += c.x * fz - c.z * fx; mag += Math.hypot(fx, fz); });
  result.reactions.forEach(r => { const c = at[r.joint] || { x: 0, z: 0 }; Rx += r.Rx; Rz += r.Rz; Mr += c.x * r.Rz - c.z * r.Rx; });
  const span = Math.max(1, ...Object.values(at).map(c => Math.max(Math.abs(c.x), Math.abs(c.z))));
  const tol = 1e-6 * Math.max(1, mag);
  const rows = [["ΣFx", Px, Rx, Px - Rx, tol], ["ΣFz", Pz, Rz, Pz - Rz, tol], ["ΣM about origin", Mp, Mr, Mp - Mr, tol * span]];
  return { rows, ok: rows.every(r => Math.abs(r[3]) <= r[4]) };
}

  if (result.error) return <div style={{ ...S.card, border: `1px solid ${CLR.red}66` }}><div style={{ fontWeight: 700, color: CLR.red, marginBottom: 8 }}>Solver error</div><div style={{ color: CLR.muted, fontSize: 13 }}>{result.error}</div><div style={{ marginTop: 10, fontSize: 12, color: CLR.muted, fontFamily: MONO }}>b = {result.b} · r = {result.r} · j = {result.j} · b + r = {result.b + result.r} vs 2j = {2 * result.j} · {result.stability}</div></div>;
  const { results, reactions, displacements, stability, b, r, j, hasDuplicate, hasDupNode } = result;
  const stable = !stability.includes("Unstable");
  const eq = equilibriumCheck(result, joints);
  const Stat = ({ label, children }) => <div><div style={{ ...S.smallMuted, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 6 }}>{label}</div>{children}</div>;
  const big = c => ({ fontSize: 26, fontWeight: 700, color: c, fontFamily: MONO, lineHeight: 1 });
  const Table = ({ title, cap, head, rows }) => (
    <div className="print-avoid" style={S.card}>

      <div style={{ overflowX: "auto" }}><table style={S.table}><thead><tr>{head.map((h, i) => <th key={i} style={S.th}>{h}</th>)}</tr></thead><tbody>{rows}</tbody></table></div>

  return (
    <div>

      <div className="print-avoid" style={{ ...S.card, display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(150px,1fr))", gap: "1.25rem" }}>
        <Stat label="Overall status"><span style={S.badge(stable ? CLR.green : CLR.red)}>{stable ? "STABLE" : "UNSTABLE"}</span><div style={{ ...S.smallMuted, marginTop: 6 }}>{stability}</div></Stat>
        <Stat label="Members (b)"><div style={big(CLR.accent)}>{b}</div></Stat>
        <Stat label="Reactions (r)"><div style={big(CLR.green)}>{r}</div></Stat>
        <Stat label="Joints (j)"><div style={big(CLR.accentSoft)}>{j}</div></Stat>
        <Stat label="b + r vs 2j"><div style={{ ...big(CLR.yellow), fontSize: 18 }}>{b + r} vs {2 * j}</div></Stat>
        <Stat label="Equilibrium (Eq. 8)"><span style={S.badge(eq.ok ? CLR.green : CLR.red)}>{eq.ok ? "PASSED" : "FAILED"}</span></Stat>
      </div>

      {(hasDuplicate || hasDupNode) && <div className="print-avoid" style={{ ...S.card, border: `1px solid ${CLR.yellow}55` }}>
        <div style={{ fontWeight: 700, color: CLR.yellow, marginBottom: 6, fontSize: 13 }}>Warnings</div>
        {hasDuplicate && <div style={{ fontSize: 12, color: CLR.muted }}>• Duplicate member (same near–far pair) detected.</div>}
        {hasDupNode && <div style={{ fontSize: 12, color: CLR.muted }}>• Duplicate node coordinates detected.</div>}</div>}

      <div className="print-avoid" style={S.card}>
        <div style={S.h2}><span>Figure 2: Member Axial Force Diagram</span><span style={{ ...S.smallMuted, textTransform: "none", letterSpacing: 0 }}>Equation 5</span></div>
        <TrussFigure supports={supports} joints={joints} members={members} result={result} mode="axial" u={u} />
        <DiagramLegend items={[[CLR.accent, "━ Member"], [CLR.green, "● Joint / support"], [CLR.red, "▮ Tension (T)"], [CLR.yellow, "▮ Compression (C)"]]} note={`Band width ∝ |N|, labels in ${u.load}`} />

      <div className="print-avoid" style={S.card}>

        <Table title="Table 2: Support Reactions" cap="Equation 6" head={["Joint", "Type", `Rx [${u.load}]`, `Rz [${u.load}]`, `Spring Rx`, `Spring Rz`]} rows={reactions.map((m, i) => <tr key={i}><td style={{ ...S.td, color: CLR.green, fontWeight: 700 }}>{m.joint}</td><td style={S.td}>{m.supportLabel || m.type}</td><td style={S.td}>{fnum(clean(m.Rx), 3)}</td><td style={S.td}>{fnum(clean(m.Rz), 3)}</td><td style={S.td}>{fnum(clean(m.springRx || 0), 3)}</td><td style={S.td}>{fnum(clean(m.springRz || 0), 3)}</td></tr>)} />
      </div>
      <Table title="Table 3: Nodal Displacements" cap="Equation 4" head={["Joint", `x [${u.dist}]`, `z [${u.dist}]`, `δx [${u.dist}]`, `δz [${u.dist}]`]} rows={displacements.map((d, i) => <tr key={i}><td style={{ ...S.td, color: CLR.accentSoft, fontWeight: 700 }}>{d.joint}</td><td style={{ ...S.td, color: CLR.muted }}>{d.coords.x}</td><td style={{ ...S.td, color: CLR.muted }}>{d.coords.z}</td><td style={S.td}>{d.x.toExponential(3)}</td><td style={S.td}>{d.z.toExponential(3)}</td></tr>)} />
      <Table title="Table 4: Static Equilibrium Check" cap="Equation 8 (added check; not in the v0.3.3 source)" head={["Check", "Applied loads", "Reactions", "Residual", "Status"]} rows={eq.rows.map(([k, a, bb, res, tol], i) => <tr key={i}><td style={{ ...S.td, fontWeight: 700 }}>{k}</td><td style={S.td}>{fnum(a, 3)}</td><td style={S.td}>{fnum(bb, 3)}</td><td style={S.td}>{res.toExponential(2)}</td><td style={S.td}><span style={S.badge(Math.abs(res) <= tol ? CLR.green : CLR.red)}>{Math.abs(res) <= tol ? "PASSED" : "FAILED"}</span></td></tr>)} />
    </div>
  );
}

    units: DEFAULT_UNITS, supports: DEFAULT_SUPPORTS, joints: DEFAULT_JOINTS, members: DEFAULT_MEMBERS,

// ── THEORY & DOCUMENTATION TAB ───────────────────────────────────────────
function TheoryView() {
  const ref = useRef(null);
  useEffect(() => { if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([ref.current]).catch(() => {}); }, []);
  const H = ({ children }) => <h3 style={{ color: CLR.accent, marginTop: 16, fontSize: 13 }}>{children}</h3>;
  return (
    <div ref={ref} style={{ ...S.card, lineHeight: 1.7, fontSize: 13 }}>
      <div style={S.h2}>Part 1: Engineering Theory</div>

      <H>1. Bar element</H>
      <p>Each member is a two-force, pin-ended bar that carries axial force only. Its axial stiffness is:</p>
      <Eq n={1} tex={"k = \\frac{EA}{L}"} where={"where $k$ is the member axial stiffness, $E$ the elastic modulus, $A$ the cross-sectional area and $L$ the member length."} />
      <Eq n={2} tex={"c_x = \\frac{x_f - x_n}{L},\\quad c_z = \\frac{z_f - z_n}{L},\\quad L = \\sqrt{(x_f-x_n)^2 + (z_f-z_n)^2}"} where={"where $(x_n, z_n)$ and $(x_f, z_f)$ are the near- and far-joint coordinates and $c_x$, $c_z$ are the direction cosines of the member axis."} />

      <H>2. Assembly and solution</H>
      <p>The element matrix in global axes, ordered $[u_n, w_n, u_f, w_f]$, is superposed into the global stiffness matrix at the shared degrees of freedom (direct stiffness method):</p>
      <Eq n={3} tex={"\\mathbf{k}_g = \\frac{EA}{L}\\begin{bmatrix} c_x^2 & c_xc_z & -c_x^2 & -c_xc_z \\\\ c_xc_z & c_z^2 & -c_xc_z & -c_z^2 \\\\ -c_x^2 & -c_xc_z & c_x^2 & c_xc_z \\\\ -c_xc_z & -c_z^2 & c_xc_z & c_z^2 \\end{bmatrix}"} where={"where $\\mathbf{k}_g$ is the 4×4 element stiffness in global axes; $u$ and $w$ are the x and z translations."} />
      <p>Translational spring supports add $k_x$ and $k_z$ to the diagonal terms of their joint. Conventional restraints are imposed with the penalty method (a very large stiffness added on each restrained DOF), and the system is solved by Gaussian elimination with partial pivoting; a near-zero pivot is reported as a mechanism.</p>
      <Eq n={4} tex={"\\left(\\mathbf{K} + \\mathbf{K}_s + \\beta\\,\\mathbf{I}_r\\right)\\mathbf{D} = \\mathbf{F}"} where={"where $\\mathbf{K}$ is the assembled global stiffness, $\\mathbf{K}_s$ the diagonal spring stiffness, $\\beta = 10^{20}$ the penalty value, $\\mathbf{I}_r$ the identity restricted to restrained DOFs, $\\mathbf{D}$ the joint displacements and $\\mathbf{F}$ the applied joint loads."} />

      <H>3. Member forces and reactions</H>
      <Eq n={5} tex={"N = \\frac{EA}{L}\\left[c_x\\,(u_f-u_n) + c_z\\,(w_f-w_n)\\right]"} where={"where $N$ is the axial force (tension positive) and $u$, $w$ are the joint displacements from Equation 4."} />
      <Eq n={6} tex={"R_i = \\beta\\,D_i\\ \\text{(restrained DOF)},\\qquad R_i^{s} = k_i\\,D_i,\\qquad R_i^{tot} = R_i + R_i^{s}"} where={"where $R_i$ is the restraint reaction, $R_i^{s}$ the spring reaction and $k_i$ the spring stiffness at DOF $i$. As in v0.3.3, reactions are reported as the force the structure exerts on the support."} />

      <H>4. Stability and determinacy</H>
      <Eq n={7} tex={"b + r \\;\\begin{cases} < 2j & \\text{unstable} \\\\ = 2j & \\text{stable, determinate} \\\\ > 2j & \\text{stable, indeterminate} \\end{cases}"} where={"where $b$ is the number of members, $r$ the number of restrained DOFs and $j$ the number of joints. Springs add elastic stiffness but are not counted in $r$."} />

      <H>5. Items added beyond the v0.3.3 calculation source</H>
      <p>The solver (Equations 1 to 7) is carried over unchanged. The following are <b>additions</b> and do not change any result:</p>
      <Eq n={8} tex={"\\sum P_x - \\sum R_x = 0,\\quad \\sum P_z - \\sum R_z = 0,\\quad \\sum \\left(x P_z - z P_x\\right) - \\sum \\left(x R_z - z R_x\\right) = 0"} where={"where $P$ are applied joint loads, $R$ the reported reactions and $(x, z)$ the joint coordinates. A residual within $10^{-6}$ of the load magnitude shows PASSED. This check, the PASSED/FAILED and STABLE/UNSTABLE badges, and the three figures are additions; the trusses have no capacity or code check, so no EXCEEDED state exists."} />

      <div style={{ ...S.h2, marginTop: 28 }}>Part 2: Coding Theory</div>
      <p>The app is a single HTML file. React 18 (UMD) is compiled in the browser by Babel. The solver functions (<code>solveTruss</code>, <code>gaussianElim</code> and the load-case helpers) sit in their own commented section and contain no interface code. The model (units, supports, joints, members, load cases) lives in one React state object. <b>Analyze</b> runs the active load case and stores the result together with a snapshot of the model, so the figures always match the tables. Every graphic is inline SVG drawn by one component (<code>TrussFigure</code>) using the shared <code>CLR</code> tokens and <code>SVG_BOX</code> style, with one <code>DiagramLegend</code> component and native SVG tooltips. <b>Save</b> downloads the model as JSON and <b>Open</b> reads it back. <b>Print / PDF</b> waits for MathJax to finish typesetting, then calls <code>window.print()</code>; the print stylesheet turns the dark UI into a light report and keeps tables, figures and equations from splitting across pages.</p>

      <div style={{ ...S.h2, marginTop: 28 }}>Part 3: References</div>
      <div style={{ fontSize: 12.5, color: CLR.muted, lineHeight: 1.7 }}>
        {[
          "Hibbeler, R. C. (2017). Structural analysis (10th ed.). Pearson.",
          "Logan, D. L. (2017). A first course in the finite element method (6th ed.). Cengage Learning.",
          "McGuire, W., Gallagher, R. H., & Ziemian, R. D. (2000). Matrix structural analysis (2nd ed.). John Wiley & Sons.",
          "Przemieniecki, J. S. (1968). Theory of matrix structural analysis. McGraw-Hill.",
        ].map((r, i) => <p key={i} style={{ paddingLeft: "2rem", textIndent: "-2rem", marginBottom: 8 }}>{r}</p>)}
        <p style={{ fontSize: 11.5, marginTop: 10 }}>Flag: editions, years and publishers above are given from memory and were not verified against publisher records; none has a DOI listed. Please confirm before citing formally.</p>
      </div>
    </div>
  );
}

const TABS = [{ id: "inputs", label: "Inputs" }, { id: "results", label: "Results" }, { id: "theory", label: "Theory" }];

function App() {
  const [M, setM] = useState(defaultModel());
  const [tab, setTab] = useState("inputs");
  const [run, setRun] = useState(null); // { res, snap }
  const fileRef = useRef(null);
  const activeLC = M.loadCases.find(l => l.id === M.activeLoadCaseId) || M.loadCases[0];
  const u = UNIT_SETS[M.units];

  const handleCalculate = () => {
    const res = runLoadCaseAnalysis(M.supports, M.joints, M.members, activeLC);
    setRun({ res, snap: { supports: M.supports, joints: applyJointLoads(M.joints, activeLC.jointLoads || {}), members: M.members, units: M.units, lc: activeLC.name } });
    setTab("results");
  };
  const handleLoadFile = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = evt => {
      try {
        const p = JSON.parse(evt.target.result), m = p.model;
        if (!m || !Array.isArray(m.supports) || !Array.isArray(m.joints) || !Array.isArray(m.members) || !Array.isArray(m.loadCases) || !m.loadCases.length) throw new Error("not a Trusses working file");
        setM({ ...defaultModel(), ...m, combos: m.combos || [] }); setRun(null); setTab("inputs");
      } catch (err) { alert("Could not read working file: " + err.message); }
    };
    reader.readAsText(file); e.target.value = "";
  };
  // Wait until MathJax has typeset every equation before the print dialog captures the page
  const handlePrintReport = async () => {
    try { if (window.MathJax && window.MathJax.typesetPromise) await window.MathJax.typesetPromise(); } catch (e) {}
    setTimeout(() => window.print(), 300);
  };
  const st = modelStats(M.supports, M.joints, M.members, activeLC);

  return (
    <div style={S.app}>
      <div style={S.header} className="screen-only">
        <div style={S.brand}>
          <svg width="38" height="38" viewBox="0 0 40 40" style={{ borderRadius: 12, boxShadow: "0 6px 16px rgba(6,182,212,0.3)" }}>
            <defs><linearGradient id="trLg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stopColor="#0891b2" /><stop offset="1" stopColor="#10b981" /></linearGradient></defs>
            <rect width="40" height="40" rx="12" fill="url(#trLg)" />
            <path d="M8 29 L20 11 L32 29 Z M14 20 L26 20 M20 11 L20 29" fill="none" stroke="#090d16" strokeWidth="2.4" strokeLinejoin="round" />
            <circle cx="8" cy="29" r="2.2" fill="#090d16" /><circle cx="32" cy="29" r="2.2" fill="#090d16" /><circle cx="20" cy="11" r="2.2" fill="#090d16" />
          </svg>
          <div>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}><span style={{ fontSize: 18 }}>{APP_NAME}</span><span style={S.brandBadge}>{VERSION}</span></div>
            <div style={{ fontSize: 11, color: CLR.muted, fontWeight: 400 }}>2D Truss Structural Analysis · Direct Stiffness Method</div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button style={S.btn("secondary")} onClick={() => saveWorkingFile(M)}>💾 Save</button>
          <button style={S.btn("secondary")} onClick={() => fileRef.current.click()}>📂 Open</button>
          <input ref={fileRef} type="file" accept=".json" style={{ display: "none" }} onChange={handleLoadFile} />
          <button style={S.btn("secondary")} onClick={handlePrintReport}>🖨 Print / PDF</button>
        </div>
        <div style={S.nav}>
          {TABS.map(t => <button key={t.id} style={S.navBtn(tab === t.id)} onClick={() => setTab(t.id)}>{t.label}{t.id === "results" && run && run.res && <span style={{ marginLeft: 6, ...S.badge(run.res.error ? CLR.red : CLR.green), fontSize: 9, padding: "0 6px" }}>{run.res.error ? "✗" : "✓"}</span>}</button>)}
        </div>
      </div>

      <div style={S.main} className="screen-only">
        {tab === "inputs" && <InputsView M={M} setM={setM} onCalculate={handleCalculate} activeLC={activeLC} u={u} />}
        {tab === "results" && <ResultsView result={run && run.res} supports={run ? run.snap.supports : M.supports} joints={run ? run.snap.joints : M.joints} members={run ? run.snap.members : M.members} units={run ? run.snap.units : M.units} loadCaseName={run ? run.snap.lc : activeLC.name} />}
        {tab === "theory" && <TheoryView />}
      </div>

      {/* Print report (hidden on screen, shown by the @media print rules) */}
      <div className="print-report-header">
        <h1 style={{ fontSize: 18, marginBottom: 4 }}>{APP_NAME} {VERSION} — Truss Analysis Report</h1>
        <div style={{ fontSize: 10, color: "#555" }}>Generated {new Date().toLocaleString()} · Units {M.units} · Load case {activeLC.name}</div>
        <div style={{ marginTop: 14 }} className="print-avoid">
          <h2 style={{ fontSize: 13, marginBottom: 6 }}>Model Summary</h2>
          <p style={{ fontSize: 11, marginBottom: 8 }}>{st.j} joints, {st.b} members, {st.r} restrained DOF — {st.status}.</p>
          <TrussFigure supports={M.supports} joints={applyJointLoads(M.joints, activeLC.jointLoads || {})} members={M.members} mode="model" u={u} />
          <DiagramLegend items={[[CLR.accent, "━ Member"], [CLR.green, "● Joint / support"], [CLR.red, "→ Joint load"], [CLR.yellow, "∿ Spring"]]} note="Figure 1: model" />
        </div>
        {run && <div style={{ marginTop: 14 }}><ResultsView result={run.res} supports={run.snap.supports} joints={run.snap.joints} members={run.snap.members} units={run.snap.units} loadCaseName={run.snap.lc} /></div>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
