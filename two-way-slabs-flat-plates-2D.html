<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Two Way Slabs v0.9.5 — EFM Analysis & Design</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d1117; color: #e6edf3; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; }
    input[type=number]::-webkit-inner-spin-button { opacity: 0.4; }
    select { -webkit-appearance: none; appearance: none; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0d1117; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }


    /* ── PRINT / PDF REPORT STYLES ─────────────────────────────────────────── */
    .print-report-header { display: none; }
    .screen-only { display: inherit; }
    .print-avoid { break-inside: avoid; page-break-inside: avoid; }

    @media print {
      @page { size: letter portrait; margin: 0.55in; }

      html, body {
        background: #ffffff !important;
        color: #111827 !important;
        font-family: Arial, Helvetica, sans-serif !important;
        font-size: 10pt !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      * {
        color: #111827 !important;
        border-color: #c9ced6 !important;
        box-shadow: none !important;
        text-shadow: none !important;
      }

      header, nav, .screen-only { display: none !important; }

      #root, main {
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
        max-width: none !important;
        width: 100% !important;
      }

      .print-report-header {
        display: block !important;
        margin: 0 0 14pt 0 !important;
        padding-bottom: 10pt !important;
        border-bottom: 2px solid #111827 !important;
        break-after: avoid;
        page-break-after: avoid;
      }

      .print-report-header h1 {
        font-size: 18pt !important;
        line-height: 1.2 !important;
        margin: 0 0 4pt 0 !important;
        font-weight: 800 !important;
      }

      .print-report-header .meta {
        font-size: 8.5pt !important;
        line-height: 1.45 !important;
        color: #374151 !important;
      }

      .print-avoid {
        background: #ffffff !important;
        border: 1px solid #c9ced6 !important;
        border-radius: 0 !important;
        margin: 0 0 12pt 0 !important;
        padding: 10pt !important;
        overflow: visible !important;
        break-inside: avoid !important;
        page-break-inside: avoid !important;
      }

      .print-table-section {
        padding: 0 !important;
      }

      .print-table-section > div:first-child,
      .print-diagram-section > div:first-child {
        padding: 8pt 9pt !important;
        background: #eef2f7 !important;
        border-bottom: 1px solid #c9ced6 !important;
      }

      .print-table-section > div:nth-child(2) {
        overflow: visible !important;
      }

      table {
        width: 100% !important;
        border-collapse: collapse !important;
        font-size: 8.3pt !important;
        page-break-inside: auto !important;
      }

      thead { display: table-header-group !important; }
      tfoot { display: table-footer-group !important; }

      tr {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
      }

      th, td {
        padding: 4pt 4.5pt !important;
        border: 1px solid #c9ced6 !important;
        background: #ffffff !important;
        color: #111827 !important;
      }

      th {
        background: #e8edf5 !important;
        font-size: 7.6pt !important;
        font-weight: 700 !important;
      }

      svg {
        max-width: 100% !important;
        height: auto !important;
        display: block !important;
        margin-left: auto !important;
        margin-right: auto !important;
        break-inside: avoid !important;
        page-break-inside: avoid !important;
      }

      .print-diagram-section {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
      }

      .print-diagram-section svg {
        max-height: 2.35in !important;
      }

      .report-results-block {
        display: block !important;
      }
    }

  </style>

  <style>
    .theory-doc{line-height:1.72;font-size:13px;color:#c9d1d9}
    .theory-doc h1{color:#58a6ff;font-size:20px;margin:0 0 16px}
    .theory-doc h2{color:#58a6ff;font-size:16px;margin:28px 0 10px;border-bottom:1px solid #30363d;padding-bottom:6px}
    .theory-doc h3{color:#e6edf3;font-size:14px;margin:20px 0 8px}
    .theory-doc p,.theory-doc li{margin-bottom:9px}
    .theory-doc ol,.theory-doc ul{padding-left:24px}
    .theory-doc .eq{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:12px 14px;margin:10px 0 8px;overflow-x:auto;break-inside:avoid;page-break-inside:avoid}
    .theory-doc .eq-label{color:#8b949e;font-size:11px;font-weight:700;text-transform:uppercase;margin-bottom:4px}
    .theory-doc .definition{color:#8b949e;margin-bottom:14px}
    .theory-doc .note{border-left:3px solid #d29922;background:#d2992211;padding:10px 12px;margin:12px 0;break-inside:avoid;page-break-inside:avoid}
    .theory-doc .reference{padding-left:28px;text-indent:-28px;margin-bottom:12px;break-inside:avoid;page-break-inside:avoid}
    mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;padding:3px 0}
    @media print{
      .theory-doc{color:#111827!important;font-size:9.5pt!important}
      .theory-doc h1,.theory-doc h2,.theory-doc h3{color:#111827!important;break-after:avoid;page-break-after:avoid}
      .theory-doc .eq,.theory-doc .note{background:#fff!important;border-color:#c9ced6!important;break-inside:avoid!important;page-break-inside:avoid!important}
      mjx-container{break-inside:avoid!important;page-break-inside:avoid!important;max-width:100%!important}
    }
  </style>

eory</h2>\n<h3>1.1 Equivalent-frame idealization and section properties</h3>\n<p>The slab system is represented by one equivalent frame in the active design-strip direction. Slab spans are prismatic flexural members. Each support receives rotational restraint from the column segment above and the column segment below. Vertical joint translation and frame sidesway are restrained, leaving joint rotation as the active degree of freedom.</p>\n<div class=\"eq\"><div class=\"eq-label\">Equation 1</div>\\[I_s=\\frac{bh^3}{12},\\qquad I_c=\\psi\\frac{BH^3}{12}\\]</div>\n<p class=\"definition\">where \\(I_s\\) is the gross slab-strip moment of inertia, \\(b\\) is the equivalent-frame strip width, \\(h\\) is slab thickness, \\(I_c\\) is effective column moment of inertia, \\(\\psi\\) is the user-entered column stiffness modifier, and \\(B\\) and \\(H\\) are the rectangular column dimensions perpendicular and parallel to bending, respectively.</p>\n<div class=\"eq\"><div class=\"eq-label\">Equation 2</div>\\[E_c=4500\\sqrt{f'_c}\\]</div>\n<p class=\"definition\">where \\(E_c\\) is the concrete modulus of elasticity in MPa and \\(f'_c\\) is specified concrete compressive strength in MPa.</p>\n\n<h3>1.2 Member stiffness, matrix assembly, and solution</h3>\n<div class=\"eq\"><div class=\"eq-label\">Equation 3</div>\\[k_{ii}=k_{jj}=\\frac{4E_cI_s}{L},\\qquad k_{ij}=k_{ji}=\\frac{2E_cI_s}{L}\\]</div>\n<p class=\"definition\">where \\(k_{ii}\\) and \\(k_{jj}\\) are member-end rotational stiffness terms, \\(k_{ij}\\) and \\(k_{ji}\\) are coupling terms, and \\(L\\) is span length between support centrelines.</p>\n<div class=\"eq\"><div class=\"eq-label\">Equation 4</div>\\[K_{c,i}=\\frac{4E_cI_{c,t}}{L_t}+\\frac{4E_cI_{c,b}}{L_b}\\]</div>\n<p class=\"definition\">where \\(K_{c,i}\\) is column rotational restraint at joint \\(i\\), \\(I_{c,t}\\) and \\(I_{c,b}\\) are effective inertias of top and bottom column segments, and \\(L_t\\) and \\(L_b\\) are the corresponding segment lengths.</p>\n<div class=\"eq\"><div class=\"eq-label\">Equation 5</div>\\[\\mathbf{K}\\boldsymbol{\\theta}=\\mathbf{P}\\]</div>\n<p class=\"definition\">where \\(\\mathbf{K}\\) is the assembled global rotational stiffness matrix, \\(\\boldsymbol{\\theta}\\) is the vector of unknown joint rotations, and \\(\\mathbf{P}\\) is the assembled fixed-end-moment load vector. The script solves Equation 5 by Gaussian elimination with partial pivoting.</p>\n\n<h3>1.3 Gravity loads and CSA A23.3:24 pattern loading</h3>\n<div class=\"eq\"><div class=\"eq-label\">Equation 6</div>\\[w_D=23.5\\left(\\frac{h}{1000}\\right)\\left(\\frac{b}{1000}\\right),\\quad w_{SDL}=q_{SDL}\\left(\\frac{b}{1000}\\right),\\quad w_L=q_L\\left(\\frac{b}{1000}\\right)\\]</div>\n<p class=\"definition\">where \\(w_D\\), \\(w_{SDL}\\), and \\(w_L\\) are slab self-weight, superimposed dead, and live line loads in kN/m; \\(23.5\\) is the implemented concrete unit weight in kN/m\u00b3; and \\(q_{SDL}\\) and \\(q_L\\) are specified area loads in kPa.</p>\n<div class=\"eq\"><div class=\"eq-label\">Equation 7</div>\\[w_f=1.25\\left(w_D+w_{SDL}\\right)+1.5\\lambda_Lw_L\\]</div>\n<p class=\"definition\">where \\(w_f\\) is factored line load and \\(\\lambda_L\\) is the live-load pattern factor. When pattern loading is required, \\(\\lambda_L=0.75\\) on the CSA-patterned panels and \\(\\lambda_L=0\\) elsewhere. The full-load minimum case uses \\(\\lambda_L=1.0\\) on every panel.</p>\n<div class=\"eq\"><div class=\"eq-label\">Equation 8</div>\\[w_L\\leq0.75\\left(w_D+w_{SDL}\\right)\\]</div>\n<p class=\"definition\">where the line-load terms are defined by Equation 6. Equation 8 uses specified, unfactored loads and is checked for every panel. If Equation 8 is satisfied throughout, the engine omits pattern loading and analyzes only full factored live load on the entire slab system. The same full-load case is also retained as the lower-bound design case when pattern loading is required.</p>\n<p>When Equation 8 is not satisfied, positive-moment cases place three-quarters of full factored live load on the design panel and alternate panels. Negative-moment cases place three-quarters of full factored live load on panels adjacent to the target support. Duplicate factor vectors are removed.</p>\n<div class=\"eq\"><div class=\"eq-label\">Equation 9</div>\\[M_{ij}^{F}=-\\frac{w_fL^2}{12},\\qquad M_{ji}^{F}=+\\frac{w_fL^2}{12}\\]</div>\n<p class=\"definition\">where \\(M_{ij}^{F}\\) and \\(M_{ji}^{F}\\) are fixed-end moments for a uniformly loaded prismatic member under the program sign convention.</p>\n\n<h3>1.4 Member-force recovery and diagram shading</h3>\n<div class=\"eq\"><div class=\"eq-label\">Equation 10</div>\\[M_{ij}=M_{ij}^{F}+\\frac{4E_cI_s}{L}\\theta_i+\\frac{2E_cI_s}{L}\\theta_j,\\quad M_{ji}=M_{ji}^{F}+\\frac{2E_cI_s}{L}\\theta_i+\\frac{4E_cI_s}{L}\\theta_j\\]</div>\n<p class=\"definition\">where \\(M_{ij}\\) and \\(M_{ji}\\) are recovered end moments and \\(\\theta_i\\) and \\(\\theta_j\\) are solved end rotations.</p>\n<div class=\"eq\"><div class=\"eq-label\">Equation 11</div>\\[V(x)=V_i-w_fx,\\qquad M(x)=M_i+V_ix-\\frac{w_fx^2}{2}\\]</div>\n<p class=\"definition\">where \\(x\\) is distance from the near end, \\(V_i\\) is near-end shear, and \\(M_i\\) is near-end moment. When multiple patterns exist, the maximum and minimum sampled ordinates form the shaded envelope. When pattern loading is unnecessary, the single full-load SFD and BMD are closed to the zero axis and shaded directly.</p>\n\n<h3>1.5 Flexural reinforcement</h3>\n<div class=\"eq\"><div class=\"eq-label\">Equation 12</div>\\[M_r=\\phi_sA_sf_y\\left(d-\\frac{a}{2}\\right),\\qquad a=\\frac{\\phi_sA_sf_y}{\\alpha_1\\phi_cf'_cb}\\]</div>\n<p class=\"definition\">where \\(M_r\\) is factored flexural resistance, \\(A_s\\) is tensile reinforcement area, \\(f_y\\) is reinforcement yield strength, \\(d\\) is effective depth, \\(a\\) is equivalent compression-block depth, \\(\\phi_s\\) and \\(\\phi_c\\) are resistance factors, and \\(\\alpha_1\\) is the concrete stress-block factor. The script substitutes the second expression into the first and solves the resulting quadratic for the smaller positive steel-area root.</p>\n<div class=\"eq\"><div class=\"eq-label\">Equation 13</div>\\[\\alpha_1=0.85-0.0015f'_c,\\qquad \\beta_1=0.97-0.0025f'_c\\]</div>\n<p class=\"definition\">where \\(\\alpha_1\\) and \\(\\beta_1\\) are the implemented concrete stress-block factors and \\(f'_c\\) is in MPa. Additional bar counts are obtained by dividing required additional steel area by nominal 15M, 20M, or 25M bar area and rounding upward.</p>\n\n<h3>1.6 One-way and two-way shear outputs</h3>\n<div class=\"eq\"><div class=\"eq-label\">Equation 14</div>\\[V_f=q_fA_{trib}-q_fA_{crit},\\qquad A_{crit}=(c_1+d)(c_2+d)\\]</div>\n<p class=\"definition\">where \\(V_f\\) is reported two-way shear demand, \\(q_f\\) is factored area load, \\(A_{trib}\\) is column tributary area, \\(A_{crit}\\) is the area inside the critical perimeter, and \\(c_1\\) and \\(c_2\\) are column dimensions parallel and perpendicular to the frame direction.</p>\n<div class=\"eq\"><div class=\"eq-label\">Equation 15</div>\\[M_{top}=M_u\\frac{K_{top}}{K_{top}+K_{bot}},\\qquad M_{bot}=M_u\\frac{K_{bot}}{K_{top}+K_{bot}}\\]</div>\n<p class=\"definition\">where \\(M_u\\) is calculated unbalanced joint moment and \\(K_{top}\\) and \\(K_{bot}\\) are top- and bottom-column rotational stiffnesses. One-way shear demand is evaluated at sections based on the entered effective depth. The two-way shear table reports demand and moment-transfer quantities and is not a complete punching-shear resistance or reinforcement design.</p>\n<div class=\"note\"><strong>Engineering scope and limitations.</strong> The engine is a linear-elastic equivalent-frame model with prismatic members, restrained vertical joint translation, no sidesway, and no cracking iteration. User-entered stiffness modifiers are design assumptions. Results require independent engineering review for method applicability, loading, minimum reinforcement, detailing, deflection, openings, torsion, punching geometry, and all CSA A23.3:24 provisions not explicitly implemented.</div>\n\n<h2>Part 2. Coding Theory</h2>\n<h3>2.1 Application architecture</h3>\n<p>The application is a single-file React 18 application. CSS, the production React bundle, default model data, analysis functions, SVG graphics, report styles, and working-file export logic are embedded in one HTML document. React state stores material properties, reusable column sections, nodes, spans, geometry mode, output units, and the latest result.</p>\n<h3>2.2 Processing workflow</h3>\n<ol>\n<li><strong>Normalize geometry.</strong> The program reads global node coordinates or generates coordinates cumulatively from span lengths.</li>\n<li><strong>Calculate loads.</strong> Span loads are entered directly or calculated using Equation 6.</li>\n<li><strong>Select loading mode.</strong> The program checks Equation 8 on every panel. Passing all panels generates one full-load case. Otherwise, the positive, negative, and full-load cases are generated.</li>\n<li><strong>Assemble and solve.</strong> Each case computes section properties, assembles \\(\\mathbf{K}\\) and \\(\\mathbf{P}\\), and solves Equation 5. A near-zero pivot returns a solver error.</li>\n<li><strong>Recover actions.</strong> End actions and continuous shear and moment functions are recovered using Equations 10 and 11.</li>\n<li><strong>Envelope and design.</strong> Multiple cases are sampled at consistent stations to create maximum and minimum envelopes. A single full-load case is rendered as a zero-axis shaded diagram. Governing actions feed reinforcement and shear summaries.</li>\n<li><strong>Render and export.</strong> React renders tables and SVG diagrams. Display conversion occurs after analysis, preserving consistent base units. The working-file function clones the current document and rewrites embedded default-state constants.</li>\n</ol>\n<h3>2.3 MathJax and PDF workflow</h3>\n<p>MathJax is configured in the document head for TeX inline delimiters \\(\\backslash(\\ldots\\backslash)\\) and display delimiters \\(\\backslash[\\ldots\\backslash]\\), with CHTML output. A mutation observer re-typesets dynamically mounted content. Before printing, the report command awaits <code>MathJax.typesetPromise()</code>, applies a short delay, and then opens the browser print dialog. Print CSS prevents equation blocks, MathJax containers, headings, diagrams, and table rows from breaking awkwardly across pages.</p>\n\n<h2>Part 3. References</h2>\n<p class=\"reference\">Brzev, S., &amp; Pao, J. (2016). <em>Reinforced concrete design: A practical approach</em> (3rd ed.). Pearson Learning Solutions.</p>\n<p class=\"reference\">CSA Group. (2024). <em>CSA A23.3:24: Design of concrete structures</em>. CSA Group.</p>\n<p class=\"reference\">Kassimali, A. (2020). <em>Structural analysis</em> (6th ed.). Cengage Learning.</p>\n<p class=\"reference\">MathJax Consortium. (n.d.). <em>MathJax documentation: Version 3.2</em>. https://docs.mathjax.org/en/v3.2/</p>\n</div>"}})}function hm(){let[e,t]=Zt("inputs"),n=[{id:"inputs",label:"Inputs"},{id:"results",label:"Results"},{id:"theory",label:"Theory"}],[r,l]=Zt(()=>gc.map(m=>({...m}))),[o,i]=Zt(()=>Sc.map(m=>({...m}))),[s,a]=Zt(()=>wc.map(m=>({...m}))),[d,y]=Zt(()=>({...tm})),[g,S]=Zt(nm),[w,N]=Zt(rm),[v,F]=Zt(null),p=Du(Math.max(0,...gc.map(m=>+m.id||0))+1),c=Du(Math.max(0,...Sc.map(m=>+m.id||0))+1),h=Du(Math.max(0,...wc.map(m=>+m.id||0))+1),k=(m,z,L)=>l(V=>V.map(I=>I.id===m?{...I,[z]:L}:I)),M=()=>{p.current++,l(m=>[...m,{id:p.current,name:`CC-300x300-${p.current}`,B:300,H:300,psi:1}])},T=m=>l(z=>z.length<=1?z:z.filter(L=>L.id!==m)),C=m=>{let z=co(m);return isFinite(z)?String(Math.round(z)):"0"},D=(m,z)=>{let L=m,V=2;for(;z.has(L);)L=`${m}-${V}`,V++;return z.add(L),L},$=m=>{let z=new Map,L=new Map,V={},I=[];return m.forEach(Z=>{let H=C(Z),oe=String(Z.name||"").trim(),je=
