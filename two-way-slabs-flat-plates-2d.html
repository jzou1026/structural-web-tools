// ═══ COLOR TOKENS (single source — extracted from sample-tool-R2.html) ═══

const SVG_BOX={background:CLR.bg,backgroundImage:`linear-gradient(${CLR.card} 1px, transparent 1px), linear-gradient(90deg, ${CLR.card} 1px, transparent 1px)`,backgroundSize:"40px 40px",border:`1px solid ${CLR.border}`,borderRadius:12,fontFamily:MONO,width:"100%",height:"auto"};

// ═══ SOLVER — reproduces two-way-slabs-R03.xlsx (QKD / MEM01-14 / Calculator). Units: N, mm. ═══
// SOLVER START
// Hermitian (cubic) rotation shape functions: N2=x-2x²/L+x³/L², N4=-x²/L+x³/L². Fixed-end moments Q_i=∫w(x)N_i(x)dx (5-pt Gauss, exact for cubics).
const GL=[[-0.906179845938664,0.236926885056189],[-0.538469310105683,0.478628670499366],[0,0.568888888888889],[0.538469310105683,0.478628670499366],[0.906179845938664,0.236926885056189]];
const hermiteFEM=(L,w)=>{let a=0,b=0;GL.forEach(([t,g])=>{const x=L/2*(1+t),q=w(x),wt=g*L/2;a+=wt*q*(x-2*x*x/L+x**3/L**2);b+=wt*q*(-x*x/L+x**3/L**2);});return[a,b];};
const gaussSolve=(K,b)=>{const n=b.length,A=K.map((r,i)=>[...r,b[i]]);for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;[A[c],A[p]]=[A[p],A[c]];for(let r=0;r<n;r++){if(r===c)continue;const t=A[r][c]/A[c][c];for(let j=c;j<=n;j++)A[r][j]-=t*A[c][j];}}return A.map((r,i)=>r[n]/r[i]);};
function solveEFM(m){
  const E=4500*Math.sqrt(m.fc),N=m.nodes.length,nsp=N-1,h=m.h,s=m.strip,d=h-m.cover-m.db,Ag=s*h;
  const DL=h/1000*m.gamma,wD=1.25*(DL+m.sdl)*s/1000,wL=1.5*m.ll*s/1000,wf=wD+wL;      // N/mm
  const ld=m.ll/(DL+m.sdl),pattern=ld>0.75,Is=s*h**3/12;                              // Cl. 13.8.4.2
  const L=[],k=[];for(let i=0;i<nsp;i++){L[i]=m.nodes[i+1].x-m.nodes[i].x;k[i]=E*Is/L[i];}
  const psiOf=i=>{if(!m.autoPsi)return m.nodes[i].psi;const l1=((L[i-1]??L[i])+(L[i]??L[i-1]))/2,r=s/l1; // Table 12.17, alpha1=0
    return Math.min(1,Math.max(0.3,r<=1?0.3:0.6*(r-0.5)));};
  const psi=m.nodes.map((_,i)=>psiOf(i));
  const K=Array.from({length:N},()=>Array(N).fill(0));
  m.nodes.forEach((n,i)=>{const Ic=n.c2*n.c1**3/12*psi[i];K[i][i]+=4*E*Ic/n.Lt+4*E*Ic/n.Lb;});
  for(let i=0;i<nsp;i++){K[i][i]+=4*k[i];K[i+1][i+1]+=4*k[i];K[i][i+1]+=2*k[i];K[i+1][i]+=2*k[i];}
  // Load patterns (Cl. 13.8.4 / Fig. 12.49): partial live load = 3/4 of factored LL
  const lw=on=>L.map((_,i)=>wD+(on(i)?0.75*wL:0)),id=i=>m.nodes[i].id;
  let cases;
  if(!pattern)cases=[{name:"Full factored load on all spans (Cl. 13.8.4.2)",w:L.map(()=>wf)}];
  else{cases=[];for(let i=0;i<nsp;i++)cases.push({name:`LP+ span ${id(i)}${id(i+1)}`,w:lw(q=>(q-i)%2===0)});
    for(let j=0;j<N;j++)cases.push({name:`LP− support ${id(j)}`,w:lw(q=>q===j-1||q===j||(q<j-1&&(j-1-q)%2===0)||(q>j&&(q-j)%2===0))});
    cases.push({name:"Full factored load (Cl. 13.8.4.4)",w:L.map(()=>wf)});}
  const dL=L.map((l,i)=>Math.min(m.nodes[i].c1/2,0.175*l)),dR=L.map((l,i)=>Math.min(m.nodes[i+1].c1/2,0.175*l));
  const dv=Math.max(0.9*d,0.72*h),nenv=m.nodes.map(()=>({Mu:0,R:0}));
  const env=L.map(()=>({pts:Array.from({length:41},()=>({Mx:-Infinity,Mn:Infinity,Vx:-Infinity,Vn:Infinity})),Mbot:-Infinity,tL:Infinity,tR:Infinity,cL:Infinity,cR:Infinity,vl:0,vr:0}));
  const interp=(p,x)=>{let j=0;while(j<p.length-2&&p[j+1].x<=x)j++;const a=p[j],b=p[j+1],t=(x-a.x)/(b.x-a.x);return Math.abs(a.V+t*(b.V-a.V));};
  const red=(M,V,dd)=>M<0?Math.min(0,M+Math.abs(V)*dd):M;                         // M1 = M_CL − V_CL·a/2 (hogging magnitude reduced)
  cases.forEach(cs=>{
    const Q=Array(N).fill(0),fe=L.map((l,i)=>hermiteFEM(l,()=>cs.w[i]));
    fe.forEach(([a,b],i)=>{Q[i]+=a;Q[i+1]+=b;});
    const th=gaussSolve(K,Q.map(q=>-q));cs.th=th;const ends=[];
    L.forEach((l,i)=>{const w=cs.w[i],Mn=fe[i][0]+4*k[i]*th[i]+2*k[i]*th[i+1],Mf=fe[i][1]+2*k[i]*th[i]+4*k[i]*th[i+1],e=env[i],pts=[];
      for(let q=0;q<=40;q++){const x=l*q/40,M=w*x*(l-x)/2+Mn*(x/l-1)+Mf*x/l,V=w*(l/2-x)+(Mn+Mf)/l;pts.push({x,M,V});
        const o=e.pts[q];o.x=x;o.g=m.nodes[i].x+x;o.Mx=Math.max(o.Mx,M);o.Mn=Math.min(o.Mn,M);o.Vx=Math.max(o.Vx,V);o.Vn=Math.min(o.Vn,V);}
      const V0=w*l/2+(Mn+Mf)/l,VL=-w*l/2+(Mn+Mf)/l;
      ends[i]={Mn,Mf,V0,VL};e.Mbot=Math.max(e.Mbot,...pts.map(p=>p.M));e.cL=Math.min(e.cL,-Mn);e.cR=Math.min(e.cR,Mf);
      e.tL=Math.min(e.tL,red(-Mn,V0,dL[i]));e.tR=Math.min(e.tR,red(Mf,VL,dR[i]));
      e.vl=Math.max(e.vl,interp(pts,dL[i]+dv));e.vr=Math.max(e.vr,interp(pts,l-dR[i]-dv));});
    for(let j=0;j<N;j++){const a=ends[j-1],b=ends[j];                                  // column moment & reaction per pattern
      nenv[j].Mu=Math.max(nenv[j].Mu,Math.abs((a?a.Mf:0)+(b?b.Mn:0)));nenv[j].R=Math.max(nenv[j].R,(b?b.V0:0)+(a?-a.VL:0));}});
  // Design per attachment: Eq. 5.4, As,min=0.002Ag (Cl. 7.8.1), s<=min(3h,500) (Cl. 13.10.4)
  const Asmin=0.002*Ag,smax=Math.min(3*h,500),AR=[200,300,500];
  const des=M=>{const q=d*d-3.85*Math.abs(M)/m.fc/s,A=q<0?Infinity:Math.max(0,0.0015*m.fc*s*(d-Math.sqrt(q)));
    return{A,cnt:AR.map(a=>Math.ceil(A/a)),spc:AR.map(a=>Math.min(Math.floor(s*a/Math.max(A,Asmin)/10)*10,smax))};};
  const spans=env.map((e,i)=>{const Vc=0.65*(230/(1000+dv))*Math.sqrt(m.fc)*s*dv,tl=Math.min(e.tL,0),tr=Math.min(e.tR,0);
    return{name:id(i)+id(i+1),L:L[i],env:e.pts,dL:dL[i],dR:dR[i],cL:e.cL,cR:e.cR,MtopL:tl,MtopR:tr,Mbot:e.Mbot,dTL:des(tl),dTR:des(tr),dB:des(e.Mbot),vl:e.vl,vr:e.vr,Vc,okL:Vc>=e.vl,okR:Vc>=e.vr};});
  // Unbalanced moments (Eq. 9 EFM, Eq. 12.10 DDM) and punching shear (Eq. 12.17-12.21)
  const sq=Math.sqrt(m.fc),phi=0.65,ls=Math.min(1,1300/(1000+d)),wdf=1.25*(DL+m.sdl),wlf=1.5*m.ll,wa=(wdf+wlf)*1e-3,sm=s/1000;
  const cols=m.nodes.map((n,j)=>{const ext=j===0||j===N-1,b1=ext?n.c1+d/2:n.c1+d,b2=n.c2+d,bo=ext?2*b1+b2:2*(b1+b2),
    tl=j>0?L[j-1]/2:n.c1/2,tr=j<N-1?L[j]/2:n.c1/2,Vt=wa*((tl+tr)*s-b1*b2),Vr=nenv[j].R-wa*b1*b2,Vf=Math.max(Vt,Vr),vf=Vf/(bo*d);
    let MuD=null;if(!ext){const la=L[j-1]-(m.nodes[j-1].c1+n.c1)/2,lb=L[j]-(n.c1+m.nodes[j+1].c1)/2,lo=Math.max(la,lb),sh=Math.min(la,lb);
      MuD=0.07*((wdf+0.5*wlf)*sm*(lo/1000)**2-wdf*sm*(sh/1000)**2)*1e6;}
    const bc=Math.max(n.c1,n.c2)/Math.min(n.c1,n.c2),as=ext?3:4,vc=Math.min((1+2/bc)*0.19*ls*phi*sq,(as*d/bo+0.19)*ls*phi*sq,0.38*ls*phi*sq);
    return{id:n.id,type:ext?"Exterior":"Interior",MuE:nenv[j].Mu,MuD,Mu:Math.max(nenv[j].Mu,MuD||0),Vt,Vr,Vf,bo,vf,vc,ok:vf<=vc};});
  return{cols,E,d,dv,wf,wD,wL,ld,pattern,Asmin,smax,psi,cases:cases.map(c=>({name:c.name,w:c.w})),spans,ok:spans.every(o=>o.okL&&o.okR)};
}
// SOLVER END

// ═══ SHARED UI ═══
const f=(v,n=1)=>(v==null||!isFinite(v))?"—":Number(v).toFixed(n);
const DEF={fc:30,fy:400,h:180,strip:4800,cover:40,db:20,gamma:24,sdl:1.44,ll:3.6,barSel:0,bars:[200,300,500],typS:450,autoPsi:false,
 nodes:[["A",0,300,600,3000,3000],["B",5000,600,300,3000,3000],["C",11000,600,300,3000,3000],["D",16000,300,600,3000,3000]].map(([id,x,c1,c2,Lt,Lb])=>({id,x,c1,c2,Lt,Lb,psi:0.3}))};
function Legend({items}){return <div style={{display:"flex",gap:16,flexWrap:"wrap",fontSize:11,color:CLR.muted,fontFamily:MONO,marginTop:8}}>
 {items.map((it,i)=><span key={i} style={{display:"flex",alignItems:"center",gap:6}}><svg width="22" height="10">{it.dot?<circle cx="11" cy="5" r="4" fill={it.c} stroke={CLR.accent} strokeWidth="1.5"/>:<line x1="0" y1="5" x2="22" y2="5" stroke={it.c} strokeWidth="3" strokeDasharray={it.dash?"4 3":""} strokeLinecap="round"/>}</svg>{it.l}</span>)}</div>;}
const Card=({t,children,cls})=><div className={"card "+(cls||"")}><div className="cardtitle">{t}</div>{children}</div>;
const Badge=({ok,a="PASSED",b="EXCEEDED"})=><span style={{display:"inline-block",padding:"2px 10px",borderRadius:999,fontSize:11,fontWeight:700,background:ok?"rgba(16,185,129,.15)":"rgba(244,63,94,.15)",color:ok?CLR.green:CLR.redSoft,border:`1px solid ${ok?CLR.green:CLR.red}`}}>{ok?a:b}</span>;
function Eq({n,tex,where}){const r=useRef();useEffect(()=>{window.MathJax?.typesetPromise?.([r.current]).catch(()=>{});},[tex]);
 return <div className="print-eq" ref={r}><div className="eqbox" style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span>{"$$"+tex+"$$"}</span><span style={{fontFamily:MONO,fontSize:11,color:CLR.accent}}>Eq. {n}</span></div>{where&&<p>{where}</p>}</div>;}
function Num({v,set,w}){return <input className="inp" type="number" value={v} style={w?{width:w}:{}} onChange={e=>set(parseFloat(e.target.value)||0)}/>;}

// ═══ GRAPHICS (inline SVG) ═══
function FrameSVG({m,r}){ // live elevation: slab-beam, columns, supports, UDL
 const W=760,H=260,x0=50,sc=(W-100)/m.nodes[m.nodes.length-1].x,y=130,cl=70;
 const X=v=>x0+(v-m.nodes[0].x)*sc;
 const arrows=[];m.nodes.slice(0,-1).forEach((n,i)=>{const a=X(n.x),b=X(m.nodes[i+1].x),k=Math.max(4,Math.round((b-a)/28));
  for(let q=0;q<=k;q++){const xx=a+(b-a)*q/k;arrows.push(<path key={i+"-"+q} d={`M${xx} 62 L${xx} ${y-8} M${xx-3} ${y-14} L${xx} ${y-8} L${xx+3} ${y-14}`} stroke={CLR.yellow} strokeWidth="1.5" fill="none"/>);}});
 return <svg viewBox={`0 0 ${W} ${H}`} style={SVG_BOX}>
  {arrows}<line x1={X(m.nodes[0].x)} x2={X(m.nodes[m.nodes.length-1].x)} y1="62" y2="62" stroke={CLR.yellow} strokeWidth="2"/>
  <text x={W/2} y="50" fill={CLR.yellow} fontSize="10" textAnchor="middle">wf = {f(r.wf*1,2)} kN/m</text>
  {m.nodes.map((n,i)=><g key={i}>
   <line x1={X(n.x)} x2={X(n.x)} y1={y-cl} y2={y+cl} stroke={CLR.accent} strokeWidth="3" strokeLinecap="round" strokeDasharray="0"/>
   <path d={`M${X(n.x)-9} ${y+cl+12} L${X(n.x)+9} ${y+cl+12} M${X(n.x)-9} ${y+cl} L${X(n.x)} ${y+cl-0} `} stroke={CLR.accent}/>
   <rect x={X(n.x)-10} y={y+cl} width="20" height="9" fill={CLR.green} fillOpacity=".35" stroke={CLR.accent}/>
   <circle cx={X(n.x)} cy={y} r="5" fill={CLR.green} stroke={CLR.accent} strokeWidth="1.5"/>
   <text x={X(n.x)} y={y-cl-8} fill={CLR.text} fontSize="11" textAnchor="middle">{n.id}</text>
   <text x={X(n.x)} y={y+cl+30} fill={CLR.muted} fontSize="10" textAnchor="middle">{n.c1}×{n.c2}</text></g>)}
  <line x1={X(m.nodes[0].x)} x2={X(m.nodes[m.nodes.length-1].x)} y1={y} y2={y} stroke={CLR.accent} strokeWidth="3.5" strokeLinecap="round"/>
  {m.nodes.slice(0,-1).map((n,i)=><text key={i} x={(X(n.x)+X(m.nodes[i+1].x))/2} y={y+18} fill={CLR.muted} fontSize="10" textAnchor="middle">L = {m.nodes[i+1].x-n.x} mm</text>)}
 </svg>;}
const nice=v=>{const p=10**Math.floor(Math.log10(v)),q=v/p;return(q<1.5?1:q<3?2:q<7?5:10)*p;};
function Chart({ser,marks,yl,xmax,limits=[]}){ // generic result chart
 const W=760,H=300,L=64,R=20,T=18,B=44,all=ser.flatMap(s=>s.pts.map(p=>p[1])).concat(0);
 const lo=Math.min(...all),hi=Math.max(...all),st=nice((hi-lo||1)/6),y0=Math.floor(lo/st)*st,y1=Math.ceil(hi/st)*st,xs=nice(xmax/8);
 const X=v=>L+v/xmax*(W-L-R),Y=v=>T+(y1-v)/(y1-y0)*(H-T-B),yt=[],xt=[];
 for(let v=y0;v<=y1+1e-9;v+=st)yt.push(v);for(let v=0;v<=xmax+1e-9;v+=xs)xt.push(v);
 return <svg viewBox={`0 0 ${W} ${H}`} style={SVG_BOX}>
  {yt.map(v=><g key={"y"+v}><line x1={L} x2={W-R} y1={Y(v)} y2={Y(v)} stroke={v===0?CLR.border2:CLR.border} strokeDasharray={v===0?"4 3":""}/><text x={L-6} y={Y(v)+3} fill={CLR.muted} fontSize="10" textAnchor="end">{+v.toPrecision(4)}</text></g>)}
  {xt.map(v=><g key={"x"+v}><line y1={T} y2={H-B} x1={X(v)} x2={X(v)} stroke={CLR.border}/><text x={X(v)} y={H-B+14} fill={CLR.muted} fontSize="10" textAnchor="middle">{v}</text></g>)}
  <text x={(L+W-R)/2} y={H-8} fill={CLR.muted} fontSize="10" textAnchor="middle">x along strip (mm)</text>
  <text transform={`translate(14 ${H/2}) rotate(-90)`} fill={CLR.muted} fontSize="10" textAnchor="middle">{yl}</text>
  {limits.map((l,i)=><g key={i}><line x1={L} x2={W-R} y1={Y(l.v)} y2={Y(l.v)} stroke={CLR.yellow} strokeDasharray="6 4"/><text x={W-R-4} y={Y(l.v)-4} fill={CLR.yellow} fontSize="10" textAnchor="end">{l.t}</text></g>)}
  {ser.map((s,i)=>{const d=s.pts.map((p,j)=>(j?"L":"M")+X(p[0])+" "+Y(p[1])).join(" ");
   return <g key={i}><path d={d+` L${X(s.pts[s.pts.length-1][0])} ${Y(0)} L${X(s.pts[0][0])} ${Y(0)}Z`} fill={s.c} fillOpacity=".15"/><path d={d} fill="none" stroke={s.c} strokeWidth="3" strokeLinejoin="round"/></g>;})}

 </svg>;}

 return <div className="grid2"><div>

  <Card t="Geometric Dimensions"><div className="g3">{fld("Slab h (mm)","h")}{fld("Design strip l₂ (mm)","strip")}{fld("Cover (mm)","cover")}{fld("Bar dia. (mm)","db")}</div></Card>
  <Card t="Reinforcement"><div className="g3"><div><label>Bar size (info)</label><select className="inp" value={m.barSel} onChange={e=>setM({...m,barSel:+e.target.value})}><option value={0}>15M (200)</option><option value={1}>20M (300)</option><option value={2}>25M (500)</option></select></div><div><label>Column ψ</label><select className="inp" value={m.autoPsi?1:0} onChange={e=>setM({...m,autoPsi:e.target.value==="1"})}><option value={0}>Manual (table)</option><option value={1}>Auto (Table 12.17)</option></select></div></div></Card>
  <Card t="Loads (kPa)"><div className="g3">{fld("Superimposed DL","sdl")}{fld("Live load","ll")}<div><label>Self-weight (kPa)</label><div className="inp">{f(m.h/1000*m.gamma,2)}</div></div></div></Card>
 </div><div>
  <div className="card"><div className="cardtitle">Live Frame Model</div><FrameSVG m={m} r={r}/>
   <p style={{fontSize:11,color:CLR.muted,fontFamily:MONO,marginTop:8}}>d = {f(r.d,0)} mm · E = {f(r.E,0)} MPa · wf = {f(r.wf,2)} kN/m · L/D = {f(r.ld,3)} {r.pattern?"(>0.75: pattern loading required, Cl. 13.8.4.3)":"(<0.75, no pattern loading, Cl. 13.8.4.2)"}</p></div>
  <Card t="Columns & Nodes (add / delete)"><div style={{overflowX:"auto"}}><table><thead><tr><th>Node</th><th>x</th><th>c₁ ∥ frame</th><th>c₂</th><th>L top</th><th>L bot</th><th>ψ</th><th></th></tr></thead><tbody>
   {m.nodes.map((n,i)=><tr key={i}><td><input className="inp" style={{width:48}} value={n.id} onChange={e=>un(i,"id")(e.target.value)}/></td>{["x","c1","c2","Lt","Lb","psi"].map(k=><td key={k}><Num v={n[k]} set={un(i,k)} w={k==="psi"?56:78}/></td>)}
    <td><button className="btn" disabled={m.nodes.length<=2} onClick={()=>setM({...m,nodes:m.nodes.filter((_,j)=>j!==i)})}>✕</button></td></tr>)}</tbody></table></div>
   <button className="btn" style={{marginTop:8}} onClick={()=>{const l=m.nodes[m.nodes.length-1];setM({...m,nodes:[...m.nodes,{...l,id:String.fromCharCode(l.id.charCodeAt(0)+1),x:l.x+5000}]});}}>+ Add node / span</button></Card></div></div>;}

function ResultsTab({m,r,stale}){
 const sp=r.spans,x0=m.nodes[0].x,xmax=m.nodes[m.nodes.length-1].x-x0,kn=1e-6,kv=1e-3;
 const ser=(a,c)=>({pts:sp.flatMap(s=>s.env.map(p=>[p.g-x0,p[a]*(a[0]==="M"?kn:kv)])),c});
 const mk=[];sp.forEach((s,i)=>{const g=m.nodes[i].x-x0;mk.push({x:g+s.dL,y:s.MtopL*kn,t:`${s.name} left face: ${f(s.MtopL*kn)} kN·m`},{x:g+s.L-s.dR,y:s.MtopR*kn,t:`${s.name} right face: ${f(s.MtopR*kn)} kN·m`});});
 const row=(s,loc,Mcl,M,D,top)=><tr key={s.name+loc}><td>{loc==="Left (Top)"?s.name:""}</td><td>{loc}</td><td>{Mcl==null?"—":f(Mcl*kn)}</td><td>{f(M*kn)}</td><td>{f(D.A)}</td><td>{f(r.Asmin,0)}</td>{top?D.cnt.map((c,i)=><td key={i}>{c}</td>):D.spc.map((c,i)=><td key={i}>@{c}</td>)}</tr>;
 return <div>
  {stale&&<Card t="Notice"><Badge ok={false} b="MODEL CHANGED — PRESS ANALYSIS TO UPDATE"/></Card>}
  <Card t="Overall Status"><Badge ok={r.ok} a="ALL SHEAR CHECKS PASSED" b="SHEAR CHECK EXCEEDED"/> <span style={{fontSize:12,color:CLR.muted,marginLeft:10}}>w_f = {f(r.wf,2)} kN/m · L/D = {f(r.ld,3)} → {r.pattern?"pattern loading applied":"full load only"} · d = {f(r.d,0)} mm · A_s,min = {f(r.Asmin,0)} mm² · s_max = {r.smax} mm</span></Card>
  <Card t="Table 1 — Load Patterns Analysed (Cl. 13.8.4, Eq. 1–2); span loads in kN/m"><div style={{overflowX:"auto"}}><table><thead><tr><th>Pattern</th>{sp.map(s=><th key={s.name}>{s.name}</th>)}</tr></thead><tbody>{r.cases.map(c=><tr key={c.name}><td>{c.name}</td>{c.w.map((w,i)=><td key={i}>{f(w,2)}</td>)}</tr>)}</tbody></table></div></Card>
  <Card t="Figure 1 — Bending Moment Envelope (sagging +)"><Chart ser={[ser("Mx",CLR.accent),ser("Mn",CLR.accent)]} marks={mk} yl="M (kN·m)" xmax={xmax}/><Legend items={[{c:CLR.accent,l:"Max / min envelope, Eq. 4"},{c:CLR.green,dot:1,l:"Reduced face moment, Eq. 5 (hover)"}]}/></Card>
  <Card t="Figure 2 — Shear Force Envelope"><Chart ser={[ser("Vx",CLR.green),ser("Vn",CLR.green)]} marks={[]} yl="V (kN)" xmax={xmax}/><Legend items={[{c:CLR.green,l:"Max / min V(x), Eq. 4"}]}/></Card>
  <Card t="Table 2 — Flexural Design (Eq. 5, 6, 7): bars = count, bottom = max spacing in mm"><div style={{overflowX:"auto"}}><table><thead><tr><th>Span</th><th>Location</th><th>M_CL</th><th>M design</th><th>A_s (5.4)</th><th>A_s,min</th><th>15M</th><th>20M</th><th>25M</th></tr></thead><tbody>
   {sp.flatMap(s=>[row(s,"Left (Top)",s.cL,s.MtopL,s.dTL,1),row(s,"Max (Bot)",null,s.Mbot,s.dB,0),row(s,"Right (Top)",s.cR,s.MtopR,s.dTR,1)])}</tbody></table></div></Card>
  <Card t="Table 3 — One-Way Shear at d_v from Face (Eq. 8, workbook check retained)"><table><thead><tr><th>Span</th><th>Side</th><th>V (kN)</th><th>Vr (kN)</th><th>Util.</th><th>Status</th></tr></thead><tbody>
   {sp.flatMap(s=>[["Left",s.vl,s.okL],["Right",s.vr,s.okR]].map((q,j)=><tr key={s.name+j}><td>{j?"":s.name}</td><td>{q[0]}</td><td>{f(q[1]*kv)}</td><td>{f(s.Vc*kv)}</td><td>{f(q[1]/s.Vc,2)}</td><td><Badge ok={q[2]}/></td></tr>))}</tbody></table></Card>
  <Card t="Table 4 — Unbalanced Moments & Punching Shear Design Loads (Eq. 9–12)"><div style={{overflowX:"auto"}}><table><thead><tr><th>Col.</th><th>Type</th><th>M_u frame</th><th>M_u Eq. 10</th><th>M_u design</th><th>V_f trib.</th><th>V_f frame</th><th>V_f design</th><th>b_o</th><th>v_f</th><th>v_c</th><th>v_f/v_c</th><th>Status</th></tr></thead><tbody>
   {r.cols.map(c=><tr key={c.id}><td>{c.id}</td><td>{c.type}</td><td>{f(c.MuE*kn)}</td><td>{c.MuD==null?"—":f(c.MuD*kn)}</td><td>{f(c.Mu*kn)}</td><td>{f(c.Vt*kv)}</td><td>{f(c.Vr*kv)}</td><td>{f(c.Vf*kv)}</td><td>{f(c.bo,0)}</td><td>{f(c.vf,2)}</td><td>{f(c.vc,2)}</td><td>{f(c.vf/c.vc,2)}</td><td><Badge ok={c.ok}/></td></tr>)}</tbody></table></div>
   <p style={{fontSize:11,color:CLR.muted,fontFamily:MONO,marginTop:8}}>Units: kN·m, kN, mm, MPa. Status checks v_f against v_c only; the moment-transfer stress v_M (Eq. 12.26–12.30) is not included, M_u is provided for that check.</p></Card></div>;}

function TheoryTab(){return <div className="theory">
 <Card t="Part 1 — Engineering Theory (CSA A23.3-19 Cl. 13.8; textbook Section 12.7)">
  <p>The strip is a continuous slab-beam of width $l_2$ with columns above and below each node (far ends fixed, columns at $\psi I_c$, Table 12.17). Unknowns are joint rotations.</p>
  <Eq n={1} tex="Q_i=\int_0^L w(x)\,N_i(x)\,dx,\quad N_2=x-\tfrac{2x^2}{L}+\tfrac{x^3}{L^2},\ N_4=-\tfrac{x^2}{L}+\tfrac{x^3}{L^2}" where="where Q_i are the Hermitian-consistent fixed-end moments (near end i=2, far end i=4), w(x) is the factored line load and N_i the cubic Hermite rotation shape functions. A 5-point Gauss rule integrates them exactly; for uniform w this gives +wL²/12 and −wL²/12."/>
  <Eq n={2} tex="[K]\{\theta\}=-\{Q\},\quad M_n=Q_2+\tfrac{4EI}{L}\theta_n+\tfrac{2EI}{L}\theta_f,\ \ M_f=Q_4+\tfrac{2EI}{L}\theta_n+\tfrac{4EI}{L}\theta_f" where="where K is the rotational stiffness matrix (slabs 4EI/L, 2EI/L plus column terms 4Eψ I_c/L_c), θ joint rotations, E = 4500 sqrt(f'c) MPa, and M_n, M_f are the near and far member end moments."/>
  <p><b>Pattern loading (Cl. 13.8.4, Fig. 12.49).</b> If $LL/DL\le 0.75$ only the full factored load $w_f=[1.25(DL+SDL)+1.5LL]l_2$ is analysed. Otherwise the tool runs automatically: (LP+) for each span, that span and alternate spans carry $w_D+\tfrac34 w_L$ and the rest $w_D$; (LP−) for each support, the two adjacent spans and alternate spans beyond carry $w_D+\tfrac34 w_L$; plus the full factored load (LP5, Cl. 13.8.4.4). Design values are the envelope over all cases.</p>
  <Eq n={3} tex="M(x)=\tfrac{w x(L-x)}{2}+M_n\left(\tfrac{x}{L}-1\right)+M_f\tfrac{x}{L},\quad V(x)=w\left(\tfrac{L}{2}-x\right)+\tfrac{M_n+M_f}{L}" where="where x is measured from the near node (41 stations per span)."/>
  <Eq n={4} tex="M_{env}(x)=\max_{c}M_c(x),\ \min_{c}M_c(x)" where="where c runs over all load patterns."/>
  <Eq n={5} tex="M_1=M_{CL}-V_{CL}\tfrac{a}{2},\quad \tfrac{a}{2}=\min(c_1/2,\,0.175\,l_1)" where="where M_CL and V_CL are the centreline moment and shear of each pattern, a is the support width (limited by 0.175 l1, Cl. 13.8.5.1) and M_1 the reduced hogging moment at the column face; the tool reduces the hogging magnitude by |V_CL|·a/2 and takes the envelope."/>
  <Eq n={6} tex="A_s=0.0015f'_c\,b\left(d-\sqrt{d^2-\tfrac{3.85M_f}{f'_c\,b}}\right)" where="Eq. 5.4 of the attachment, with b = l2, d = h − cover − bar dia. and M_f the factored design moment."/>
  <Eq n={7} tex="A_{s,min}=0.002A_g,\qquad s\le\min(3h_s,\ 500\,\text{mm})" where="Cl. 7.8.1 and Cl. 13.10.4. Top bars = A_s / bar area rounded up (A_s,min not applied to top steel, as in Table 12.18); bottom spacing = b·A_bar / max(A_s, A_s,min), floored to 10 mm, then limited by s_max."/>
  <Eq n={8} tex="d_v=\max(0.9d,0.72h),\quad V_r=0.65\tfrac{230}{1000+d_v}\sqrt{f'_c}\,b\,d_v" where="One-way shear at d_v from the face. This check is not in Section 12.7; it is retained from the workbook (labelled addition)."/>
  <Eq n={9} tex="M_u=\max_{c}\left|M_{f,left}+M_{n,right}\right|" where="Unbalanced moment at a column from the frame analysis (Fig. 12.33): difference of the centreline moments of the adjacent spans for each load pattern c, enveloped. At exterior columns the whole end moment is transferred."/>
  <Eq n={10} tex="M_u=0.07\left[(w_{df}+0.5w_{lf})\,l_{2a}\,l_n^2-w'_{df}\,l'_{2a}\,(l'_n)^2\right]" where="Eq. 12.10 (Cl. 13.9.4, interior columns): l_n and l'_n are the longer and shorter clear spans, w_df and w_lf the factored dead and live area loads. The design M_u is the larger of Eq. 9 and Eq. 10 (labelled addition)."/>
  <Eq n={11} tex="V_f=w_f\left[(t_L+t_R)\,l_2-b_1b_2\right],\quad b_1=c_1+d\ (c_1+d/2\ \text{exterior}),\ b_2=c_2+d,\ b_o=2(b_1+b_2)\ (2b_1+b_2\ \text{exterior})" where="Punching shear force on the critical section at d/2 from the column face (Eq. 12.17, Cl. 13.3.3): t_L, t_R are the tributary half-spans (c1/2 beyond an exterior column centreline), w_f the total factored area load. V_f is the larger of this and the frame reaction minus the load inside the critical section, over all load patterns."/>
  <Eq n={12} tex="v_f=\tfrac{V_f}{b_od},\quad v_c=\min\left[\left(1+\tfrac{2}{\beta_c}\right)0.19\lambda_s\phi_c\sqrt{f'_c},\ \left(\tfrac{\alpha_s d}{b_o}+0.19\right)\lambda_s\phi_c\sqrt{f'_c},\ 0.38\lambda_s\phi_c\sqrt{f'_c}\right]" where="Eq. 12.18 to 12.21 with phi_c = 0.65, lambda = 1, lambda_s = min(1, 1300/(1000+d)), beta_c the long-to-short column side ratio and alpha_s = 4 (interior) or 3 (edge)."/>
  <p><b>Additions / assumptions.</b> Pass/fail badges; shear check (Eq. 8); the pattern rules above generalise Fig. 12.49 to any span count; optional automatic ψ uses the mean of the adjacent spans as l1 with α1 = 0; envelope design over all patterns. Cracking is ignored (elastic analysis). Exterior slab edges are assumed flush with the column face; corner columns and openings are not modelled; punching check excludes v_M.</p></Card>
 <Card t="Part 2 — Coding Theory"><p>React state holds one <code>model</code> object. <code>solveEFM(model)</code> (pure function, commented SOLVER block) assembles Eq. 1–2 (Hermitian load vector), loops over the load patterns, solves each by Gaussian elimination and returns diagrams and design checks; the UI only renders. Graphics are inline SVG built from the shared <code>SVG_BOX</code> style, <code>Legend</code> component and one <code>CLR</code> object. Save writes <code>{`{version, savedAt, model}`}</code> JSON; Open reads it back. Print waits for <code>MathJax.typesetPromise()</code>, then calls <code>window.print()</code> after a 300 ms delay; print CSS forces a light theme, keeps SVG colors and avoids breaks inside tables, figures and equations.</p></Card>
 <Card t="Part 3 — References (APA 7)"><p>CSA Group. (2019). <i>Design of concrete structures</i> (CSA A23.3-19). CSA Group. <span style={{color:CLR.yellow}}>[edition/year taken from the workbook; clause numbers not independently verified]</span></p>
  <p>Textbook “Design of Two-Way Slabs”, Section 12.7 Elastic Analysis (pp. 597–633), Examples 12.3–12.5. <span style={{color:CLR.yellow}}>[author, publisher, edition and year not stated in the supplied pages; unverified]</span></p></Card></div>;}

function App(){
 const [m,setM]=useState(DEF),[tab,setTab]=useState("Input"),[printing,setPrinting]=useState(false),fi=useRef();
 const r=useMemo(()=>solveEFM(m),[m]),[res,setRes]=useState(null);
 const run=()=>{setRes({m:JSON.parse(JSON.stringify(m)),r:solveEFM(m)});setTab("Results");};
 const stale=res&&JSON.stringify(res.m)!==JSON.stringify(m);
 const save=()=>{const b=new Blob([JSON.stringify({version:"1.0",savedAt:new Date().toISOString(),model:m},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`SlabStrip_working_${new Date().toISOString().replace(/[:.]/g,"-")}.json`;document.body.appendChild(a);a.click();a.remove();};
 const load=e=>{const fl=e.target.files[0];if(!fl)return;const rd=new FileReader();rd.onload=ev=>{try{const p=JSON.parse(ev.target.result);if(p.model){setM(p.model);setRes(null);setTab("Input");}}catch(x){alert("Could not parse working file: "+x.message);}};rd.readAsText(fl);e.target.value="";};
 const print=async()=>{setPrinting(true);await new Promise(r=>setTimeout(r,200));try{await window.MathJax?.typesetPromise?.();}catch(e){}setTimeout(()=>{window.print();setPrinting(false);},300);};
 useEffect(()=>{window.MathJax?.typesetPromise?.().catch(()=>{});},[tab]);
 const show=t=>printing||tab===t;
 return <div style={{minHeight:"100vh"}}>
  <div className="screen-only" style={{background:"rgba(15,23,42,.9)",backdropFilter:"blur(12px)",borderBottom:`1px solid ${CLR.border}`,padding:".8rem 1.5rem",display:"flex",alignItems:"center",gap:"1.25rem",flexWrap:"wrap",position:"sticky",top:0,zIndex:50}}>
   <svg width="38" height="38" viewBox="0 0 40 40" style={{borderRadius:12}}><defs><linearGradient id="lg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stopColor="#0891b2"/><stop offset="1" stopColor={CLR.green}/></linearGradient></defs><rect width="40" height="40" rx="12" fill="url(#lg)"/><path d="M8 24 L32 24 M12 14 L12 30 M28 14 L28 30" stroke={CLR.bg} strokeWidth="2.6" strokeLinecap="round"/></svg>
   <div><div style={{fontWeight:700,fontSize:18}}>SlabStrip <span style={{fontSize:11,fontFamily:MONO,color:CLR.accentSoft,border:`1px solid ${CLR.border2}`,borderRadius:999,padding:"1px 8px"}}>v1.0</span></div><div style={{fontSize:11,color:CLR.muted}}>Two-Way Slab Design Strip · Equivalent Frame Method · CSA A23.3 Cl. 13.8</div></div>
   <div style={{display:"flex",gap:2,marginLeft:"auto",background:CLR.surface,padding:5,borderRadius:12,border:`1px solid ${CLR.border}`}}>{["Input","Results","Theory"].map(t=><button key={t} onClick={()=>setTab(t)} style={{background:tab===t?CLR.accent:"none",border:"none",borderRadius:8,color:tab===t?CLR.bg:CLR.muted,padding:"7px 16px",fontSize:12.5,fontWeight:tab===t?700:500,fontFamily:"inherit"}}>{t}</button>)}</div>
   <button className="btn" onClick={save}>Save</button><button className="btn" onClick={()=>fi.current.click()}>Open</button><input ref={fi} type="file" accept=".json" style={{display:"none"}} onChange={load}/><button className="btn" onClick={print}>Print PDF Report</button><button className="btnp" onClick={run}>▶ Analysis</button></div>
  <div className="print-report-header" style={{padding:"0 0 10px"}}><h2>Two-Way Slab Design Strip — EFM Report</h2></div>
  <div style={{padding:"1.25rem 1.5rem",maxWidth:1280,margin:"0 auto"}}>{show("Input")&&<InputTab m={m} setM={setM} r={r}/>}{show("Results")&&(res?<ResultsTab m={res.m} r={res.r} stale={stale}/>:<Card t="Results"><p style={{fontSize:13,color:CLR.muted}}>Press ▶ Analysis to run the Equivalent Frame analysis.</p></Card>)}{show("Theory")&&<TheoryTab/>}</div></div>;}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
